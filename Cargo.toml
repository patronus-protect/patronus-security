[workspace]
members = [
    "rust",
    "ark-core",
    "ark-core/python",
    "python",
    "ark-api",
    "ark-distributed-protocol",
    "ark-coordinator"
]
resolver = "2"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
debug = false
strip = "debuginfo"
