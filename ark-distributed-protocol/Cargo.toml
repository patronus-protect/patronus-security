[package]
name = "ark-distributed-protocol"
version = "0.1.18"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
# Without default features: no Wolf runtime, so the coordinator image stays model-free.
patronus-ark-core = { path = "../ark-core", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
