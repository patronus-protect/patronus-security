    <rect x="230" y="112" width="28" height="14" fill="#102440"/>
    <rect x="118" y="126" width="154" height="14" fill="#102440"/>
    <rect x="132" y="140" width="14" height="14" fill="#102440"/>
    <rect x="146" y="140" width="14" height="14" fill="#dceeff"/>
    <rect x="160" y="140" width="14" height="14" fill="#102440"/>
    <rect x="174" y="140" width="14" height="14" fill="#dceeff"/>
    <rect x="188" y="140" width="14" height="14" fill="#102440"/>
    <rect x="202" y="140" width="14" height="14" fill="#dceeff"/>
    <rect x="216" y="140" width="14" height="14" fill="#102440"/>
    <rect x="230" y="140" width="14" height="14" fill="#dceeff"/>
    <rect x="244" y="140" width="14" height="14" fill="#102440"/>
    <rect x="132" y="154" width="126" height="14" fill="#102440"/>
    <rect x="90" y="168" width="28" height="14" fill="#102440"/>
    <rect x="132" y="168" width="126" height="14" fill="#102440"/>
    <rect x="272" y="168" width="28" height="14" fill="#102440"/>
    <rect x="90" y="182" width="210" height="14" fill="#102440"/>
    <rect x="90" y="196" width="14" height="14" fill="#102440"/>
    <rect x="104" y="196" width="182" height="14" fill="#dceeff"/>
    <rect x="286" y="196" width="14" height="14" fill="#102440"/>
    <rect x="104" y="210" width="182" height="14" fill="#102440"/>
    <rect x="118" y="224" width="154" height="14" fill="#102440"/>
    <rect x="90" y="266" width="42" height="14" fill="#4eabff"/>
