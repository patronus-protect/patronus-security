<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Patronus Ark — local security scanning for AI and agent traffic">
  <title>Patronus Ark</title>
  <desc>Pixel-art ark next to the Ark wordmark: local scanning for prompt injection, DLP and PII.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#e8eff8"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#ffffff"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="21.5" fill="none" stroke="#e3ecf6" stroke-width="1.5"/>

  <!-- Mark: pixel ark -->
  <g shape-rendering="crispEdges">
    <rect x="174" y="70" width="42" height="14" fill="#102440"/>
    <rect x="160" y="84" width="28" height="14" fill="#102440"/>
