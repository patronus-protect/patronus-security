  <!-- Wordmark -->
  <g font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif">
    <text x="372" y="84" font-size="15" font-weight="500" letter-spacing="3.2" fill="#527391">PATRONUS &#183; OPEN SECURITY SCANNING</text>
    <text x="368" y="158" font-size="64" font-weight="700" letter-spacing="-1" fill="#102440">Ark</text>
    <text x="372" y="210" font-size="27" font-weight="400" fill="#102440">Local scanning for prompt injection, DLP and PII</text>
    <text x="372" y="245" font-size="27" font-weight="400" fill="#102440">in AI and agent traffic.</text>
    <text x="372" y="290" font-size="17" font-weight="400" fill="#527391">Rust &amp; Python &#183; Native L1 rules &#183; Wolf Defender &#183; L2/L3 models</text>
  </g>

  <!-- Progress rule -->
  <line x1="54" y1="324" x2="1146" y2="324" stroke="#e9f3fd" stroke-width="2" stroke-linecap="round"/>
  <circle cx="54" cy="324" r="5" fill="#4eabff"/>
