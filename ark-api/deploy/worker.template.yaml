server:
  bind: "0.0.0.0:8080"
  max_upload_mb: 25
auth:
  keys:
    - name: gateway-internal
      key_hash: "sha256:__WORKER_HASH__"
      categories: [injection, dlp, threat, pii, dynamic-pii, sensitive_document, routing, tool_class, tool_action, tool_tags]
      default_categories: [injection, dlp, threat, pii]
pipeline:
  # Availability/warmup is independent of the default inference selection above.
  categories: [injection, dlp, threat, pii, dynamic-pii, sensitive_document, routing, tool_class, tool_action, tool_tags]
  max_level: L3
  model_dir: /data/models
  download_files: false
  onnx_runtime:
    intra_threads: 1
    inter_threads: 1
    spinning: false
  gates:
    explain: false
    l1: true
    l2: true
    l3: true
    conditional:
      - level: L3
        pipeline: threat
        # Constant false using the existing gate language: a field cannot
        # simultaneously exist and not exist. Threat L1/L2 stay enabled.
        when:
          all:
            - metadata: {path: threat_l3, exists: true}
            - metadata: {path: threat_l3, exists: false}
# Deliberately use the in-memory default cache: no scan data on host disk.
