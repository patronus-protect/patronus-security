server:
  bind: "0.0.0.0:8080"
  max_upload_mb: 25
auth:
  keys:
    - name: gateway-internal
      key_hash: "sha256:__WORKER_HASH__"
      categories: [injection, dlp, jailbreak, prompt_extraction, tool_poisoning, agent_config_tampering, memory_poisoning, exfiltration, unsafe_action, resource_exhaustion, harmful_content, toxic_language, pii, dynamic-pii, sensitive_document, routing, tool_class, tool_action, tool_tags, shell_command]
      default_categories: [pii, dlp, injection, jailbreak, prompt_extraction, tool_poisoning, exfiltration]
pipeline:
  # Availability/warmup is independent of the default inference selection above.
  categories: [injection, dlp, jailbreak, prompt_extraction, tool_poisoning, agent_config_tampering, memory_poisoning, exfiltration, unsafe_action, resource_exhaustion, harmful_content, toxic_language, pii, dynamic-pii, sensitive_document, routing, tool_class, tool_action, tool_tags, shell_command]
  max_level: L3
  # Dedicated Wolf Small v2.2 uses the matching injection NTDB; other enabled
  # model-backed categories use their revision-pinned dedicated bundles.
  l3_strategy: dedicated
  # Keep all NTDB L2 categories, but load L3 only for Wolf and opt-in GLiNER.
  l3_categories: [injection, dynamic-pii]
  wolf:
    model: small
  cache_root: /data/models
  download: never
  onnx_runtime:
    intra_threads: 1
    inter_threads: 1
    spinning: false
  explain: false
  pii_mode: strict
  dlp_mode: strict
  l1: true
  l2: true
  l3: true
  conditional:
    - level: L3
      pipeline: unsafe_action
      # Constant false using the existing gate language: a field cannot
      # simultaneously exist and not exist. unsafe_action L1/L2 stay enabled.
      when:
        all:
          - metadata: {path: threat_l3, exists: true}
          - metadata: {path: threat_l3, exists: false}
# Deliberately use the in-memory default cache: no scan data on host disk.
