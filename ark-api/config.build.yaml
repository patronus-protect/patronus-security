# Used only by the Docker build's asset-warmup stage (`ark-api --warmup-only`)
# to fetch model assets into the image. Never shipped or run as a server.

server:
  bind: "0.0.0.0:8080"

auth:
  keys:
    - name: "build-time-placeholder"
      key_hash: "sha256:3d46dab01df11228e2ccf88613ed995487c65cba309568731273f0988e5416b1"

pipeline:
  # L3 classifier categories share the unified model at runtime. Dynamic PII
  # keeps its separate GLiNER bundle and shell_command its JSON model. All are
  # baked into the final image.
  categories: ["injection", "dlp", "pii", "sensitive_document", "jailbreak", "prompt_extraction", "tool_poisoning", "agent_config_tampering", "memory_poisoning", "exfiltration", "unsafe_action", "resource_exhaustion", "harmful_content", "toxic_language", "routing", "dynamic-pii", "tool_class", "tool_action", "tool_tags", "shell_command"]
  max_level: "L3"
  model_dir: "/data/models"
  download_files: true
