    PL_PESEL: {algorithm: gewichtet 1-3-7-9 mod 10}
    SE_ORGANISATIONSNUMMER: {algorithm: Luhn}
    SE_PERSONNUMMER: {algorithm: Luhn}
    SG_UEN: {algorithm: Prüfbuchstabe mod 11}
    TH_TNIN: {algorithm: gewichtet mod 11}
    TR_NATIONAL_ID: {algorithm: zwei Prüfziffern mod 10}
    UK_NHS: {algorithm: gewichtet mod 11}
