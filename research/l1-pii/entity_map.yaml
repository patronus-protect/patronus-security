    KR_BRN: {algorithm: gewichtet mod 10}
    KR_FRN: {algorithm: gewichtet mod 11}
    KR_RRN: {algorithm: gewichtet mod 11}
    MEDICAL_LICENSE: {algorithm: DEA-Prüfziffer}
