# Entity-Mapping ARK ↔ Presidio ↔ Korpora (L1-PII, Aufgabe E03).
#
# Jede Zeile ist eine Benchmark-ID (Vokabular von patronus_ark.external_pii_eval). Sie nennt
# die ARK-Labels (entity_group in rust/src/detectors/pii/pii.rs), die Presidio-Entitäten der
# gepinnten presidio_analyzer-Version und die Upstream-Labels der Korpora aus
# python/patronus_ark/benchmark_data/external_pii/manifest.json (Vergleich ohne Groß-/Kleinschreibung).
#
# Scopes:
#   shared         ARK und Presidio erkennen die Entität per Muster; zählt für M1 und „Immer“.
#   ark_only       nur ARK; zählt für M2/M3, Presidio hat dort Recall 0.
#   presidio_only  nur Presidio; Kandidaten für A/C-Aufgaben, ARK hat dort Recall 0.
#   semantic       NER-Entitäten (PERSON, LOCATION, ORG, NRP, Datum, Adresse); kein L1-Scope,
#                  dort treten L1 + dynamic-pii (L3) an. ARK-L1 meldet sie nie.
#
# Regeln (prüft scripts/l1_presidio/entity_map.py check, Test scripts/tests/test_l1_entity_map.py):
#   - jedes ARK-Label der Registry genau einmal, keine Labels, die die Registry nicht kennt;
#   - jede Presidio-Entität höchstens einmal (mit installiertem Presidio: genau die Registry);
#   - jedes Korpus-Label genau so wie im Manifest;
#   - ARK_OUTPUT_MAP (external_pii_eval) und PRESIDIO_OUTPUT_MAP (run_presidio.py) widersprechen
#     der Tabelle nicht. Sie dürfen Teilmengen sein: dort fehlende Labels bleiben ark.<LABEL> bzw.
#     presidio.<ENTITY> und werden erst gewertet, wenn ein Gold-Set die ID trägt.
#
# Granularität: Dokumentklassen (Pass, Führerschein, Ausweis, Kennzeichen) sind länderübergreifend
# eine ID, wie im bestehenden Vokabular. Nationale Nummernsysteme mit eigener Prüfziffer bekommen
# eine Länder-ID (pii.<land>.<name>). Das Mapping ist labelgenau: Meldet eine neue Regel ein
# bestehendes ARK-Label für eine andere Entität (z. B. NATIONALID außerhalb UK), braucht sie ein
# eigenes Label.

schema: ark-l1-entity-map-v1
presidio_version: 2.2.364

entities:
  # ── shared ─────────────────────────────────────────────────────────────
  - id: pii.email
    scope: shared
    ark: [EMAIL]
    presidio: [EMAIL_ADDRESS]
    corpora:
      ai4privacy-openpii-nano-1k: [EMAIL]
      gretel-synthetic-pii-finance: [EMAIL]

  - id: pii.phone
    scope: shared
    ark: [PHONE]
    presidio: [PHONE_NUMBER]
