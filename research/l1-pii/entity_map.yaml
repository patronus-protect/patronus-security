    DE_LANR: {algorithm: gewichtet 4-9 mod 10}
    DE_PASSPORT: {algorithm: ICAO 9303 7-3-1, country: de}
    DE_SOCIAL_SECURITY: {algorithm: "VKVV § 4"}
    DE_TAX_ID: {algorithm: "ISO 7064 MOD 11,10"}
