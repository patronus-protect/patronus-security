# ── M3: prüfziffervalidierte Entitäten (Zählregel T03, research/l1-pii/README.md) ──
# Gezählt wird je Benchmark-ID und Land eine Einheit, wenn mindestens ein Validator eine echte
# Prüfziffer bzw. Prüfsumme rechnet. null = nur Format/Plausibilität (Länge, Alphabet, Bereich,
# Datum, Bezirkstabelle) und zählt nicht. Das Land kommt aus der ID (pii.<land>.*) oder aus
# `country`; ohne beides gilt die Einheit als international (IBAN, PAN, Krypto) und zählt einmal.
# Prüft und zählt: scripts/l1_presidio/count_validated.py (Test scripts/tests/test_l1_count_validated.py).
checksums:
  # Validator-Funktion in rust/src/detectors/pii/validators.rs, wie in PII_PATTERNS eingetragen.
  # Jeder dort verwendete Validator steht hier, auch die reinen Formatprüfungen.
  ark:
    payment_card: {algorithm: Luhn}             # plus IIN-Präfix und Länge je Marke (B-PAN)
    mod97: {algorithm: ISO 7064 MOD 97-10}
    steuer_id: {algorithm: "ISO 7064 MOD 11,10"}
    steuer_id_issued: {algorithm: "ISO 7064 MOD 11,10"}   # plus BZSt-Ziffernverteilung (K05, kontextfrei)
    ip_address: null
    email_domain: null                  # B-EMAIL, Top-Level-Domain laut IANA oder Platzhalter (T01)
    unanchored_phone: null
    phone: null
    mac_address: null
    cvv: null
    card_expiry: null
    bic: null
    bounded_employee_identifier: null
    bounded_identifier: null
    username: null
    calendar_date: null
    written_calendar_date: null
    de_tax_number: null                 # Länge 10–13, nicht alle Ziffern gleich
    de_social_security_number: {algorithm: "VKVV § 4, Quersummen gewichtet 2-1-2-5-7-1-2-1-2-1-2-1 mod 10"}  # B-DE1, RVNR, plus Geburtstag/-monat
    de_health_insurance_number: {algorithm: "§ 290 SGB V, Quersummen gewichtet 1-2 mod 10"}  # B-DE1, KVNR
    lanr: {algorithm: "gewichtet 4-9 mod 10"}  # B-DE1, LANR
    de_document_number: null            # ICAO-Alphabet, keine Prüfziffer (gedruckte Serie, feldgebunden)
    de_driver_license_number: null      # 11 Zeichen, keine Prüfziffer
    us_driver_license_number: null      # F15, Formate der Bundesstaaten, keine Prüfziffer
    it_driver_license_number: null      # F15, Patente-Form, keine Prüfziffer
    nine_digits: null                   # B-UK/B-DE1, neun Ziffern (UK-Pass, BSNR), keine Prüfziffer
    passport_number_two_letters: null   # zwei Buchstaben + sieben Ziffern (Irland, Japan), keine Prüfziffer
    uk_driver_license_number: null      # B-UK, Nachname, Geburtsdatum, Initialen; DVLA-Prüfzeichen unveröffentlicht
    us_ssn: null                        # Bereichsprüfung
    aba_routing_number: {algorithm: "ABA 3-7-1 mod 10", country: us}  # B-ACCT, plus Routing-Symbol 00–12/21–32/61–72/80
    us_ssn_context_free: null           # B-SSN, Bereichsprüfung ohne Platzhalter, keine Prüfziffer
    uk_nino: null                       # Präfix-/Suffixprüfung
    uk_nino_context_free: null          # B-UK, wie uk_nino in einer Schreibweise (groß oder klein)
    uk_bban: null                       # T29, GB-BBAN (Bankcode, Sort Code, Konto), keine Prüfziffer
    de_licence_plate: null              # T30, Kfz-Kennzeichen DE (≤ 8 Zeichen, Nummer ohne führende Null), keine Bezirksliste
    uk_vehicle_registration: null       # T30, UK-Kennzeichen (Altersbezeichner 02–29/51–79), keine Prüfziffer
    uk_nhs_number: {algorithm: gewichtet 10…1 mod 11}       # B-UK, NHS-Nummer
    au_abn: {algorithm: "gewichtet 10-1-3-5-…-19 mod 89 (erste Ziffer − 1)"}  # B-APAC, ABN
    au_acn: {algorithm: "(10 − gewichtet 8…1 mod 10) mod 10"}          # B-APAC, ACN
    au_tfn: {algorithm: "gewichtet 1-4-3-7-5-8-6-9-10 mod 11"}         # B-APAC, TFN
    au_medicare: {algorithm: "gewichtet 1-3-7-9 mod 10"}               # B-APAC, Medicare
    sg_nric_fin: {algorithm: "Prüfbuchstabe gewichtet 2-7-6-5-4-3-2 mod 11 je Serie"}  # B-APAC, NRIC/FIN
    sg_uen: {algorithm: "Prüfbuchstabe mod 11 je Format A/B/C"}        # B-APAC, UEN
    se_personnummer: {algorithm: Luhn}                                 # B-NORD, plus Geburtsdatum (Tag + 60: samordningsnummer)
    dk_cpr: {algorithm: "gewichtet 4-3-2-7-6-5-4-3-2-1 mod 11"}        # B-NORD, nur Nummern mit Prüfsumme (seit 2007 nicht mehr jede)
    no_fodselsnummer: {algorithm: "zwei Prüfziffern mod 11 (3-7-6-1-8-9-4-5-2-1, 5-4-3-2-7-6-5-4-3-2-1)"}  # B-NORD, auch D-/H-Nummer
    fi_hetu: {algorithm: Kontrollzeichen mod 31}                       # B-NORD, henkilötunnus
    fr_nir: {algorithm: "Schlüssel 97 − (13 Stellen mod 97), 2A/2B als 19/18"}  # B-EU1, NIR (numéro de sécurité sociale)
    fr_siren: {algorithm: Luhn}                                         # B-EU1, SIREN
    fr_siret: {algorithm: "Luhn (La Poste: Quersumme mod 5)"}           # B-EU1, SIRET
    nl_bsn: {algorithm: "11-Probe, gewichtet 9…2 und −1 mod 11"}         # B-EU1, BSN
    be_national_number: {algorithm: "97 − (9 Stellen mod 97), ab 2000 mit vorangestellter 2"}  # B-EU1, Nationalregisternummer
    se_organisationsnummer: {algorithm: Luhn}                          # B-LUHN, dritte Ziffer ≥ 2
    ca_sin: {algorithm: Luhn}                                          # B-LUHN, erste Ziffer nicht 0 oder 8
    tr_national_id: {algorithm: "zwei Prüfziffern mod 10"}             # B-LUHN, T.C. Kimlik No
    za_id_number: {algorithm: Luhn}                                    # B-LUHN, plus Geburtsdatum, Staatsangehörigkeit 0–2, 8/9
    de_vat_id: {algorithm: "ISO 7064 MOD 11,10"}            # B01, USt-IdNr.
    at_vat_id: {algorithm: Luhn-Variante (6 − Summe) mod 10}  # B01, UID ATU
    ch_vat_id: {algorithm: gewichtet 5-4-3-2-7-6-5-4 mod 11}   # B01, UID CHE
    fr_vat_id: {algorithm: Schlüssel (12 + 3 × SIREN) mod 97 + SIREN-Luhn}  # B01
    nl_vat_id: {algorithm: gewichtet mod 11 / ISO 7064 MOD 97-10}           # B01, btw-id
    be_vat_id: {algorithm: 97 − (Nummer mod 97)}           # B01
    it_vat_id: {algorithm: Luhn}                           # B01, Partita IVA plus Amtscode
    es_vat_id: {algorithm: Kontrollzeichen mod 23 / CIF-Luhn}  # B01, NIF-IVA
    bg_vat_id: {algorithm: "gewichtet 1…8 (3…10) mod 11 / EGN, LNCh, sonstige mod 11 bzw. mod 10"}  # B02, ИН по ДДС
    cy_vat_id: {algorithm: Prüfbuchstabe mod 26}                  # B02, ΦΠΑ
    cz_vat_id: {algorithm: gewichtet 8…2 mod 11 / Geburtsnummer mod 11}  # B02, DIČ
    dk_vat_id: {algorithm: gewichtet 2-7-6-5-4-3-2-1 mod 11}       # B02, CVR
    ee_vat_id: {algorithm: gewichtet 3-7-1 mod 10}                 # B02, KMKR
    el_vat_id: {algorithm: gewichtet 2^n mod 11, country: gr}      # B02, ΑΦΜ mit Präfix EL
    fi_vat_id: {algorithm: gewichtet 7-9-10-5-8-4-2-1 mod 11}      # B02, ALV
    hr_vat_id: {algorithm: "ISO 7064 MOD 11,10"}                   # B02, OIB
    hu_vat_id: {algorithm: gewichtet 9-7-3-1 mod 10}               # B02, közösségi adószám
    ie_vat_id: {algorithm: Prüfbuchstabe gewichtet 8…2 mod 23}     # B02
    lt_vat_id: {algorithm: "gewichtet 1…9 mod 11, zweite Stufe +2"}  # B02, PVM kodas
    lu_vat_id: {algorithm: "erste sechs mod 89"}  # B16, numéro TVA
    lv_vat_id: {algorithm: "gewichtet 9-1-4-8-3-10-2-5-7-6-1 mod 11 = 3"}  # B16, PVN juristischer Personen
    mt_vat_id: {algorithm: "gewichtet 3-4-6-7-8-9-10-1 mod 37"}  # B16
    pl_vat_id: {algorithm: "gewichtet 6-5-7-2-3-4-5-6-7 mod 11"}  # B16, NIP
    pt_vat_id: {algorithm: "11 − gewichtet 9…2 mod 11"}  # B16, NIF
    ro_vat_id: {algorithm: "10 × gewichtet 7-5-3-2-1-7-5-3-2 mod 11"}  # B16, CUI/CIF
    se_vat_id: {algorithm: "Luhn (Organisationsnummer) + 01"}  # B16, momsregistreringsnummer
    si_vat_id: {algorithm: "11 − gewichtet 8…2 mod 11"}  # B16, ID za DDV
    sk_vat_id: {algorithm: "Nummer mod 11"}  # B16, IČ DPH
    no_vat_id: {algorithm: "gewichtet 3-2-7-6-5-4-3-2-1 mod 11"}  # B16, Organisationsnummer + MVA
    gb_vat_id: {algorithm: "gewichtet 8-7-6-5-4-3-2-10-1 mod 97 (auch 9755)"}  # B16, GB und XI (Nordirland), eine Einheit
    de_passport_number: {algorithm: ICAO 9303 7-3-1, country: de}        # F08, Serie C F G H J K oder alt numerisch
    de_identity_card_number: {algorithm: ICAO 9303 7-3-1, country: de}   # F08, Serie L M N P R T V W X Y oder alt numerisch
  # Pattern-Recognizer mit validate_result in presidio_analyzer 2.2.364 (43 Stück, mit Presidio
  # vollständig geprüft von `count_validated.py check --presidio`).
  presidio:
    ABA_ROUTING_NUMBER: {algorithm: ABA 3-7-1 mod 10, country: us}
    AU_ABN: {algorithm: gewichtet mod 89}
    AU_ACN: {algorithm: gewichtet mod 10}
    AU_MEDICARE: {algorithm: gewichtet 1-3-7-9 mod 10}
    AU_TFN: {algorithm: gewichtet mod 11}
