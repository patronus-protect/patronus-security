# L1-PII backlog. One scheduled run completes exactly one task.
# Selection (deterministic, ark-l1 next): first task in file order with status: todo,
# all deps done and no open needs_decision.
# status: missing = todo; the runner sets done when publishing. Blocked: ~/ark-l1/state/blocked.json
#
# Shared acceptance (applies to every task in addition to `accept`):
#   tests_first:  goldens via generate_l1_goldens.py (>= 5 positives + 5 hard negatives per language,
#                 DE + EN, plus the national language for country IDs), entry in
#                 rust/tests/fixtures/l1_bilingual_rules.json, Rust unit tests incl. checksum vectors
#                 (valid/invalid) — committed before the implementation.
#   gate:         cargo fmt --check, clippy -D warnings, cargo test -p patronus-ark,
#                 13_l1_golden_eval green, scoreboard without regression (> 0.5 pp F1 per entity),
#                 0 new FP on hard negatives, 100 KiB p95 at most +10 %.
#   docs:         CHANGELOG "Detection change", l1-rule-catalog via scripts/generate_docs.py.
#   no_relax:     never relax validators to buy recall; recall comes from context/structure/score.

setup:  # one-off, not run by the timer
  - {id: S01, title: "VPS: Rust, Presidio + spaCy en/de lg, gh, Claude Code, repo clone", status: done}
  - {id: S02, title: "gh auth as ubuntu (fine-grained token Contents + PRs)", status: done}
  - {id: S03, title: "runner/install.sh, secrets.env with CLAUDE_CODE_OAUTH_TOKEN, enable timer", status: manual}

tasks:
  # ── E: Measurement infrastructure ─────────────────────────────────────
  - id: E01
    status: done
    title: Presidio runner (default + tuned) → predictions in external_pii_eval format
    type: eval-infra
    deps: []
    accept: scripts/l1_presidio/run_presidio.py, pinned requirements, both profiles reproducible

  - id: E02
    status: done
    title: ARK runner in the same prediction format (Python bindings), incl. score field
    type: eval-infra
    deps: [E01]

  - id: E03
    status: done
    title: Entity mapping ARK ↔ Presidio ↔ corpora with scopes (shared, ark_only, presidio_only, semantic)
    type: eval-infra
    deps: [E01]
    accept: research/l1-pii/entity_map.yaml, test that every ARK label is mapped

  - id: E04
    status: done
    title: Load corpora + freeze dev/holdout split (Gretel Finance, OpenPII Nano, TAB)
    type: eval-infra
    deps: [E03]
    accept: >-
      scripts/l1_presidio/prepare_corpora.py --dev-out DIR --holdout-out DIR (manifest with SHA-256,
      writes DIR/.ready); the gate runs it outside the sandbox, the agent only sees dev

  - id: E05
    status: done
    title: Synthetic DE/EU gold set (letter, form, invoice, doctor's letter, JSON, CSV, ticket)
    type: eval-infra
    deps: [E03]
    accept: generator with separate seeds for dev/holdout, spans in code points, all E03 labels covered

  - id: T01
    status: done
    title: Define the gold convention for placeholder values (RFC 2606/6761 domains, .invalid, NANP 555-01xx/000) and align gold
    type: eval-infra
    deps: [E03]
    decision: "2026-10-14: reserved placeholder values (RFC 2606/6761 domains, .invalid, NANP 555-01xx/000) are PII, gold positive; no detector change needed"
    source: TRIAGE 2026-W42 (research/l1-pii/triage/2026-W42.md, bucket 5)
    question: >-
      The EN blind set treats customer@example.com and +1 000-000-0000 as negative, the DE blind set treats
      …@kundenbeispiel.invalid as positive, l1_bilingual_rules.json uses ada@example.com as positive.
      Do reserved domains/numbers count as PII (gold positive) or as hard negatives?
    accept: >-
      Convention in research/l1-pii/README.md; demo_pii_dlp*, pii_l1 and E05 gold consistent afterwards;
      detector change (if negative) as a separate follow-up task, not here

  - id: E06
    status: done
    title: Scoreboard (exact + overlap P/R/F1, DE/EN, hard-negative FP, delta to base, exit code on regression)
    type: eval-infra
    deps: [E02, E04, E05]
    accept: >-
      scripts/l1_presidio/scoreboard.py gate --head WT --base-sha SHA --dev DIR --holdout DIR --cache DIR;
      exit 1 on regression, summary on stdout; base results per SHA in the cache

  - id: E07
    status: done
    title: Latency benchmark ARK vs. Presidio (short/4 KiB/100 KiB) on the VPS
    type: eval-infra
    deps: [E06]

  - id: E08
    status: done
    title: Switch 12_l1_pii_fixture_eval to character offsets
    type: fix
    deps: []

  - id: E09
    status: done
    title: Add 13_l1_golden_eval to CI
    type: eval-infra
    deps: [E08]

  - id: E10
    status: done
    title: Golden schema v2 (N per language, difficulty tags no_context/structured/obfuscated/ocr) + coverage per rule_id
    type: eval-infra
    deps: [E09]

  - id: T02
    status: done
    title: Gold hygiene - annotate secondary entities in pii_l1 positives, test gold values of checksum-based labels against the validators
    type: eval-infra
    deps: [E10]
    source: TRIAGE 2026-W42 (research/l1-pii/triage/2026-W42.md, buckets 6 + 7)
    accept: >-
      generate_l1_goldens.py annotates every real entity in the text (e.g. PAN in CVV positives, phone in
      pii_l1-email-pos-01); test that every gold value of IBAN/CREDITCARD/STEUERID/… passes the
      validator; Luhn-invalid credit_card values in dynamic_pii.jsonl are excluded from L1 evaluations
      or marked invalid; validators stay unchanged

  - id: T16
    title: Report gold gaps of the neutral corpora separately (duplicate values, checksum-invalid gold) without editing the corpora
    type: eval-infra
    deps: [E06]
    needs_decision: true
    source: "TRIAGE 2026-W43 (research/l1-pii/triage/2026-W43.md, buckets 13 + 14)"
    question: >-
      Gretel annotates only one copy of `[x@y.com](mailto:x@y.com)` (117 Ark email FP on dev), leaves many
      personal and role addresses, fax numbers and `Account Number: 123456789` unannotated, and 14/70 IBAN and
      21/53 PAN gold values fail mod97/Luhn (Nano: 65/82 PAN). Ark and Presidio pay for this alike, but it
      dominates small F1 margins (Gretel email: Ark 52.2 vs tuned 51.3). Should the scoreboard (a) keep
      scoring as is and only report these buckets, (b) not count a prediction as FP when its value equals an
      annotated gold value of the same id in the same row, and/or (c) exclude checksum-invalid gold of
      checksum-validated ids from recall for both engines? The frozen corpora stay unchanged in every option.
    accept: >-
      scoreboard.py reports per corpus and entity: predictions equal to an annotated gold value elsewhere in
      the row, and gold values failing the entity's validator; gate metrics change only as decided; tests

  - id: E12
    status: done
    title: Presidio-favored gold sets (presidio-evaluator synthetic data, Presidio recognizer test cases) + scoring per source family
    type: eval-infra
    deps: [E06]
    accept: >-
      prepare_corpora.py adds a presidio_favored family with dev/holdout split and SHA-256 manifest: synthetic
      sentences from microsoft/presidio-research (presidio-evaluator, MIT, pinned commit) and the positive/negative
      examples of the presidio-analyzer recognizer tests (MIT, pinned to 2.2.364). Every gold source is tagged
      ark_authored (pii_l1, l1_bilingual_rules, E05 synthetic), neutral (Gretel Finance, OpenPII Nano, TAB) or
      presidio_favored; the scoreboard reports P/R/F1 per family. M1 must hold on neutral and on presidio_favored
      separately; ark_authored results are reported but never decide a milestone. Fairness rule in
      research/l1-pii/README.md

  - id: E11
    status: done
    title: Baseline report ARK vs. Presidio + error buckets
    type: report
    deps: [E06, E07, E12]
    accept: research/l1-pii/scoreboard/baseline.md; gaps as candidates for TRIAGE

  - id: T03
    status: done
    title: M3 counting rule (checksum-validated entities ARK vs. Presidio 2.2.364) + counting script
    type: eval-infra
    deps: [E03]
    decision: "2026-10-14: count only real check digits/checksums, each country separately, format-only validation does not count; Presidio pinned to 2.2.364; M3 target lowered to 2x (about 80 entities), update README accordingly"
    source: TRIAGE 2026-W42 (research/l1-pii/triage/2026-W42.md, section coverage)
    question: >-
      Presidio 2.2.364 has 43 pattern recognizers with validate_result (≈ 40 entities) → 3× ≈ 120;
      the backlog reaches roughly 60–80. What counts as an entity (VAT ID per country separately? format
      validation such as licence plates?), is the Presidio version considered pinned, and do we add
      TH/NG/PH or adjust the M3 target?
    accept: >-
      Rule in research/l1-pii/README.md; scripts/l1_presidio/count_validated.py counts from
      entity_map.yaml and the Presidio registry, with a test

  - id: T15
    title: Define which Ark mode is scored for M1-M3 (strict default vs. balanced) and score both modes
    type: eval-infra
    deps: [E06, K02]
    needs_decision: true
    source: "TRIAGE 2026-W43 (research/l1-pii/triage/2026-W43.md, section mode)"
    question: >-
      K02 keeps strict as the bit-identical default; balanced/recall are opt-in. Presidio tuned emits
      context-free patterns and raises them by context (threshold 0.4). The largest M1 gaps on neutral dev
      corpora (US SSN Gretel 45.6 vs 66.7, passport Nano 3.7 vs 29.4, driver's licence 0 vs 6) only close with
      context-weighted or context-free findings. Are M1-M3 measured on the default (strict) build, on
      balanced, or on the better of both per entity? Does the gate guard both modes?
    accept: >-
      Rule in research/l1-pii/README.md; scoreboard.py gate scores the decided modes for head and base
      (strict always), report per mode; tests

  # ── K: Engine ─────────────────────────────────────────────────────────
  - id: K01
    status: done
    title: Split pii.rs into modules (core, de, intl, us, uk, eu, …) without behaviour change
    type: refactor
    deps: [E10]
    accept: goldens and scoreboard bit-identical

  - id: K02
    status: done
    title: Score model (base per rule + validator strength checksum/format/none + context bonus) and modes strict/balanced/recall
    type: engine
    deps: [K01, E11]
    decision: "2026-10-11 approved: strict is the default and bit-identical; balanced/recall opt-in only"
    accept: >-
      strict = current behaviour (default, goldens and scoreboard bit-identical); balanced/recall only via
      explicit configuration; score field and modes in docs/reference/result-schema.md

  - id: K03
    status: done
    title: Context engine v2 (two-sided proximity, DE/EN lexicon from pii.json, counter-context such as order/invoice numbers)
    type: engine
    deps: [K02]

  - id: K04
    status: done
    title: Structure awareness (JSON keys, CSV headers, key-value, Markdown/HTML tables as context)
    type: engine
    deps: [K03]

  - id: K05
    status: done
    title: Context-free output of checksum-strong values in balanced mode
    type: engine
    deps: [K03]

  - id: K06
    title: Obfuscation (at/ät/dot/punkt, spaced digits, full-width, zero-width) with offset back-mapping
    type: engine
    deps: [K03]

  - id: K07
    title: Cross-label overlap resolution with priorities in balanced/recall (IBAN vs. PAN vs. account vs. phone)
    type: engine
    deps: [K05]

  - id: T07
    title: "Strict: do not emit a PAN sub-span inside a valid IBAN or FINANCIAL_ACCOUNT_NUMBER on an IBAN value"
    type: precision-fix
    deps: [K02]
    decision: "2026-10-14: strict keeps emitting both labels bit-identically, but the PAN sub-span inside a valid IBAN and FINANCIAL_ACCOUNT_NUMBER on an IBAN value are marked as secondary evidence; the scoreboard scores primary findings only"
    source: TRIAGE 2026-W42 (research/l1-pii/triage/2026-W42.md, bucket 4)
    question: >-
      pii.rs deliberately keeps cross-label overlaps ("Evidence retains both labels"), and K02 keeps strict
      bit-identical. Should strict suppress the double labels, only mark them as secondary evidence
      (scoreboard scores primary), or is this left to K07 alone (balanced/recall)?

  - id: T26
    title: Field-name lexicon FR/ES/IT/NL for the existing anchor rules (DOB, customer/employee ID, account number, CVV, SSN, passport, username)
    type: recall-fix
    deps: [K03]
    source: "TRIAGE 2026-W43 (research/l1-pii/triage/2026-W43.md, bucket 12)"
    accept: >-
      Gretel dev has 660 FR/ES/IT/NL rows with 280 Ark FN, many behind field names such as Fecha de
      Nacimiento, Data di Nascita, date de naissance, klantnummer, bankrekeningnummer, code de sécurité.
      Lexicon entries in the K03 lexicon, goldens per language (>= 5 positives + 5 hard negatives each for
      FR, ES, IT, NL), validators unchanged

  # ── F: Repair existing rules ──────────────────────────────────────────
  - {id: T04, title: "US phone: span boundary for parenthesized area code, (415) 555-2671 instead of 415) 555-2671", type: fix, deps: [E06], source: "TRIAGE 2026-W42, bucket 2"}
  - id: T17
    title: "Phone precision in strict: no matches inside EDI/X12/SWIFT MT elements, zero-padded IDs, 6-4 digit groups"
    type: precision-fix
    deps: [E06]
    source: "TRIAGE 2026-W43 (research/l1-pii/triage/2026-W43.md, buckets 1 + 2)"
    accept: >-
      Hard negatives DE + EN: EDIFACT elements (`UNB+UNOC:3+520173321::2`, `NAD+BY+987654321`, `DTM+137:2022…`),
      X12 (`ST*850*0000012345~`), SWIFT MT (`:62F:/0000001234/`), zero-padded IDs, SE/FI personal numbers
      `712390-9678`; pii_phone_international does not start inside an alphanumeric or `:`-delimited run,
      pii_phone_us requires a separator pattern a real NANP number uses (3-3-4), not 6-4. Positives with
      `+49 …`, `+1 …` and placeholder numbers (T01) stay; Gretel dev: ≥ 100 of 161 phone FP gone
  - id: T18
    title: "Phone span boundaries: no line break inside a number, NANP trunk prefix 1- (1-800-123-4567), 00 international prefix"
    type: fix
    deps: [T04]
    source: "TRIAGE 2026-W43 (research/l1-pii/triage/2026-W43.md, bucket 3)"
    accept: >-
      `+1-123-456-7890\n\n2` ends before the line break (pii_phone_international uses `\s`); `1-800-123-4567`
      and `1 (800) 123-4567` include the trunk prefix; `0049 …`/`001 …` keep the prefix; no new matches elsewhere
  - {id: F01, title: "Phone regional via the phonenumber crate (DE/AT/CH/US/UK/FR/…), check cargo-deny", type: recall-fix, deps: [K03]}
  - id: T19
    title: "Credit card precision in strict: IIN ranges + lengths per brand, no PAN after `+`, in date-time stamps or token segments"
    type: precision-fix
    deps: [E06]
    source: "TRIAGE 2026-W43 (research/l1-pii/triage/2026-W43.md, bucket 4; strict part of F02 pulled forward)"
    accept: >-
      Hard negatives DE + EN: `+44 20 1234 5678`, `+49 123 456 7890` (no PAN sub-span), `202201010800`,
      `20220314-123456`, `xoxb-…-485275870833-…`, ZA ID numbers and KR RRN that pass Luhn; IIN/length table
      with tests per brand; every Luhn-valid PAN gold value in pii_l1, the rule fixture and the dev corpora
      stays found; Luhn unchanged
  - {id: F02, title: "Credit card: IIN ranges + lengths per brand, context-free in balanced", type: recall-fix, deps: [K05]}
  - {id: T05, title: "Grouped IBAN for all countries in strict mode (blocks of four with letters, e.g. GB82 WEST 1234 5698 7654 32), mod97 unchanged", type: recall-fix, deps: [E06], source: "TRIAGE 2026-W42, bucket 1; M1 risk IBAN"}
  - id: T21
    title: "IBAN length per country in strict (SWIFT IBAN registry), SEPA creditor IDs (DE98ZZZ09999999999) are no IBAN"
    type: precision-fix
    deps: [T05]
    source: "TRIAGE 2026-W43 (research/l1-pii/triage/2026-W43.md, bucket 6; strict part of F03 pulled forward)"
    accept: >-
      Both Ark hard-negative FP on the synthetic dev set are creditor IDs (`DE30ZZZ56545348553` passes mod97);
      length table from the SWIFT IBAN registry with a test per country, creditor IDs as hard negatives DE + EN;
      mod97 unchanged, no IBAN gold value lost
  - {id: F03, title: "IBAN: per-country length table (SWIFT-Registry), grouped/lowercase variants, DE recall", type: recall-fix, deps: [K05]}
  - {id: F04, title: "BIC: ISO 3166 check, low context when an IBAN is nearby", type: recall-fix, deps: [F03]}
  - {id: T06, title: "Email: no matches in URL userinfo (scheme://user:pass@host), credentials stay DLP", type: precision-fix, deps: [E06], source: "TRIAGE 2026-W42, bucket 3"}
  - id: T20
    title: "IPv6: no compressed IPv6 inside colon-delimited SWIFT MT / EDIFACT tag chains (:60F::61F:, LIN+1::1:550)"
    type: precision-fix
    deps: [E06]
    source: "TRIAGE 2026-W43 (research/l1-pii/triage/2026-W43.md, bucket 5; M1 risk IP)"
    accept: >-
      Hard negatives DE + EN for the 9 Gretel dev shapes (`:28C::52D:`, `:60F::61F::62F:`, `380:21:3::90`,
      `::EA:20`); a compressed IPv6 directly preceded or followed by a further `:`-group is no match;
      `2001:db8::1`, `fe80::1%eth0`, `::1` and full IPv6 stay found
  - id: T23
    title: "Email: Unicode local parts (RFC 6531) and apostrophes, e.g. moeleprêtr@outlook.com, o'neil@example.com"
    type: recall-fix
    deps: [E06]
    source: "TRIAGE 2026-W43 (research/l1-pii/triage/2026-W43.md, bucket 9; M1 risk email on OpenPII Nano)"
    accept: >-
      Nano dev: the 6 Unicode/apostrophe addresses Presidio finds are found; offsets in code points; hard
      negatives for obfuscated addresses (T01 convention) and for `'@` in prose/code stay negative
  - {id: F05, title: "Email: IANA TLD list, IDN, obfuscated variants", type: precision-fix, deps: [K06]}
  - id: T22
    title: "Date of birth in strict: ISO 8601 (1988-05-19) and ordinal dates (18th December 1983) after an existing DOB field name"
    type: recall-fix
    deps: [E06]
    source: "TRIAGE 2026-W43 (research/l1-pii/triage/2026-W43.md, bucket 8)"
    accept: >-
      `date of birth: 1926-01-20`, `DateOfBirth=1951-09-12`, `Geburtsdatum: 1985-01-16`, `Date of Birth:
      18th December 1983`; calendar validation unchanged; ISO dates without a DOB field name (invoice dates,
      timestamps) stay negative; geb./born on remain F06
  - {id: F06, title: "Date of birth: spelled-out months, geb./born on, numeric with context", type: recall-fix, deps: [K03]}
  - {id: F07, title: "US SSN without separators with context", type: recall-fix, deps: [K03]}
  - id: T25
    title: "US SSN AAA-GG-SSSS with proximity and structural context (Social Security Number (SSN) …, ssn=, \"ssn\":, <SSN>)"
    type: recall-fix
    deps: [K04]
    source: "TRIAGE 2026-W43 (research/l1-pii/triage/2026-W43.md, bucket 11; largest M1 gap: Gretel SSN Ark 45.6 vs tuned 66.7)"
    accept: >-
      SSA range validator unchanged; Gretel dev SSN F1 ≥ Presidio tuned; hard negatives for dashed
      3-2-4 values without SSN context (order, reference and part numbers) stay negative in strict
  - {id: F08, title: "Passport/ID card DE: ICAO 9303 check digits (7-3-1), old + new formats", type: precision-fix, deps: [K02]}
  - {id: F09, title: "MRZ lines TD1/TD3 as a separate entity", type: new-entity, deps: [F08]}
  - id: T24
    title: "Passport numbers outside DE after an explicit passport field name (passport number/no., Reisepass, pasaporte, passeport, passaporto, paspoort)"
    type: recall-fix
    deps: [F08]
    source: "TRIAGE 2026-W43 (research/l1-pii/triage/2026-W43.md, bucket 10; M1 risk passport on OpenPII Nano: Ark 3.7 vs tuned 29.4)"
    accept: >-
      42 of 83 passport FN on Gretel + Nano dev have a passport field name within 45 characters; format-only
      rule for 6-9 alphanumerics with at least 5 digits; values in DE passport form that fail the ICAO 9303
      check stay negative (no_relax); per-country formats with check digits stay in A05/B08
  - {id: F10, title: "KVNR check digit", type: precision-fix, deps: [K02]}
  - {id: F11, title: "Pension insurance number (RVNR) check digit", type: precision-fix, deps: [K02]}
  - {id: F12, title: "LANR check digit + BSNR as a new entity", type: precision-fix, deps: [K02]}
  - {id: F13, title: "Tax number (Steuernummer): formats per federal state + 13-digit ELSTER format", type: precision-fix, deps: [K02]}
  - {id: F14, title: "Username/customer/employee/account IDs via structural context (Gretel recall)", type: recall-fix, deps: [K04]}
  - {id: F15, title: "Driver's licence DE + US states with context", type: recall-fix, deps: [K03]}
  - {id: F16, title: "Licence plate DE: valid list of district codes", type: precision-fix, deps: [K02]}
  - {id: F17, title: "CVV/expiry date: recall via structure, keep coupling to PAN", type: recall-fix, deps: [K04, F02]}
  - id: T14
    title: "FP: digit-only IDs in URL paths (GitHub Actions /actions/runs/<id>/job/<id>) detected as L1 PII"
    type: precision-fix
    deps: []
    accept: >-
      Observed 2026-10-13 in the runtime hook on `gh pr checks`: a 12-digit job ID at the end of an Actions URL was
      redacted as pii/l1 (confidence 1), identically shaped IDs in the same output were not. First identify the
      triggering rule; hard negatives for digit segments in URL paths (Actions runs/jobs, issue/PR numbers, numeric
      REST IDs) DE + EN; a digit sequence without PII context in a URL path → no match

  # ── B: DACH/EU depth ──────────────────────────────────────────────────
  - {id: B01, title: "VAT ID part 1: DE, AT, CH, FR, NL, BE, IT, ES with checksums", type: new-entity, deps: [K05]}
  - {id: B02, title: "VAT ID part 2: remaining EU + XI, NO, GB", type: new-entity, deps: [B01]}
  - {id: B03, title: "Commercial register number HRA/HRB with local court context", type: new-entity, deps: [K03]}
  - {id: B04, title: "DE postal address: postcode ranges + street + house number (revive postal_address_de)", type: new-entity, deps: [K04]}
  - {id: B05, title: "DE bank code + account number (legacy format) with context", type: new-entity, deps: [F03]}
  - {id: B06, title: "AT social insurance number (check digit)", type: new-entity, deps: [K05]}
  - {id: B07, title: "CH AHV number (EAN-13)", type: new-entity, deps: [K05]}
  - {id: B08, title: "AT/CH passport and ID numbers (format + context)", type: new-entity, deps: [F08]}
  - {id: B09, title: "FR NIR (mod 97) + SIREN/SIRET (Luhn)", type: new-entity, deps: [K05]}
  - {id: B10, title: "NL BSN (11-proof)", type: new-entity, deps: [K05]}
  - {id: B11, title: "BE national register number", type: new-entity, deps: [K05]}
  - {id: B12, title: "SE personnummer (Luhn) + DK CPR", type: new-entity, deps: [K05]}
  - {id: B13, title: "NO fødselsnummer + FI HETU", type: new-entity, deps: [K05]}
  - {id: B14, title: "PT NIF + IE PPSN", type: new-entity, deps: [K05]}
  - {id: B15, title: "Licence plates AT/CH/NL/FR with context", type: new-entity, deps: [F16]}

  # ── A: Presidio parity ────────────────────────────────────────────────
  - {id: A01, title: "URL (with/without scheme, TLD-validated)", type: new-entity, deps: [F05]}
  - {id: A02, title: "Crypto wallets: BTC Base58Check/Bech32(m), ETH EIP-55, LTC", type: new-entity, deps: [K05]}
  - {id: A03, title: "US ITIN", type: new-entity, deps: [K03]}
  - {id: A04, title: "US bank account (context) + ABA routing number (checksum)", type: new-entity, deps: [K03]}
