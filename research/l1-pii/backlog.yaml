# L1-PII backlog. One scheduled run completes exactly one task.
# Selection (deterministic, ark-l1 next): first task in file order with status: todo,
# all deps done and no open needs_decision.
# status: missing = todo; the runner sets done when publishing. Blocked: ~/ark-l1/state/blocked.json
# status: bundled (+ into: <bundle id>) and status: deferred (+ deferred: <reason>) are skipped by
#   the runner; a bundle lists the absorbed ids in `bundles`. Cut of 2026-10-21: see section P.
#
# Shared acceptance (applies to every task in addition to `accept`):
#   tests_first:  goldens via generate_l1_goldens.py (>= 5 positives + 5 hard negatives per language,
#                 DE + EN, plus the national language for country IDs), entry in
#                 rust/tests/fixtures/l1_bilingual_rules.json, Rust unit tests incl. checksum vectors
#                 (valid/invalid) — committed before the implementation.
#   gate:         cargo fmt --check, clippy -D warnings, cargo test -p patronus-ark,
#                 13_l1_golden_eval green, scoreboard without regression (> 0.5 pp F1 per entity),
#                 0 new FP on hard negatives, 100 KiB p95 at most +10 %.
#   docs:         CHANGELOG "Detection change", l1-rule-catalog via scripts/generate_docs.py.
#   no_relax:     never relax validators to buy recall; recall comes from context/structure/score.

setup:  # one-off, not run by the timer
  - {id: S01, title: "VPS: Rust, Presidio + spaCy en/de lg, gh, Claude Code, repo clone", status: done}
  - {id: S02, title: "gh auth as ubuntu (fine-grained token Contents + PRs)", status: done}
  - {id: S03, title: "runner/install.sh, secrets.env with CLAUDE_CODE_OAUTH_TOKEN, enable timer", status: manual}

tasks:
  # ── E: Measurement infrastructure ─────────────────────────────────────
  - id: E01
    status: done
    title: Presidio runner (default + tuned) → predictions in external_pii_eval format
    type: eval-infra
    deps: []
    accept: scripts/l1_presidio/run_presidio.py, pinned requirements, both profiles reproducible

  - id: E02
    status: done
    title: ARK runner in the same prediction format (Python bindings), incl. score field
    type: eval-infra
    deps: [E01]

  - id: E03
    status: done
    title: Entity mapping ARK ↔ Presidio ↔ corpora with scopes (shared, ark_only, presidio_only, semantic)
    type: eval-infra
    deps: [E01]
    accept: research/l1-pii/entity_map.yaml, test that every ARK label is mapped

  - id: E04
    status: done
    title: Load corpora + freeze dev/holdout split (Gretel Finance, OpenPII Nano, TAB)
    type: eval-infra
    deps: [E03]
    accept: >-
      scripts/l1_presidio/prepare_corpora.py --dev-out DIR --holdout-out DIR (manifest with SHA-256,
      writes DIR/.ready); the gate runs it outside the sandbox, the agent only sees dev

  - id: E05
    status: done
    title: Synthetic DE/EU gold set (letter, form, invoice, doctor's letter, JSON, CSV, ticket)
    type: eval-infra
    deps: [E03]
    accept: generator with separate seeds for dev/holdout, spans in code points, all E03 labels covered

  - id: T01
    status: done
    title: Define the gold convention for placeholder values (RFC 2606/6761 domains, .invalid, NANP 555-01xx/000) and align gold
    type: eval-infra
    deps: [E03]
    decision: "2026-10-14: reserved placeholder values (RFC 2606/6761 domains, .invalid, NANP 555-01xx/000) are PII, gold positive; no detector change needed"
    source: TRIAGE 2026-W42 (research/l1-pii/triage/2026-W42.md, bucket 5)
    question: >-
      The EN blind set treats customer@example.com and +1 000-000-0000 as negative, the DE blind set treats
      …@kundenbeispiel.invalid as positive, l1_bilingual_rules.json uses ada@example.com as positive.
      Do reserved domains/numbers count as PII (gold positive) or as hard negatives?
    accept: >-
      Convention in research/l1-pii/README.md; demo_pii_dlp*, pii_l1 and E05 gold consistent afterwards;
      detector change (if negative) as a separate follow-up task, not here

  - id: E06
    status: done
    title: Scoreboard (exact + overlap P/R/F1, DE/EN, hard-negative FP, delta to base, exit code on regression)
    type: eval-infra
    deps: [E02, E04, E05]
    accept: >-
      scripts/l1_presidio/scoreboard.py gate --head WT --base-sha SHA --dev DIR --holdout DIR --cache DIR;
      exit 1 on regression, summary on stdout; base results per SHA in the cache

  - id: E07
    status: done
    title: Latency benchmark ARK vs. Presidio (short/4 KiB/100 KiB) on the VPS
    type: eval-infra
    deps: [E06]

  - id: E08
    status: done
    title: Switch 12_l1_pii_fixture_eval to character offsets
    type: fix
    deps: []

  - id: E09
    status: done
    title: Add 13_l1_golden_eval to CI
    type: eval-infra
    deps: [E08]

  - id: E10
    status: done
    title: Golden schema v2 (N per language, difficulty tags no_context/structured/obfuscated/ocr) + coverage per rule_id
    type: eval-infra
    deps: [E09]

  - id: T02
    status: done
    title: Gold hygiene - annotate secondary entities in pii_l1 positives, test gold values of checksum-based labels against the validators
    type: eval-infra
    deps: [E10]
    source: TRIAGE 2026-W42 (research/l1-pii/triage/2026-W42.md, buckets 6 + 7)
    accept: >-
      generate_l1_goldens.py annotates every real entity in the text (e.g. PAN in CVV positives, phone in
      pii_l1-email-pos-01); test that every gold value of IBAN/CREDITCARD/STEUERID/… passes the
      validator; Luhn-invalid credit_card values in dynamic_pii.jsonl are excluded from L1 evaluations
      or marked invalid; validators stay unchanged

  - id: T16
    status: bundled
    into: B-EVAL
    title: Report gold gaps of the neutral corpora separately (duplicate values, checksum-invalid gold) without editing the corpora
    type: eval-infra
    deps: [E06]
    decision: >-
      2026-10-21: option (a). Scoring stays as is; the gold-gap buckets (predictions equal to an annotated
      gold value elsewhere in the row, gold failing the entity's validator) are reported separately per
      corpus and entity for both engines. Corpora are never edited; (b) and (c) do not change any metric.
    source: "TRIAGE 2026-W43 (research/l1-pii/triage/2026-W43.md, buckets 13 + 14)"
    question: >-
      Gretel annotates only one copy of `[x@y.com](mailto:x@y.com)` (117 Ark email FP on dev), leaves many
      personal and role addresses, fax numbers and `Account Number: 123456789` unannotated, and 14/70 IBAN and
      21/53 PAN gold values fail mod97/Luhn (Nano: 65/82 PAN). Ark and Presidio pay for this alike, but it
      dominates small F1 margins (Gretel email: Ark 52.2 vs tuned 51.3). Should the scoreboard (a) keep
      scoring as is and only report these buckets, (b) not count a prediction as FP when its value equals an
      annotated gold value of the same id in the same row, and/or (c) exclude checksum-invalid gold of
      checksum-validated ids from recall for both engines? The frozen corpora stay unchanged in every option.
    accept: >-
      scoreboard.py reports per corpus and entity: predictions equal to an annotated gold value elsewhere in
      the row, and gold values failing the entity's validator; gate metrics change only as decided; tests

  - id: E12
    status: done
    title: Presidio-favored gold sets (presidio-evaluator synthetic data, Presidio recognizer test cases) + scoring per source family
    type: eval-infra
    deps: [E06]
    accept: >-
      prepare_corpora.py adds a presidio_favored family with dev/holdout split and SHA-256 manifest: synthetic
      sentences from microsoft/presidio-research (presidio-evaluator, MIT, pinned commit) and the positive/negative
      examples of the presidio-analyzer recognizer tests (MIT, pinned to 2.2.364). Every gold source is tagged
      ark_authored (pii_l1, l1_bilingual_rules, E05 synthetic), neutral (Gretel Finance, OpenPII Nano, TAB) or
      presidio_favored; the scoreboard reports P/R/F1 per family. M1 must hold on neutral and on presidio_favored
      separately; ark_authored results are reported but never decide a milestone. Fairness rule in
      research/l1-pii/README.md

  - id: E11
    status: done
    title: Baseline report ARK vs. Presidio + error buckets
    type: report
    deps: [E06, E07, E12]
    accept: research/l1-pii/scoreboard/baseline.md; gaps as candidates for TRIAGE

  - id: T03
    status: done
    title: M3 counting rule (checksum-validated entities ARK vs. Presidio 2.2.364) + counting script
    type: eval-infra
    deps: [E03]
    decision: "2026-10-14: count only real check digits/checksums, each country separately, format-only validation does not count; Presidio pinned to 2.2.364; M3 target lowered to 2x (about 80 entities), update README accordingly"
    source: TRIAGE 2026-W42 (research/l1-pii/triage/2026-W42.md, section coverage)
    question: >-
      Presidio 2.2.364 has 43 pattern recognizers with validate_result (≈ 40 entities) → 3× ≈ 120;
      the backlog reaches roughly 60–80. What counts as an entity (VAT ID per country separately? format
      validation such as licence plates?), is the Presidio version considered pinned, and do we add
      TH/NG/PH or adjust the M3 target?
    accept: >-
      Rule in research/l1-pii/README.md; scripts/l1_presidio/count_validated.py counts from
      entity_map.yaml and the Presidio registry, with a test

  - id: T15
    status: bundled
    into: B-EVAL
    title: Define which Ark mode is scored for M1-M3 (strict default vs. balanced) and score both modes
    type: eval-infra
    deps: [E06, K02]
    decision: >-
      2026-10-21: M1-M3 are judged on balanced (the mode that competes with Presidio tuned); strict stays
      the bit-identical default. Both modes are scored for head and base; the gate guards strict
      (bit-identical) and balanced (no regression > 0.5 pp F1 per entity, no new hard-negative FP).
    source: "TRIAGE 2026-W43 (research/l1-pii/triage/2026-W43.md, section mode)"
    question: >-
      K02 keeps strict as the bit-identical default; balanced/recall are opt-in. Presidio tuned emits
      context-free patterns and raises them by context (threshold 0.4). The largest M1 gaps on neutral dev
      corpora (US SSN Gretel 45.6 vs 66.7, passport Nano 3.7 vs 29.4, driver's licence 0 vs 6) only close with
      context-weighted or context-free findings. Are M1-M3 measured on the default (strict) build, on
      balanced, or on the better of both per entity? Does the gate guard both modes?
    accept: >-
      Rule in research/l1-pii/README.md; scoreboard.py gate scores the decided modes for head and base
      (strict always), report per mode; tests

  # ── K: Engine ─────────────────────────────────────────────────────────
  - id: K01
    status: done
    title: Split pii.rs into modules (core, de, intl, us, uk, eu, …) without behaviour change
    type: refactor
    deps: [E10]
    accept: goldens and scoreboard bit-identical

  - id: K02
    status: done
    title: Score model (base per rule + validator strength checksum/format/none + context bonus) and modes strict/balanced/recall
    type: engine
    deps: [K01, E11]
    decision: "2026-10-11 approved: strict is the default and bit-identical; balanced/recall opt-in only"
    accept: >-
      strict = current behaviour (default, goldens and scoreboard bit-identical); balanced/recall only via
      explicit configuration; score field and modes in docs/reference/result-schema.md

  - id: K03
    status: done
    title: Context engine v2 (two-sided proximity, DE/EN lexicon from pii.json, counter-context such as order/invoice numbers)
    type: engine
    deps: [K02]

  - id: K04
    status: done
    title: Structure awareness (JSON keys, CSV headers, key-value, Markdown/HTML tables as context)
    type: engine
    deps: [K03]

  - id: K05
    status: done
    title: Context-free output of checksum-strong values in balanced mode
    type: engine
    deps: [K03]

  - id: K06
    status: done
    title: Obfuscation (at/ät/dot/punkt, spaced digits, full-width, zero-width) with offset back-mapping
    type: engine
    deps: [K03]

  - id: K07
    status: done
    title: Cross-label overlap resolution with priorities in balanced/recall (IBAN vs. PAN vs. account vs. phone)
    type: engine
    deps: [K05]

  - id: T07
    status: done
    title: "Strict: do not emit a PAN sub-span inside a valid IBAN or FINANCIAL_ACCOUNT_NUMBER on an IBAN value"
    type: precision-fix
    deps: [K02]
    decision: "2026-10-14: strict keeps emitting both labels bit-identically, but the PAN sub-span inside a valid IBAN and FINANCIAL_ACCOUNT_NUMBER on an IBAN value are marked as secondary evidence; the scoreboard scores primary findings only"
    source: TRIAGE 2026-W42 (research/l1-pii/triage/2026-W42.md, bucket 4)
    question: >-
      pii.rs deliberately keeps cross-label overlaps ("Evidence retains both labels"), and K02 keeps strict
      bit-identical. Should strict suppress the double labels, only mark them as secondary evidence
      (scoreboard scores primary), or is this left to K07 alone (balanced/recall)?

  - id: T26
    status: done
    title: Field-name lexicon FR/ES/IT/NL for the existing anchor rules (DOB, customer/employee ID, account number, CVV, SSN, passport, username)
    type: recall-fix
    deps: [K03]
    source: "TRIAGE 2026-W43 (research/l1-pii/triage/2026-W43.md, bucket 12)"
    accept: >-
      Gretel dev has 660 FR/ES/IT/NL rows with 280 Ark FN, many behind field names such as Fecha de
      Nacimiento, Data di Nascita, date de naissance, klantnummer, bankrekeningnummer, code de sécurité.
      Lexicon entries in the K03 lexicon, goldens per language (>= 5 positives + 5 hard negatives each for
      FR, ES, IT, NL), validators unchanged

  # ── P: Critical path to M1-M4 (2026-10-21 cut) ────────────────────────
  # Ordered by milestone impact on the measured gaps (scoreboard/baseline.md, latency.md). Open
  # work lives only here; absorbed tasks elsewhere carry `status: bundled` + `into`, cut tasks
  # `status: deferred` + reason. M3 tally after each task assumes the T03 counting rule (start: 3 units).

  # infra: M1/M2 are judged on balanced (T15 decision), the gate guards strict + balanced
  - id: B-EVAL
    status: done
    title: Score strict and balanced for head and base (milestones on balanced) + report gold gaps of the neutral corpora separately
    type: eval-infra
    deps: [E06, K02]
    bundles: [T15, T16]
    decision: >-
      2026-10-21: T15: milestones on balanced; the gate guards strict and balanced (no regression > 0.5 pp F1
      per entity, no new hard-negative FP); strict output changes only where a task's accept says so on
      purpose. T16: option (a), scoring unchanged, gold gaps reported separately, corpora never edited.
    accept: >-
      Rule in research/l1-pii/README.md (T15 + T16 decisions); scoreboard.py gate scores head and base in
      strict and balanced and fails on a regression in either mode; report and m1 print per mode, milestones
      from balanced; baseline numbers for balanced added to scoreboard/baseline.md. Gold-gap report per corpus
      and entity as in T16 accept (predictions equal to an annotated gold value elsewhere in the row, gold
      values failing the entity's validator) without changing any gate metric; tests

  # infra: M2 cannot be met on presidio_favored as defined (tuned 87.0 + 15 pp > 100)
  - id: D-M2
    status: done
    title: Implement the decided M2 rule and add scoreboard.py m2
    type: eval-infra
    deps: [B-EVAL]
    decision: >-
      2026-10-21: M2 holds on both families: neutral DE/EU macro-F1 >= Presidio tuned + 15 pp, and on
      presidio_favored Ark macro-F1 >= Presidio tuned (no +15 pp there). Judged on balanced like M1.
    source: "scoreboard/baseline.md, candidate C7"
    question: >-
      Baseline: neutral DE macro-F1 ARK 44.6 vs tuned 18.6 (+26 pp, 161 Gretel DE rows); presidio_favored DE
      ARK 2.0 vs tuned 87.0 on 11 ids with 1-5 gold each, where tuned + 15 pp exceeds 100. Does M2 count
      neutral only, both families with a minimum gold count per id, or a capped target? Are presidio_only
      ids (commercial register, BSNR, postal code) part of the macro average?
    accept: >-
      Rule in research/l1-pii/README.md (M2 row and fairness section); scoreboard.py m2 prints macro-F1 per
      family and mode and exits 1 unless both family rules hold; presidio_only ids stay out of the macro
      average unless entity_map.yaml marks them shared; test

  # M1 PAN (neutral EN 45.8 vs 49.1) + Immer (presidio_favored hard negative, bucket P8)
  - id: B-PAN
    status: done
    title: "Credit card: IIN ranges + lengths per brand in strict (no PAN after +, in date-time stamps or token segments), context-free in balanced"
    type: precision-fix
    deps: [E06, K05, B-EVAL]
    bundles: [T19, F02]
    source: "TRIAGE 2026-W43 bucket 4; baseline N1, P8"
    accept: >-
      T19 accept in full (hard negatives DE + EN, IIN/length table with tests per brand, every Luhn-valid PAN
      gold value stays found, Luhn unchanged) plus F02: the same table gates the balanced context-free PAN;
      neutral EN PAN F1 >= tuned in balanced; the presidio_favored PAN hard negative of bucket P8 is no match

  # M1 IP (presidio_favored 56.8 vs 96.2, neutral 87.9 vs 92.2) + Immer (bucket P9)
  - id: B-IP
    status: done
    title: "IPv6 spans: no match inside SWIFT/EDIFACT colon chains, IPv4-mapped/embedded as one span, zone ID and CIDR prefix in the span, no partial match on invalid mixed forms"
    type: precision-fix
    deps: [E06, B-EVAL]
    bundles: [T20]
    source: "TRIAGE 2026-W43 bucket 5; baseline P3, P9, candidate C1"
    accept: >-
      T20 accept in full plus baseline C1: IPv4-mapped and embedded IPv6 reported as one span, zone ID and
      CIDR prefix length inside the span (convention written to the README gold section), no IPv6 sub-span
      on an invalid mixed address (P9 hard negative no match); loopback/unspecified stay rejected (decided 2026-10-21, see D-IP);
      presidio_favored IP F1 >= 85 and neutral IP F1 >= tuned in balanced

  # M1 IP: remaining 5 FN need a gold convention
  - id: D-IP
    title: Gold convention for loopback and unspecified addresses (127.0.0.1, ::1, 0.0.0.0, ::) and matching validator change
    type: recall-fix
    deps: [B-IP]
    status: deferred
    deferred: "Decided 2026-10-21: Ark always rejects loopback/unspecified addresses (strict and balanced); no validator change. The 5 presidio_favored FN stay and are reported as a known gap"
    source: "scoreboard/baseline.md, bucket P4, candidate C2"
    question: >-
      validators::ip_address rejects loopback and unspecified addresses on purpose; presidio_favored gold
      counts them (5 FN). Are they PII-positive like the T01 placeholders, or hard negatives?
    accept: >-
      Convention in research/l1-pii/README.md; gold and validator consistent with it; presidio_favored IP
      F1 >= tuned in balanced

  # M1/M2 on presidio_favored and the F1 >= 80 floor are out of reach under the current decisions
  - id: T27
    title: "Reachability of M1/M2 on presidio_favored and exceptions to the F1 >= 80 quality floor (gold failing validators, decided known gaps)"
    type: eval-infra
    deps: [B-EVAL, D-M2]
    needs_decision: true
    source: "TRIAGE 2026-W44 (research/l1-pii/triage/2026-W44.md, buckets 1-4, 10, 15)"
    question: >-
      Dev, balanced, with every open task assumed to succeed: M1 IP on presidio_favored is capped at 87.7 vs
      tuned 96.2 (9 of 41 gold values are loopback/unspecified, rejected by D-IP), M1 NINO at 80.0 vs 100 (gold
      span ' YZ 61 48 68 B' carries a leading space), M1 SSN at 75.0 vs 88.9 (987-65-4322, 987-65-4329,
      219-09-9999 fail validators::us_ssn; bare 078051121 stays negative per B-SSN), and M2 presidio_favored at
      about 63.7 vs 85.7 (identity card 8/11 and DE VAT ID 2/5 gold values fail the check digit; bare BSNR, LANR,
      driver's licence and tax ID stay negative per B-DE1, F15, K05). The floor cannot be reached for neutral PAN
      (86 of 90 FN are Luhn/IIN-invalid gold, cap 53.3), neutral email (259 unannotated real addresses, cap about
      76), neutral US SSN (Gretel's `ssn` gold holds SE, IT, UK, NL national IDs, cap about 79) and on
      presidio_favored for AU ACN, BSNR, LANR, SG NRIC/FIN, IT VAT ID, DE tax ID, identity card, NINO and licence
      plates (bare TR/IN/NG values). Options: (a) record each case as a floor exception in the README and accept
      that M1/M2 stay NOT MET on presidio_favored; (b) judge milestones and the floor on attainable gold: for both
      engines, leave out gold values that fail every validator of their id or fall under a recorded decision
      (known-gap list in entity_map.yaml), and keep reporting the raw numbers; (c) revisit single decisions
      (e.g. bare LANR/BSNR/SSN in balanced at a low score like Presidio) at the risk of new hard-negative hits.
      Which applies, and per family or globally?
    accept: >-
      Decision recorded in research/l1-pii/README.md (milestone and floor sections); if (b): scoreboard.py m1,
      m2 and report score the attainable view next to the raw view, the known-gap list lives in entity_map.yaml
      and is checked by entity_map.py check, the gold-gap report checks passport and identity card gold only
      against the validator of the document's country (today every passport counts as failing
      de_passport_number); Q-task targets updated to the decided view; tests

  - id: T28
    status: done
    title: "IPv6: no sub-span after a further `:` group (foo2001:db8::10.0.0.1 reports db8::10.0.0.1)"
    type: precision-fix
    deps: [B-IP]
    source: "TRIAGE 2026-W44 (research/l1-pii/triage/2026-W44.md, bucket 5)"
    accept: >-
      The B-IP convention "no partial match" holds when the run before the address starts with word
      characters: `foo2001:db8::10.0.0.1` yields no span, neither IPv6 nor the IPv4 tail (README IP span
      rules; the presidio_favored gold `10.0.0.1` stays a known FN, the FP goes); hard negatives DE + EN for
      `<word>2001:db8::…` shapes; `2001:db8::10.0.0.1`, `::ffff:10.0.0.1`, `fe80::1%eth0` and every
      IP gold value found today stay found; presidio_favored IP precision rises in balanced and strict

  - id: GOLD-VAT1
    status: done
    title: "Gold for VAT IDs without gold, part 1: AT, BE, BG, CH, CY, CZ, DK, EE, ES, FI, FR, GR, HR, HU"
    type: eval-infra
    deps: []
    source: "Gold/quality pass 2026-10-25 (capabilities page, snapshot 2026-10-24)"
    accept: >-
      Synthetic gold for entities that are implemented but have no gold in any source family. Per id: >= 
      10 positives (DE + EN carriers: prose, form/key-value, JSON, CSV), >= 5 hard negatives 
      (checksum-invalid, wrong length, look-alike numbers), generated with checksum-valid values by the 
      E05 synthetic goldset generator (family ark_authored; new dev and holdout seeds, never real data). 
      The next measurement shows gold > 0 for every listed id. Ids: pii.<cc>.vat_id for AT, BE, BG, CH, 
      CY, CZ, DK, EE, ES, FI, FR, GR, HR, HU.

  - id: GOLD-VAT2
    status: done
    title: "Gold for VAT IDs without gold, part 2: IE, LT, LU, LV, MT, NL, NO, PL, PT, RO, SE, SI, SK, UK"
    type: eval-infra
    deps: [GOLD-VAT1]
    source: "Gold/quality pass 2026-10-25 (capabilities page, snapshot 2026-10-24)"
    accept: >-
      Synthetic gold for entities that are implemented but have no gold in any source family. Per id: >= 
      10 positives (DE + EN carriers: prose, form/key-value, JSON, CSV), >= 5 hard negatives 
      (checksum-invalid, wrong length, look-alike numbers), generated with checksum-valid values by the 
      E05 synthetic goldset generator (family ark_authored; new dev and holdout seeds, never real data). 
      The next measurement shows gold > 0 for every listed id. Ids: pii.<cc>.vat_id for IE, LT, LU, LV, 
      MT, NL, NO, PL, PT, RO, SE, SI, SK, UK.

  - id: Q-DE
    status: done
    title: "Quality: German IDs at F1 0 on presidio_favored (health insurance number, LANR, social security number, tax ID, tax number) and DE VAT ID 75"
    type: precision-fix
    deps: []
    source: "Gold/quality pass 2026-10-25 (capabilities page, snapshot 2026-10-24)"
    accept: >-
      Analyse why presidio_favored gold for these ids is missed (formats, separators, context) and fix the 
      rules. Quality floor (decided 2026-10-25): every listed entity reaches exact F1 >= 80 in balanced on 
      every source family where it has gold (snapshot research/scoreboard/*.json); strict shows no 
      regression; validators are never loosened; an entity that cannot reach 80 by a recorded decision is 
      documented in the README

  # M1 IBAN (presidio_favored 63.9 vs 100; 35 of 66 FN are grouped non-DE IBAN)
  - id: B-IBAN
    title: "IBAN: grouped and lowercase variants for all countries in strict, length per country from the SWIFT IBAN registry, SEPA creditor IDs are no IBAN"
    type: recall-fix
