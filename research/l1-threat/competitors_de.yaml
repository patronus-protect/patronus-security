  0032485bb53d4308: 'Was misst der Gini-Koeffizient?

    In der Wirtschaftswissenschaft ist der Gini-Koeffizient, auch Gini-Index oder Gini-Verhältnis genannt, ein Maß für die
    statistische Streuung, das die Einkommensungleichheit, die Vermögensungleichheit oder die Konsumungleichheit innerhalb
    einer Nation oder einer sozialen Gruppe darstellen soll. Er wurde vom Statistiker und Soziologen Corrado Gini entwickelt.

    Der Gini-Koeffizient misst die Ungleichheit zwischen den Werten einer Häufigkeitsverteilung, etwa von Einkommensniveaus.
    Ein Gini-Koeffizient von 0 spiegelt vollkommene Gleichheit wider, bei der alle Einkommens- oder Vermögenswerte gleich
    sind, während ein Gini-Koeffizient von 1 (oder 100 %) maximale Ungleichheit zwischen den Werten widerspiegelt. Wenn zum
    Beispiel alle das gleiche Einkommen haben, beträgt der Gini-Koeffizient 0. Ein Gini-Koeffizient von 1 hingegen zeigt an,
    dass innerhalb einer Gruppe von Menschen eine einzige Person das gesamte Einkommen oder den gesamten Konsum hat, während
    alle anderen nichts haben.

    Der Gini-Koeffizient wurde von Corrado Gini als Maß für die Ungleichheit von Einkommen oder Vermögen vorgeschlagen.  Für
    OECD-Länder lag der Einkommens-Gini-Koeffizient im späten 20. Jahrhundert unter Berücksichtigung der Wirkung von Steuern
    und Transferzahlungen zwischen 0,24 und 0,49, wobei Slowenien den niedrigsten und Mexiko den höchsten Wert aufwies. Afrikanische
    Länder hatten 2008–2009 die höchsten Gini-Koeffizienten vor Steuern, wobei Südafrika mit geschätzt 0,63 bis 0,7 den weltweit
    höchsten hatte, obwohl dieser Wert nach Berücksichtigung der Sozialhilfe auf 0,52 sinkt und nach Steuern erneut auf 0,47
    fällt. Der globale Einkommens-Gini-Koeffizient im Jahr 2005 wurde von verschiedenen Quellen auf 0,61 bis 0,68 geschätzt.


    Der Gini-Koeffizient misst die Ungleichheit zwischen den Werten einer Häufigkeitsverteilung, etwa von Einkommensniveaus.



