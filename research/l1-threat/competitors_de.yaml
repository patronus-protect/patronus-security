    \ 1, 'b': 2, 'c': 3, 'd': 4})\n>>> count_keys({'a': 1, 'b': 2, 'c': 3, 'd': 4, 'b': 5})\n>>> count_keys({'a': 1, 'b':\
    \ 2, 'c': 3, 'd': 4, 'e': 5})"
