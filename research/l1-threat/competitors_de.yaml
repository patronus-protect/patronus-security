  0052d606b33e0234: 'Was ist radioaktiver Zerfall?

    Radioaktiver Zerfall (auch bekannt als Kernzerfall, Radioaktivität, radioaktive Desintegration oder nukleare Desintegration)
    ist der Prozess, bei dem ein instabiler Atomkern durch Strahlung Energie verliert. Ein Material, das instabile Kerne enthält,
    gilt als radioaktiv. Drei der häufigsten Zerfallsarten sind Alphazerfall (α-Zerfall), Betazerfall (β-Zerfall) und Gammazerfall
    (γ-Zerfall), bei denen jeweils ein oder mehrere Teilchen emittiert werden. Die schwache Wechselwirkung ist der Mechanismus,
    der für den Betazerfall verantwortlich ist, während die anderen beiden durch den Elektromagnetismus und die Kernkraft
    bestimmt werden. Eine vierte häufige Zerfallsart ist der Elektroneneinfang, bei dem ein instabiler Kern ein inneres Elektron
    aus einer der Elektronenschalen einfängt. Der Verlust dieses Elektrons aus der Schale führt zu einer Kaskade von Elektronen,
    die in diese niedrigere Schale fallen, was zur Emission diskreter Röntgenstrahlen aus den Übergängen führt. Ein häufiges
    Beispiel ist Iod-125, das häufig im medizinischen Bereich verwendet wird.


