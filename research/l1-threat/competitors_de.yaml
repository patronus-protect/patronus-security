  00cbd88f395add9b: 'Hat Singapur mehr als fünf Amtssprachen?

    Singapur (/ˈsɪŋ(ɡ)əpɔːr/ (anhören)), offiziell die Republik Singapur, ist ein Inselstaat und Stadtstaat im maritimen Südostasien.
    Es liegt etwa einen Breitengrad (137 Kilometer bzw. 85 Meilen) nördlich des Äquators, vor der Südspitze der Malaiischen
    Halbinsel, und grenzt im Westen an die Straße von Malakka, im Süden an die Straße von Singapur, im Osten an das Südchinesische
    Meer und im Norden an die Straße von Johor. Das Staatsgebiet besteht aus einer Hauptinsel, 63 Satelliteninseln und Inselchen
    sowie einem vorgelagerten Inselchen; die Gesamtfläche hat sich seit der Unabhängigkeit des Landes infolge umfangreicher
    Landgewinnungsprojekte um 25 % vergrößert. Es hat die dritthöchste Bevölkerungsdichte der Welt. Mit einer multikulturellen
    Bevölkerung und in Anerkennung der Notwendigkeit, die kulturellen Identitäten der wichtigsten ethnischen Gruppen im Land
    zu respektieren, hat Singapur vier Amtssprachen: Englisch, Malaiisch, Mandarin und Tamil. Englisch ist die Lingua franca,
    und zahlreiche öffentliche Dienstleistungen sind nur auf Englisch verfügbar. Multiethnizität ist in der Verfassung verankert
    und prägt weiterhin die nationale Politik in den Bereichen Bildung, Wohnen und Politik. Was für ein spiel ist binding
    of isaac und auf welchen plattformen kann ich es spielen?the binding of isaac ist ein roguelike-videospiel, das von den
    unabhängigen entwicklern edmund mcmillen und florian himsl entworfen wurde. es wurde 2011 für microsoft windows veröffentlicht
    und dann auf os x und linux portiert. titel und handlung des spiels sind von der biblischen geschichte der bindung isaaks
    inspiriert. im spiel erhält isaacs mutter eine botschaft von gott, die das leben ihres sohnes als beweis ihres glaubens
    verlangt, und isaac flieht aus angst um sein leben in den von monstern bevölkerten keller ihres hauses, wo er ums überleben
    kämpfen muss. die spieler steuern isaac oder einen von sieben weiteren freischaltbaren charakteren in roguelike-manier
    durch einen prozedural generierten dungeon, gestaltet nach dem vorbild von the legend of zelda, und besiegen monster in
    echtzeitkämpfen, während sie gegenstände und power-ups sammeln, um bosse und schließlich isaacs mutter zu besiegen.


    das spiel war das ergebnis eines einwöchigen game jams von mcmillen und himsl, bei dem ein von the legend of zelda inspiriertes
    roguelike entwickelt werden sollte, das es mcmillen ermöglichte, seine gefühle sowohl über positive als auch negative
    aspekte der religion zum ausdruck zu bringen, die er durch konflikte zwischen seinen katholischen und wiedergeborenen
    christlichen familienmitgliedern während seiner kindheit entdeckt hatte. mcmillen hatte den titel als risiko betrachtet,
    aber als eines, das er nach dem finanziellen erfolg von super meat boy eingehen konnte, und veröffentlichte ihn im september
    2011 ohne großes aufsehen auf steam, ohne viele verkäufe zu erwarten. das spiel wurde bald populär, teilweise aufgrund
    verschiedener let''s-play-videos, die den titel präsentierten. mcmillen und himsl veröffentlichten im mai 2012 eine erweiterung
    namens „wrath of the lamb“, wurden aber aufgrund von einschränkungen der flash-plattform an weiteren erweiterungen gehindert.
    sie hatten 2012 begonnen, mit nintendo zusammenzuarbeiten, um eine 3ds-version zu veröffentlichen, doch nintendo zog sich
    später unter verweis auf die kontroverse um die religiösen themen des spiels aus dem deal zurück.


    der entwickler nicalis arbeitete 2014 mit mcmillen zusammen, um ein remake des spiels fertigzustellen, the binding of
    isaac: rebirth, das zusätzliche funktionen brachte, die mcmillen geplant hatte und die über die grenzen von flash hinausgingen,
    sowie die grafik des spiels verbesserte und portierungen für andere systeme jenseits von personal computern ermöglichte,
    darunter playstation 4 und vita, xbox one, wii u, nintendo 3ds und die nintendo switch. dieses remake wird häufig als
    eines der besten roguelike-spiele aller zeiten genannt.


    mcmillen arbeitete später mit james id an der entwicklung von the legend of bum-bo, das als prequel zu the binding of
    isaac dient.


    the binding of isaac wurde gut aufgenommen, wobei kritiker die roguelike-natur des spiels lobten, die zu wiederholtem
    durchspielen anregt. bis juli 2014 meldete mcmillen, dass über 3 millionen exemplare verkauft worden seien. dem spiel
    wird nachgesagt, zum erneuten interesse am roguelike-genre sowohl bei spielern als auch bei entwicklern beigetragen zu
    haben.'
