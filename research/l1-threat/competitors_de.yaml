  01133538f6234f30: 'Was ist laut Hofstadter das Thema des Buches Gödel, Escher, Bach?

    Als Reaktion auf die Verwirrung über das Thema des Buches betonte Hofstadter, dass es in Gödel, Escher, Bach nicht um
    die Beziehungen zwischen Mathematik, Kunst und Musik geht – sondern darum, wie Kognition aus verborgenen neurologischen
    Mechanismen entsteht. An einer Stelle präsentiert das Buch eine Analogie dazu, wie sich einzelne Neuronen im Gehirn koordinieren,
    um ein einheitliches Gefühl eines kohärenten Geistes zu erzeugen, indem es dies mit der sozialen Organisation einer Ameisenkolonie
    vergleicht. Was ist ein Tepui?ein tepui /ˈtɛpwi/ oder tepuy (spanisch: [teˈpuj]) ist ein Tafelberg oder eine Mesa in südamerika,
    besonders in venezuela und im westen guyanas. das wort tepui bedeutet „haus der götter“ in der muttersprache der pemon,
    des indigenen volkes, das die gran sabana bewohnt.'
  0114bf8393cfa3c7: 'Nenne mir anhand dieses Textes den Erfinder des Rueben-Sandwiches und wo es erfunden wurde.

    Einer Entstehungsgeschichte zufolge bat Reuben Kulakofsky (sein Vorname wird manchmal Reubin geschrieben; sein Nachname
    manchmal zu Kay abgekürzt), ein in Litauen geborener jüdischer Lebensmittelhändler, der in Omaha, Nebraska, lebte, bei
    seiner wöchentlichen Pokerrunde, die etwa von 1920 bis 1935 im Blackstone Hotel stattfand, um ein Sandwich aus Corned
    Beef und Sauerkraut. Zu den Teilnehmern, die sich selbst „das Komitee“ nannten, gehörte auch der Besitzer des Hotels,
    Charles Schimmel. Schimmels Sohn, der in der Küche arbeitete, machte das erste Reuben für ihn, fügte seiner Bestellung
    Schweizer Käse und Thousand-Island-Dressing hinzu und legte das Ganze auf Roggenbrot. Das Sandwich erlangte zunächst lokale
    Berühmtheit, als Schimmel es auf die Mittagskarte des Blackstone setzte, und sein Ruhm verbreitete sich, als ein ehemaliger
    Angestellter des Hotels mit dem Rezept den nationalen Sandwich-Ideenwettbewerb gewann. In Omaha, Nebraska, wurde der 14.
    März zum Reuben-Sandwich-Tag ausgerufen.


    Einem anderen Bericht zufolge war der Schöpfer des Reuben Arnold Reuben, der deutsch-jüdische Besitzer von Reuben''s Delicatessen
    (1908–2001) in New York City. Laut einem Interview mit Craig Claiborne kreierte Arnold Reuben das „Reuben Special“ um
    1914. Bernard Sobel gibt in seinem 1953 erschienenen Buch Broadway Heartbeat: Memoirs of a Press Agent an, dass das Sandwich
    eine spontane Kreation für Marjorie Rambeau war, die entstand, als die Broadway-Schauspielerin eines Abends Reuben''s
    Delicatessen besuchte, als die Vorratsschränke besonders leer waren.


    Wieder andere Versionen schreiben Alfred Scheuing, einem Koch bei Reuben''s Delicatessen, das Verdienst zu und sagen,
    er habe das Sandwich in den 1930er-Jahren für Reubens Sohn, Arnold Jr., kreiert.


    Es gibt keinen einzelnen, allgemein anerkannten Erfinder des Reuben-Sandwiches. Der Text gibt diese möglichen Antworten:

