  009a7de2f2dfec13: 'Wie viele hohe Siege hatte Nelson und wie lauteten die Ergebnisse?

    Die Saison 1926–27 war die 46. Saison in der Geschichte des Nelson Football Club und seine sechste Spielzeit als Profiverein
    in der Football League. Nelson beendete die Saison mit einer Bilanz von 22 Siegen, 7 Unentschieden und 13 Niederlagen,
    was dem Team insgesamt 51 Punkte einbrachte. Die Mannschaft startete gut in die Spielzeit – sie gewann sechs der ersten
    neun Spiele – und verlor in den ersten fünf Monaten der Saison nur drei Spiele. In der Saison 1926–27 feierte Nelson mehrere
    hohe Siege, darunter ein 7:0 gegen Accrington Stanley und ein 7:1 gegen Crewe Alexandra. Nelson lag während der gesamten
    Spielzeit stets im oberen Bereich der Tabelle, konnte Stoke City jedoch nie von der Spitzenposition verdrängen, und eine
    Serie von sechs Niederlagen in Folge am Ende der Saison führte dazu, dass sie die Liga auf dem fünften Platz abschlossen.
