      - {label: "category = Political/Misinformation/Conspiracy", out_of_scope: "disinformation is not an L1 class (README scope)"}
      - {label: "category in (Needs Caution, Other, Immoral/Unethical)", out_of_scope: "no hazard class"}
      - {label: "prompt_label = unsafe without a scored category", out_of_scope: "adult sexual content, model-only, disinformation and catch-all categories, and rows carrying both a toxic and a harmful category, which count for toxic_language only"}
