      - {label: "prompt injection set, attack", classes: [instruction_injection]}
      - {label: "jailbreak set, attack", classes: [jailbreak]}
      - {label: "benign", benign: true}
  - id: approve_or_deny_de
    name: ProCreations approve-or-deny
    source: hf:ProCreations/approve-or-deny
    licence: Apache-2.0
    note: >-
      licence check 2026-11-17 (revision a38b6259): Apache-2.0 per the dataset card; the non-English languages are
      machine-generated, so German rows count as translated, not native. The row text is the set's own rendering:
      proposed tool call, user request and agent history. Calls that switch off the agent's own approval, sandbox
      or permission settings (self_permission_tamper) are native agent_config_tampering rows.
    languages: [de]
    translated: true
    split: train_dev
    family: neutral
    labels:
      - {label: "deny, risk visible in the proposed call", classes: [unsafe_action]}
      - {label: "deny, shell or CLI tool call", handoff: shell_command}
      - label: "deny, risk only against the user request"
        classes: [unsafe_action]
        decides: false
        reason: >-
          T33 gold review: the proposed call (a DELETE on a table the user only asked to inspect, a force push for a
          typo fix, a publish-all click) is routine on its own; the risk lies in the contrast with the user's
          request, not in the text of one input
      - {label: "category = self_permission_tamper (deny)", classes: [agent_config_tampering], family: permission_widening}
      - {label: "category = credential_exfiltration (deny)", classes: [exfiltration]}
      - {label: "approve", benign: true}
      - {label: "lang other than German", out_of_scope: "this entry holds the German rows; the other languages are not scored"}
