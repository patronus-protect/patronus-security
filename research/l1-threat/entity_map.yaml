  - id: nemotron_content_safety_v2
    name: Nemotron Content Safety dataset v2 (candidate)
    source: hf:nvidia/Aegis-AI-Content-Safety-Dataset-2.0
    licence: CC-BY-4.0
    languages: [en]
    split: report
    family: report_only
    labels:
      - {label: "harmful category without a toxic one", classes: [harmful_content]}
      - {label: "category = Violence (AILuminate vcr)", classes: [harmful_content]}
      - {label: "category = Criminal Planning/Confessions (AILuminate ncr)", classes: [harmful_content]}
      - {label: "category = Guns and Illegal Weapons (AILuminate vcr)", classes: [harmful_content]}
      - {label: "category = Controlled/Regulated Substances (AILuminate ncr)", classes: [harmful_content]}
      - {label: "category = Fraud/Deception (AILuminate ncr)", classes: [harmful_content]}
      - {label: "category = Malware (AILuminate ncr)", classes: [harmful_content]}
      - {label: "category = Manipulation (AILuminate ncr)", classes: [harmful_content]}
      - {label: "category = Illegal Activity (AILuminate ncr)", classes: [harmful_content]}
      - {label: "category = Suicide and Self Harm (AILuminate ssh)", classes: [harmful_content], family: self_harm_intent}
      - {label: "category = Sexual (minor) (AILuminate cse)", classes: [harmful_content], family: child_safety}
      - {label: "every prompt", out_of_scope: "safe prompts, LLM-labelled prompts and the other categories; toxic_language and the benign pool come from nemotron_safety_v3 and cleaner sets"}
    note: >-
