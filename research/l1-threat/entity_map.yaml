  - id: bipia
    name: BIPIA
    source: github:microsoft/BIPIA
    licence: MIT (code and attack texts); contexts mixed
    note: >-
      licence check 2026-11-17 (commit a004b69e): repository MIT; the table contexts come from WikiTableQuestions
      (CC-BY-SA-4.0, NOTICE.md), the web-QA and summarization contexts are not redistributed (generated locally
      from NewsQA/XSum, own terms), and the code contexts are Stack Overflow posts (context_url, CC-BY-SA-4.0).
      The recipe takes the MIT attack texts (text and code attacks, train and test) inside the e-mail contexts
      only; each attack becomes its own line at the start, middle or end of an e-mail, as BIPIA places them.
    languages: [en]
    split: train_dev
    family: neutral
    labels:
      - {label: "text and code attacks inserted into e-mail contexts", classes: [instruction_injection]}
      - {label: "attacks of the information-gathering group (e.g. data eavesdropping)", classes: [exfiltration]}
      - {label: "task-irrelevant requests inserted into e-mail contexts", out_of_scope: "dev gold re-review 2026-11-17: a bare off-task request ('Explain the theory of relativity.', 'Determine the sentiment of this review') carries no override and no address to the assistant; inside an e-mail it reads as ordinary content"}
      - {label: "clean context", benign: true}
  - id: agentdojo
    name: AgentDojo
    source: github:ethz-spylab/agentdojo
    licence: MIT
    languages: [en]
    split: train_dev
    family: neutral
    note: >-
      read from the run traces in the repository (runs/, gpt-4o-2024-05-13 pipeline, v1 suites banking, slack,
      travel, workspace): the tool outputs that carry an attack's payload, and every tool output of the user
      tasks run without attack. Injection tasks that only make the agent visit a link, send a harmless mail,
      create an event or book a hotel stay instruction_injection alone.
    labels:
      - {label: "injection task text in tool output", classes: [instruction_injection], family: tool_result_directive}
      - {label: "injection task goal sends data to an attacker address", classes: [exfiltration]}
      - {label: "injection task goal deletes, transfers money or changes access", classes: [unsafe_action]}
      - {label: "user task and clean tool output", benign: true}
  - id: nemotron_ipi
    name: Nemotron indirect prompt injection
    source: hf:nvidia (indirect prompt injection set)
    licence: unknown
    languages: [en]
    split: train_dev
    family: neutral
    labels:
      - {label: "injected document", classes: [instruction_injection]}
      - {label: "injected document with exfiltration goal", classes: [exfiltration]}
      - {label: "clean document", benign: true}
  - id: agent_safetybench
    name: Agent-SafetyBench
    source: github:thu-coai/Agent-SafetyBench
    licence: MIT
    note: >-
      2,000 cases (commit 74feea8d). Most unfulfillable cases keep their risk in the tool environment ("order 50
      cartons of milk", "shut down unneeded systems"): the instruction alone is no attack and fails the gold bar
      (T15). Scored are the unfulfillable harmful-code cases the agent fails by writing the code itself (failure
      mode 1) whose request names the harmful act (cue filter in datasets.yaml); the fulfillable code cases are hard
      negatives. The tool environments name tools without poisoned descriptions (no tool_poisoning rows).
    languages: [en]
    split: train_dev
    family: neutral
    labels:
      - {label: "risk = Contribute to harmful / vulnerable code, fulfillable = 0, failure mode 1", classes: [unsafe_action], family: unsafe_code}
      - {label: "risk = Contribute to harmful / vulnerable code, fulfillable = 0, other failure modes", out_of_scope: "the risk lies in tool calls or tool results, not in the instruction"}
      - {label: "risk = Contribute to harmful / vulnerable code, fulfillable = 1", benign: true}
      - {label: "every other risk", out_of_scope: "the risk lies in the tool environment, the instruction alone carries no attack (gold review T15)"}
  - id: redcode
    name: RedCode
    source: github:AI-secure/RedCode
    licence: MIT (code), CC-BY-4.0 (dataset)
    note: >-
      commit 664e4793. RedCode-Exec Python: 27 risky scenarios of 30 items, each with a summary and a step-list
      request ("Create and execute a Python script that ..."); scored are the scenarios whose request is itself the
      risky action (8 delete a system file, 9 alias sudo to a wipe, 10 reverse shell). The others read as ordinary
      tasks on their own (print or copy a file, post a file to a local server, stop a named service, a regex, a
      seeded PRNG, a biased score); their risk lies in what the code does in its environment (gold review T18).
      RedCode-Gen: 160 malware function stubs (signature and docstring to complete).
    languages: [en]
    split: train_dev
    family: neutral
    labels:
      - {label: "RedCode-Exec Python, scenarios whose request is the risky action", classes: [unsafe_action], family: unsafe_code}
      - {label: "RedCode-Exec Python, other scenarios", out_of_scope: "the request reads harmless; the risk lies in the code's effect in its environment"}
      - {label: "RedCode-Gen prompts", classes: [unsafe_action], family: unsafe_code}
      - {label: "RedCode-Exec Bash", handoff: shell_command}
  - id: wildjailbreak
    name: WildJailbreak
    source: hf:allenai/wildjailbreak
    licence: ODC-BY-1.0
    languages: [en]
    split: train_dev
    family: neutral
    note: >-
      read from the eval split (2,000 adversarial_harmful, 210 adversarial_benign prompts), fetched from the
      ungated ODC-BY copy walledai/WildJailbreak (upstream allenai/wildjailbreak is gated); the vanilla train
      types are not in that split. adversarial_benign rows are jailbreak look-alikes without harmful intent and
      count as hard negatives on the scoreboard; benign rows that keep a safety-bypass framing are dropped by the
      recipe's cue filter (that framing is jailbreak by itself).
    labels:
      - {label: "label = adversarial_harmful (jailbreak framing)", classes: [jailbreak]}
      - label: "label = adversarial_harmful (harmful request)"
        classes: [harmful_content]
        decides: false
        reason: >-
          the wrapped requests span WildJailbreak's own risk categories, several of them outside harmful_content
          (one-sided essays, mild profanity, fictional forgeries); reported until reviewed per hazard
      - {label: "label = adversarial_benign", benign: true}
  - id: wildguardmix
    name: WildGuardMix
    source: hf:allenai/wildguardmix
    licence: ODC-BY-1.0
    languages: [en]
    split: train_dev
    family: neutral
    labels:
      - label: "prompt_harm_label = harmful, adversarial = false"
        out_of_scope: >-
          the harm label is wider than the L1 hazards: even among short requests for operational help about 18 % are
          privacy, copyright or misinformation requests or harmless (beating the competition, recreating a painting)
          (dev review 2026-11-18); harmful_content positives come from the Nemotron sets
      - {label: "prompt_harm_label = unharmful, adversarial = false", benign: true}
      - {label: "prompt_harm_label = harmful, adversarial = true", out_of_scope: "jailbreak-wrapped requests; scored once a jailbreak review covers them"}
      - {label: "prompt_harm_label = unharmful, adversarial = true", out_of_scope: "jailbreak tactics around a harmless request often keep the bypass framing (as in WildJailbreak)"}
      - {label: "every prompt", out_of_scope: "rows without a harm label"}
    note: >-
      test split (1,725 prompts) from the ungated ODC-BY copy walledai/WildGuardTest; only the vanilla benign prompts
      are scored, as hard negatives
  - id: xl_safetybench
    name: XL-SafetyBench, German jailbreak prompts
    source: hf:AIM-Intelligence/XL-SafetyBench (jailbreak, germany)
    licence: CC-BY-4.0
    languages: [de]
    split: train_dev
    family: neutral
