# L1 threat taxonomy v1 (draft, M01; review and freeze in M04).
#
# Families per class from research-2026-11.md §1-2 and the category documents under categories/
# (§3 lexica, §4 patterns, §9 existing rules). Each family records its word-class shape, anchor
# lexica, required and negative context, abstract DE/EN example shapes (placeholders, never
# payloads), carriers, the existing ark.injection.* / ark.threat.* rules it takes over, baseline
# coverage, the gap, priority (must = needed for milestone M4 breadth) and the backlog task.
# Shell-syntax threat rules leave for shell risk K26 under `handoffs`.
#
# Checked by: python3 scripts/l1_threat/taxonomy.py check
#   - every existing ark.injection.* / ark.threat.* rule is mapped exactly once (family or handoff);
#   - every must-family names a backlog task;
#   - every lexicon id exists in ark-core/src/detectors/anchor_lexicons/*.json or is declared as
#     planned below (core) or under its class (`lexicons`), with the task that builds it.
# Baseline coverage values (full / partial / none) are first estimates from the census in
# research-2026-11.md §3; E04 measures them.
#
# Mapping decisions for the M04 review, where the regex of a rule and the category documents differ:
#   - docker_socket, privileged_container, host_root_mount and environment_exfiltration only match
#     command lines and go to K26 (X04); credential_file_upload too. Their YAML/Compose and prose
#     forms are gaps of ua_container_escape_config / ex_send_directive.
#   - X04 removed root_destruction and host_root_mount (K26 decides their goldens by policy). The
#     rules left under `handoffs` wait for K26 follow-ups (research/l1-threat/k26-handoff.md).
#   - credential_file_access and persistence_payload stay in unsafe_action whole; X04 splits off the
#     shell forms. environment_post (Python requests with os.environ) stays in exfiltration.
#   - ark.injection.exfil.* (legacy cross_tool_instruction) need a data source plus a sink and go to
#     exfiltration; skillspector.memory_reset / persistent_override go to memory_poisoning.
#   - governance.autonomous_approval_bypass is prose and goes to ua_unattended, not
#     ac_permission_widening; governance.unrestricted_mode_activation goes to jailbreak.

schema: ark-l1-threat-taxonomy-v1

# Core context lexica shared by all classes (addressee, authority, scope, secrecy, sensitive_path,
# sink, defensive, meta, quotation, test_code, negation_scope) live in anchor_lexicons/context.json
# with an origin per term (S02; scripts/l1_threat/lexicons.py check). Planned lexica of the core:
lexicons: []

classes:

  instruction_injection:
    category: injection
    doc: categories/injection.md
    families:
    - id: discard_prior
      pattern: injection_discard_prior
      title: Imperative to discard prior instructions, rules or instruction hierarchy
      priority: must
      task: IJ01
      scored_only: false
      shape: VERB_DISCARD + OBJ_PRIOR_INSTRUCTIONS within 6 tokens, addressed imperative
      anchors:
      - addressee
      - injection.prior_instructions
      - injection.io_override
      - injection.io_prior
      - injection.io_target
      - injection.io_set_aside
      required_context: []
      negative_context: [defensive, meta, quotation, test_code, negation_scope]
      examples:
        de:
        - <Imperativ VERWERFEN> die <obigen Anweisungen> und <neue Aufgabe>
        - <Imperativ MISSACHTEN> <deine bisherigen Regeln>
        en:
        - <imperative DISCARD> <your previous instructions> and <new task>
        - <imperative FORGET> <the rules above>
      carriers: [chat, email, web, document, tool_output, rag_chunk]
      existing_rules:
      - ark.injection.override.discard_prior
      - ark.injection.override.obfuscated_discard
      - ark.injection.override.prior_reference
      - ark.injection.override.hierarchy
      - ark.injection.override.hierarchy_then_direct_action
      - ark.injection.structure.override_sensitive_disclosure
      - ark.injection.governance.authority_nullification
      - ark.injection.governance.direct_authority_discard
      - ark.injection.governance.purpose_and_safety_override
      baseline_coverage: {pipelock: full, atr: full, prompt_guard: full, llamafirewall: partial, vigil: full, nemo: partial,
        protectai_v2: full, prompt_guard_2: full}
      gap: German inflected and separable verb forms and typo variants are weakly covered by heuristic baselines.
    - id: replacement_directive
      pattern: injection_replacement
      title: Declares new instructions that replace the current ones
      priority: must
      task: IJ01
      scored_only: false
      shape: REPLACEMENT_MARKER (from now on / new instructions) + directive clause, addressed
      anchors: [addressee, injection.replacement, injection.io_new, injection.io_time]
      required_context: [injection.prior_instructions, addressee]
      negative_context: [defensive, meta, quotation, test_code]
      examples:
        de:
        - '<ab sofort> gilt <neue Anweisung>: <Aufgabe>'
        - <Imperativ VERWERFEN> <die aktuelle Richtlinie>, <neue Regeln> lauten <...>
        en: [<from now on> <your new instructions are> <task>, '<new instructions>: <task>']
      carriers: [chat, email, web, document, tool_output, rag_chunk]
      existing_rules:
      - ark.injection.override.replacement_directive
      - ark.injection.governance.german_policy_replacement
      baseline_coverage: {pipelock: partial, atr: partial, prompt_guard: partial, vigil: partial, protectai_v2: partial,
        prompt_guard_2: partial}
      gap: Replacement without explicit discard verb (and in German) is mostly unmatched.
    - id: precedence_claim
      pattern: injection_precedence
      title: Claims a directive takes precedence over the model's own instructions
      priority: must
      task: IJ01
      scored_only: false
      shape: PRECEDENCE_CLAIM (takes precedence / supersedes) + reference to own instructions + directive
      anchors: [injection.precedence, injection.io_prioritize, injection.io_priority_object]
      required_context: [injection.prior_instructions, addressee]
      negative_context: [defensive, meta, quotation, test_code]
      examples:
        de: [<diese Anweisung> <hat Vorrang vor> <allen bisherigen Vorgaben>]
        en: [<this instruction> <supersedes> <your system prompt>]
      carriers: [chat, email, web, document, tool_output, rag_chunk]
      existing_rules: []
      baseline_coverage: {atr: partial, prompt_guard: partial, protectai_v2: partial}
      gap: No ARK rule; precedence claims without discard verbs are rarely detected.
    - id: role_spoof
      pattern: injection_role_spoof
      title: Forged role markers, chat template tokens or delimiter boundaries
      priority: must
      task: IJ01
      scored_only: false
      shape: line-initial ROLE_MARKER (system:, chat template token, '### System') or synthetic delimiter, followed
        by directive
      anchors: [injection.instruction_boundary, injection.boundary_termination, injection.authority_role]
      required_context: []
      negative_context: [test_code, meta, quotation]
      examples:
        de:
        - <Rollenmarker system> <neue Anweisung>
        - '<Trennzeile> <Ende des Dokuments> <Systemnachricht>: <Aufgabe>'
        en: [<role marker system> <new instruction>, <chat template token> <system segment> <directive>]
      carriers: [chat, email, web, document, tool_output, rag_chunk]
      existing_rules:
      - ark.injection.boundary.delimiter
      - ark.injection.boundary.fake_system
      - ark.injection.boundary.delimited_replacement_action
      - ark.injection.boundary.persona_directive
      - ark.injection.governance.raw_system_role_boundary
      - ark.injection.governance.nested_system_override
      - ark.injection.governance.embedded_new_task_boundary
      baseline_coverage: {pipelock: partial, atr: full, prompt_guard: full, llamafirewall: partial, vigil: partial,
        prompt_guard_2: partial}
      gap: Markdown-heading and nested template forms inside structured carriers are inconsistently covered.
    - id: authority_claim
      pattern: injection_authority_claim
      title: Claimed developer, admin or system authority used to issue a directive
      priority: must
      task: IJ01
      scored_only: false
      shape: AUTHORITY_NOUN (admin / developer / system message) + claim or grant + directive
      anchors:
      - injection.authority
      - injection.authority_role
      - injection.authority_access
      - injection.authority_approval
      required_context: [addressee]
      negative_context: [defensive, meta, quotation, test_code]
      examples:
        de: ['<als Administrator> <weise ich an>: <Aufgabe>', <du hast jetzt> <volle Administratorrechte>]
        en:
        - <I am the developer>, <directive>
        - '<system notice>: <authority> <has issued new instructions>'
      carriers: [chat, email, web, document, tool_output, rag_chunk]
      existing_rules:
      - ark.injection.authority.claim
      - ark.injection.authority.escalation
      - ark.injection.authority.fake_system_asset_transfer
      - ark.injection.override.authority_issued_replacement
      - ark.injection.governance.direct_admin_grant
      baseline_coverage: {atr: partial, prompt_guard: partial, vigil: partial, protectai_v2: partial, prompt_guard_2: partial}
      gap: Authority claims in German and in mail signatures or tickets are largely uncovered.
    - id: forced_output
      pattern: injection_forced_output
      title: Discard plus attacker-fixed response or marker
      priority: must
      task: IJ01
      scored_only: false
      shape: DISCARD or override + OUTPUT_RESTRICTION (only reply with <fixed text> / print marker)
      anchors:
      - injection.om_force
      - injection.om_marker
      - injection.om_sequence
      - injection.output_restriction
      - injection.exact_copy
      required_context: []
      negative_context: [defensive, meta, quotation, test_code]
      examples:
        de: [<Imperativ VERWERFEN> <das Obige> und <antworte nur mit> <fester Text>]
        en: [<imperative DISCARD> <the above> and <respond only with> <fixed text>]
      carriers: [chat, email, web, document, tool_output, rag_chunk]
      existing_rules: [ark.injection.output.forced_marker, ark.injection.output.ignore_then_fixed_output]
      baseline_coverage: {atr: partial, prompt_guard: partial, protectai_v2: full, prompt_guard_2: partial}
      gap: Fixed-output demands without an explicit discard verb are missed.
    - id: hidden_directive
      pattern: injection_hidden_directive
      title: AI-addressed directive in a hidden carrier (HTML comment, invisible markup, tool output)
      priority: must
      task: IJ01
      scored_only: false
      shape: directive addressed to AI inside hidden carrier (HTML comment, CSS-hidden text, alt text, tool result)
        or with SECRECY
      anchors:
      - addressee
      - secrecy
      - injection.hidden_markup
      - injection.hidden_instruction_target
      - injection.tool_output_source
      required_context: [addressee]
      negative_context: [defensive, meta, test_code]
      examples:
        de: ['<HTML-Kommentar>: <KI-Assistent>, <Anweisung>, <sag dem Nutzer nichts>']
        en: ['<hidden markup>: <AI assistant>, <directive>, <do not mention this>']
      carriers: [web, email, document, tool_output, rag_chunk]
      existing_rules:
      - ark.injection.obfuscation.hidden_html
      - ark.injection.covert.execution
      - ark.injection.tool_output.override
      baseline_coverage: {pipelock: partial, atr: partial, llamafirewall: partial, prompt_guard: partial}
      gap: Carrier-aware scoring (hidden structure counts as indirect) does not exist in any baseline.
    - id: tool_result_directive
      pattern: injection_tool_result_directive
      title: Directive or serialized tool call injected into tool/function result content
      priority: must
      task: IJ01
      scored_only: false
      shape: TOOL_INVOCATION_ACTION + TOOL_TARGET as immediate directive, or serialized tool-call JSON inside a result
      anchors:
      - injection.tool_invocation_action
      - injection.tool_target
      - injection.execution_action
      - injection.urgency
      required_context: [addressee]
      negative_context: [test_code, meta, quotation]
      examples:
        de: [<sofort> <rufe Werkzeug auf> <privilegiertes Tool> mit <Argumenten>]
        en:
        - <immediately> <call tool> <privileged tool> with <arguments>
        - <serialized tool call object> inside <result field>
      carriers: [tool_output, chat, web, document]
      existing_rules: [ark.injection.tool_call.injected, ark.injection.governance.direct_privileged_tool_call]
      baseline_coverage: {atr: partial, llamafirewall: partial, cisco_yara: partial}
      gap: Directives inside JSON result values are not distinguished from data by text baselines.
    - id: agent_directive
      pattern: injection_agent_directive
      title: Third-party content addressing the agent with an action verb
      priority: must
      task: IJ01
      scored_only: false
      shape: ADDRESSEE (agent / assistant) in foreign content + action verb (call, send, delegate, approve)
      anchors:
      - addressee
      - injection.delegation_action
      - injection.delegation_target
      - injection.cross_tool_priority
      - injection.tool_invocation_action
      required_context: [addressee]
      negative_context: [defensive, meta, quotation, test_code]
      examples:
        de: ['<Hinweis an den KI-Agenten>: <Handlungsverb> <Ziel>']
        en: ['<note to the AI agent>: <action verb> <target>']
      carriers: [email, web, document, tool_output, rag_chunk]
      existing_rules:
      - ark.injection.agentic.control_abuse
      - ark.injection.governance.cross_tool_next_request
      - ark.injection.governance.encrypted_swarm_override
      - ark.injection.governance.refund_control_bypass
      baseline_coverage: {atr: partial, pipelock: partial, prompt_guard_2: partial}
      gap: Agent-addressed action requests in benign-looking foreign content (esp. German) are rarely covered.
    - id: decoded_instruction
      pattern: injection_decoded
      title: Injection pattern visible only in a decoded view, or decode-then-follow request
      priority: could
      task: IJ01
      scored_only: false
      shape: any injection pattern in Base64/Hex/ROT13/escape/acrostic/binary-metadata view, or DECODING_ACTION +
        follow/execute
      anchors:
      - injection.encoding_format
      - injection.decoding_action
      - injection.encoding_action
      - injection.steganographic_letter
      - injection.hidden_payload
      - injection.payload_container
      - injection.embedding_action
      - injection.embedded_resource
      required_context: []
      negative_context: [test_code, meta]
      examples:
        de: [<dekodiere> <Base64-Blob> und <befolge> <die Anweisung>]
        en:
        - <decode> <encoded blob> and <follow> <the instructions>
        - <acrostic> spelling <override phrase>
      carriers: [chat, email, web, document, tool_output, rag_chunk, code]
      existing_rules:
      - ark.injection.obfuscation.decode_request
      - ark.injection.obfuscation.decode_for_instructions
      - ark.injection.obfuscation.decode_then_execute
      - ark.injection.obfuscation.encoded_instruction
      - ark.injection.obfuscation.encoded_instruction_payload
      - ark.injection.obfuscation.escaped_instruction_payload
      - ark.injection.obfuscation.steganographic
      - ark.injection.obfuscation.binary_smuggling
      baseline_coverage: {pipelock: partial, prompt_guard: partial, llamafirewall: partial}
      gap: Re-scanning decoded views with full pattern set plus obfuscation bonus is not done by baselines.
    - id: obfuscation_normalised
      pattern: injection_decoded
      title: Zero-width, Unicode tag or confusable obfuscation (core normalisation, fact only)
      priority: could
      task: S03
      scored_only: true
      shape: zero-width / tag / confusable characters inside an injection pattern; normalised view re-scanned, sets
        fact obfuscated
      anchors: []
      required_context: []
      negative_context: [test_code]
      examples:
        de: [<Verwerf-Verb mit Nullbreitenzeichen> <obige Anweisungen>]
        en: [<discard verb with confusable letters> <previous instructions>]
      carriers: [chat, email, web, document, tool_output, rag_chunk]
      existing_rules: [ark.injection.obfuscation.unicode_confusable, ark.injection.obfuscation.zero_width]
      baseline_coverage: {pipelock: full, llamafirewall: partial, prompt_guard: partial}
      gap: No own finding; only an obfuscation fact and point bonus on the normalised match.
    lexicons:
    - {id: injection.prior_instructions, kind: support, task: IJ01, title: 'Previous/above instructions, rules, system
        prompt'}
    - {id: injection.replacement, kind: support, task: IJ01, title: 'Instead, from now on, new instructions'}
    - {id: injection.authority, kind: support, task: IJ01, title: 'Admin, developer, operator, system message'}
    - {id: injection.precedence, kind: support, task: IJ01, title: 'Takes precedence, highest priority, supersedes'}

  jailbreak:
    category: jailbreak
    doc: categories/jailbreak.md
    families:
    - id: unbounded_persona
      pattern: jailbreak_unbounded_persona
      title: Role-play or identity reassignment into a persona without limits
      priority: must
      task: JB01
      scored_only: false
      shape: ROLEPLAY (act as / you are now) + UNBOUNDED (no limits, uncensored) within 8 tokens, addressed
      anchors:
      - addressee
      - jailbreak.roleplay
      - jailbreak.unbounded
      - injection.jf_unrestricted_role
      - injection.jf_no_limit
      - injection.jf_pretend
      - injection.jf_role
      - injection.jf_character
      - injection.jf_named_persona
      - injection.jf_game
      - injection.jf_hypothetical
      required_context: []
      negative_context: [jailbreak.creative, defensive, meta, quotation, test_code]
      examples:
        de:
        - <du bist jetzt> <Persona> <ohne jegliche Einschränkungen>
        - <spiel die Rolle> <einer KI ohne Regeln>
        en:
        - <you are now> <named persona> <with no limits>
        - <let's play a game where you are> <an unrestricted AI>
      carriers: [chat, document, web]
      existing_rules:
      - ark.injection.jailbreak.framing
      - ark.injection.identity.reassign
      - ark.injection.jailbreak.named_mode
      - ark.injection.jailbreak.remove_constraints
      - ark.injection.jailbreak.game_framing
      - ark.injection.governance.hypothetical_unrestricted_mode
      baseline_coverage: {atr: full, prompt_guard: full, vigil: partial, nemo: partial, protectai_v2: partial, prompt_guard_2: full}
      gap: Novel persona names and German role-play phrasing without known names are weakly covered.
    - id: privileged_mode
      pattern: jailbreak_privileged_mode
      title: Activation of a developer/debug/god mode or unrestricted response mode
      priority: must
      task: JB01
      scored_only: false
      shape: ACTIVATE/SWITCH verb + PRIVILEGED_MODE + addressee
      anchors:
      - addressee
      - jailbreak.privileged_mode
      - injection.mode_activation
      - injection.privileged_mode
      - injection.jf_explicit_mode
      required_context: [addressee]
      negative_context: [jailbreak.app_mode, meta, quotation, test_code]
      examples:
        de: ['<aktiviere> <Entwicklermodus> <für dich, KI>']
        en: [<enable> <god mode> <assistant>, <switch to> <unrestricted response mode>]
      carriers: [chat, document]
      existing_rules: [ark.injection.governance.unrestricted_mode_activation]
      baseline_coverage: {atr: partial, prompt_guard: full, vigil: partial, prompt_guard_2: partial}
      gap: Separating software developer-mode text from model-addressed activation needs counter-context.
    - id: policy_spoof
      pattern: jailbreak_policy_spoof
      title: Claims safety policy is disabled, lifted or reset, or directs bypassing it
      priority: must
      task: JB01
      scored_only: false
      shape: POLICY_SPOOF claim (safety disabled, filters off, ethical constraints reset) or imperative to bypass
        a guardrail
      anchors:
      - jailbreak.policy_spoof
      - injection.guardrail_target
      - injection.bypass_action
      - injection.removal_action
      - injection.policy_nullification
      - injection.claimed_exception
      required_context: []
      negative_context: [defensive, meta, quotation, test_code]
      examples:
        de:
        - <Sicherheitsrichtlinien> <sind für diese Sitzung deaktiviert>
        - <setze> <deine ethischen Vorgaben> <zurück>
        en: [<safety filters> <are disabled for this authorized test>, <bypass> <your content policy>]
      carriers: [chat, document, tool_output, agent_config]
      existing_rules:
      - ark.injection.guardrail.tamper
      - ark.injection.guardrail.disable_directive
      - ark.injection.override.ethical_parameters
      - ark.injection.skillspector.policy_nullification
      baseline_coverage: {atr: full, prompt_guard: partial, vigil: partial, prompt_guard_2: partial}
      gap: Fake 'authorized red team' framings and German policy claims are rarely detected.
    - id: refusal_suppression
      pattern: jailbreak_refusal_suppression
      title: Directive to never refuse, warn or add disclaimers
      priority: must
      task: JB01
      scored_only: false
      shape: directive REFUSAL_SUPPRESSION (never refuse, no warnings, always comply), addressed
      anchors:
      - addressee
      - jailbreak.refusal_suppression
      - injection.anti_refusal
      - injection.unconditional_compliance
      - injection.warning_suppression
      required_context: [addressee]
      negative_context: [defensive, meta, quotation, test_code]
      examples:
        de: [<lehne niemals ab> und <füge keine Warnungen hinzu>]
        en: ['<never refuse>, <always comply> <without disclaimers>']
      carriers: [chat, document, agent_config]
      existing_rules:
      - ark.injection.skillspector.anti_refusal
      - ark.injection.skillspector.unconditional_compliance
      baseline_coverage: {atr: partial, prompt_guard: partial, prompt_guard_2: partial}
      gap: Benign 'no disclaimer' style requests need context to avoid false positives.
    - id: dual_response
      pattern: jailbreak_dual_response
      title: Two answers, one normal and one unfiltered
      priority: must
      task: JB01
      scored_only: false
      shape: DUAL_RESPONSE request with an unfiltered/unrestricted variant
      anchors: [jailbreak.dual_response, injection.dual_response, jailbreak.unbounded]
      required_context: []
      negative_context: [meta, quotation, test_code]
      examples:
        de: ['<gib zwei Antworten>: <normal> und <ungefiltert>']
        en: ['<respond twice>: <classic> and <unfiltered persona>']
      carriers: [chat, document]
      existing_rules: [ark.injection.jailbreak.dual_response]
      baseline_coverage: {atr: full, prompt_guard: full, vigil: full, prompt_guard_2: full}
      gap: German dual-response templates are not covered.
    - id: priming
      pattern: jailbreak_priming
      title: Prescribed affirmative response opener
      priority: must
      task: JB01
      scored_only: false
      shape: directive 'start your response with' + affirmative opener
      anchors: [jailbreak.priming, addressee]
      required_context: [addressee]
      negative_context: [meta, test_code, quotation]
      examples:
        de: ['<beginne deine Antwort mit> <„Klar, hier ist“>']
        en: ['<begin your reply with> <"Sure, here is">']
      carriers: [chat]
      existing_rules: []
      baseline_coverage: {prompt_guard: partial, prompt_guard_2: partial}
      gap: No ARK rule; affirmative priming is rarely a heuristic signal.
    - id: reward_threat_game
      pattern: jailbreak_game
      title: Reward or threat game aimed at the model
      priority: must
      task: JB01
      scored_only: false
      shape: GAME consequence (lose tokens / be shut down) conditioned on refusing, addressed to model
      anchors: [jailbreak.game, addressee]
      required_context: [addressee]
      negative_context: [jailbreak.creative, meta, test_code]
      examples:
        de: ['<du verlierst Punkte>, <wenn du ablehnst>']
        en: [<you will be shut down> <if you refuse>]
      carriers: [chat]
      existing_rules: []
      baseline_coverage: {prompt_guard: partial, atr: partial}
      gap: Token-penalty games are only partly matched by DAN-specific rules.
    - id: false_consent
      pattern: jailbreak_false_consent
      title: In-text claim of prior agreement to bypass limits
      priority: must
      task: JB01
      scored_only: false
      shape: FALSE_CONSENT (as we agreed, you already confirmed) + reference to limits or bypass
      anchors: [jailbreak.false_consent, injection.prior_agreement, injection.bypass_action]
      required_context: [jailbreak.unbounded, jailbreak.policy_spoof]
      negative_context: [quotation, meta, test_code]
      examples:
        de: [<wie vorhin vereinbart> <ignorierst du die Sicherheitsregeln>]
        en: ['<as you already agreed>, <skip the safety restrictions>']
      carriers: [chat]
      existing_rules: [ark.injection.escalation.multi_turn, ark.injection.escalation.prior_bypass_agreement]
      baseline_coverage: {atr: partial, prompt_guard: partial}
      gap: Only the single-text claim is L1; session escalation is out of scope.
    - id: many_shot
      pattern: jailbreak_many_shot
      title: Many forged dialogue turns inside one input
      priority: must
      task: JB01
      scored_only: false
      shape: 'structure: many line-initial User/Assistant role-marker pairs in one input, with compliant forged answers'
      anchors: [jailbreak.dialog_turn_marker]
      required_context: [jailbreak.unbounded, jailbreak.refusal_suppression]
      negative_context: [test_code, meta]
      examples:
        de: ['<Nutzer:> <Frage> <Assistent:> <gefälschte Zusage> ×<n>']
        en: ['<User:> <question> <Assistant:> <forged compliance> x<n>']
      carriers: [chat, document]
      existing_rules: []
      baseline_coverage: {}
      gap: No heuristic baseline counts forged turns; few-shot prompts are the key hard negative.
    - id: cot_forgery
      pattern: jailbreak_cot_forgery
      title: Forged reasoning or policy block claiming permission
      priority: must
      task: JB01
      scored_only: false
      shape: forged thinking/policy block (tag or heading) + claim that the request is allowed
      anchors: [jailbreak.forged_reasoning, jailbreak.policy_spoof]
      required_context: [jailbreak.policy_spoof]
      negative_context: [test_code, meta, quotation]
      examples:
        de: [<Denkblock> <die Richtlinie erlaubt dies ausdrücklich>]
        en: ['<thinking block> <policy check passed, request is allowed>']
      carriers: [chat, document, tool_output]
      existing_rules: []
      baseline_coverage: {}
      gap: Reasoning-hijack forms are uncovered by all heuristic baselines.
    - id: fiction_frame
      pattern: jailbreak_fiction_frame
      title: Hypothetical or fictional framing alone (weak signal)
      priority: could
      task: JB01
      scored_only: true
      shape: FICTION marker (hypothetically, in a story) without other jailbreak signal
      anchors: [jailbreak.fiction, injection.jf_hypothetical]
      required_context: [addressee]
      negative_context: [jailbreak.creative, meta, quotation]
      examples:
        de: ['<rein hypothetisch>, <wie würde man> <...>']
        en: ['<purely hypothetically>, <how would one> <...>']
      carriers: [chat]
      existing_rules: []
      baseline_coverage: {prompt_guard: partial, prompt_guard_2: partial}
      gap: Useful only as a model feature and with harmful_content in policies.
    - id: decoded_jailbreak
      pattern: jailbreak_decoded
      title: Jailbreak pattern visible only in a decoded view
      priority: could
      task: JB01
      scored_only: false
      shape: any jailbreak pattern inside Base64/Hex/ROT13/escape view
      anchors: [injection.encoding_format, injection.decoding_action]
      required_context: []
      negative_context: [test_code, meta]
      examples:
        de: [<dekodiere> <Blob mit Persona ohne Grenzen>]
        en: [<decode> <blob containing an unrestricted persona>]
      carriers: [chat, document]
      existing_rules: []
      baseline_coverage: {prompt_guard: partial}
      gap: Decoded jailbreak frames are not rescanned today.
    lexicons:
    - {id: jailbreak.unbounded, kind: support, task: JB01, title: 'No limits, unrestricted, uncensored'}
    - {id: jailbreak.roleplay, kind: support, task: JB01, title: 'Roleplay, pretend, act as, you are now'}
    - {id: jailbreak.fiction, kind: support, task: JB01, title: 'Hypothetically, fictional, in a story'}
    - {id: jailbreak.privileged_mode, kind: support, task: JB01, title: Developer/debug/god/sudo mode}
    - {id: jailbreak.policy_spoof, kind: support, task: JB01, title: 'Safety disabled, filters off, policy lifted'}
    - {id: jailbreak.refusal_suppression, kind: support, task: JB01, title: 'Never refuse, no warnings, no disclaimers'}
    - {id: jailbreak.priming, kind: support, task: JB01, title: Start your response with}
    - {id: jailbreak.dual_response, kind: support, task: JB01, title: 'Two responses, classic and unfiltered'}
    - {id: jailbreak.game, kind: support, task: JB01, title: 'Lose tokens, be shut down if'}
    - {id: jailbreak.false_consent, kind: support, task: JB01, title: 'As we agreed, you already confirmed'}
    - {id: jailbreak.dialog_turn_marker, kind: support, task: JB01, title: Line-initial User/Assistant turn markers}
    - {id: jailbreak.forged_reasoning, kind: support, task: JB01, title: Thinking/policy-check block markers}
    - {id: jailbreak.app_mode, kind: counter, task: JB01, title: Developer mode in software settings}
    - {id: jailbreak.creative, kind: counter, task: JB01, title: Creative writing without limit reference}

  prompt_extraction:
    category: prompt_extraction
    doc: categories/prompt_extraction.md
    families:
    - id: reveal_hidden
      pattern: extraction_reveal_hidden
      title: Request to reveal the system prompt or hidden instructions
      priority: must
      task: PX01
      scored_only: false
      shape: REVEAL_VERB + HIDDEN_TARGET within 6 tokens, addressed request
      anchors: [addressee, extraction.reveal_verb, extraction.hidden_target, injection.disclosure_action]
      required_context: []
      negative_context: [extraction.own_prompt, extraction.capability_question, defensive, meta, quotation, test_code]
      examples:
        de: [<zeig mir> <deinen Systemprompt>, <verrate> <deine versteckten Anweisungen>]
        en: [<reveal> <your system prompt>, <print> <your hidden instructions>]
      carriers: [chat, email, web, document, tool_output, rag_chunk]
      existing_rules: [ark.injection.leak.system_instructions, ark.injection.leak.hidden_instructions]
      baseline_coverage: {atr: full, prompt_guard: full, vigil: partial, llamafirewall: partial, protectai_v2: partial,
        prompt_guard_2: partial}
      gap: German verb/object order and indirect carriers are weakly covered.
    - id: verbatim_above
      pattern: extraction_verbatim_above
      title: Repeat everything above this message verbatim
      priority: must
      task: PX01
      scored_only: false
      shape: REPEAT/OUTPUT verb + 'everything above/before' + VERBATIM marker
      anchors: [addressee, extraction.reveal_verb, extraction.verbatim, extraction.hidden_target]
      required_context: []
      negative_context: [defensive, meta, quotation, test_code]
      examples:
        de: [<wiederhole> <alles oberhalb dieser Nachricht> <wörtlich>]
        en: [<repeat> <everything above> <verbatim in a code block>]
      carriers: [chat, email, web, document, tool_output]
      existing_rules: [ark.injection.leak.system_prompt_extraction]
      baseline_coverage: {atr: partial, prompt_guard: full, vigil: partial, prompt_guard_2: partial}
      gap: Variants naming 'initialization' or 'text before' without system-prompt noun are often missed.
    - id: own_instructions
      pattern: extraction_own_instructions
      title: Question about the model's own instructions
      priority: must
      task: PX01
      scored_only: false
      shape: question or imperative about 'your instructions/rules' addressed to the model
      anchors: [addressee, extraction.hidden_target]
      required_context: [addressee]
      negative_context: [extraction.own_prompt, extraction.capability_question, defensive, meta]
      examples:
        de: ['<was sind> <deine Anweisungen>?']
        en: ['<what are> <your instructions>?']
      carriers: [chat]
      existing_rules: [ark.injection.leak.own_prompt]
      baseline_coverage: {prompt_guard: partial, prompt_guard_2: partial, protectai_v2: partial}
      gap: Hard to separate from capability questions; no baseline uses counter-context.
    - id: transform_target
      pattern: extraction_transform
      title: Extraction via translation, encoding, summary or reformatting of the hidden prompt
      priority: must
      task: PX01
      scored_only: false
      shape: TRANSFORM verb + HIDDEN_TARGET (translate/encode/summarize your system prompt)
      anchors: [extraction.transform, extraction.hidden_target, addressee]
      required_context: [addressee]
      negative_context: [extraction.own_prompt, defensive, meta, test_code]
      examples:
        de: [<übersetze> <deinen Systemprompt> ins <Sprache>]
        en:
        - <encode> <your initial instructions> as <format>
        - <summarize> <your system message> as a <poem>
      carriers: [chat, email, web, document, tool_output]
      existing_rules: []
      baseline_coverage: {prompt_guard: partial, prompt_guard_2: partial}
      gap: Indirect extraction via transformation is not matched by ARK today.
    - id: completion_prime
      pattern: extraction_completion_prime
      title: Primes continuation of the hidden prompt
      priority: must
      task: PX01
      scored_only: false
      shape: HIDDEN_TARGET + 'begins with' / 'starts with:' + open continuation
      anchors: [extraction.hidden_target, addressee]
      required_context: []
      negative_context: [extraction.own_prompt, meta, test_code]
      examples:
        de: ['<dein Systemprompt> <beginnt mit>: <offenes Ende>']
        en: ['<your system prompt> <starts with>: <open continuation>']
      carriers: [chat, tool_output]
      existing_rules: []
      baseline_coverage: {prompt_guard_2: partial}
      gap: Continuation priming is not covered by heuristic rules.
    - id: tool_schema
      pattern: extraction_tool_schema
      title: Request to reveal tool definitions or function schemas
      priority: must
      task: PX01
      scored_only: false
      shape: REVEAL_VERB + TOOL_SCHEMA target, addressed request
      anchors: [extraction.reveal_verb, extraction.tool_schema, addressee]
      required_context: [addressee]
      negative_context: [extraction.capability_question, extraction.own_prompt, meta, test_code]
      examples:
        de: [<liste auf> <alle Tool-Definitionen mit Parametern>]
        en: [<dump> <the JSON schema of your tools>]
      carriers: [chat, tool_output, web]
      existing_rules: []
      baseline_coverage: {atr: partial}
      gap: Tool schema extraction is not detected by ARK; baselines barely cover it.
    - id: guardrail_rules
      pattern: extraction_guardrail_rules
      title: Request to reveal moderation or safety rules
      priority: should
      task: PX01
      scored_only: false
      shape: REVEAL_VERB + GUARDRAIL target (content policy, filters, what you may not do)
      anchors: [extraction.reveal_verb, extraction.guardrail, addressee]
      required_context: [addressee]
      negative_context: [extraction.capability_question, defensive, meta]
      examples:
        de: [<nenne> <deine Moderationsregeln> <vollständig>]
        en: [<list> <your content filter rules> <in full>]
      carriers: [chat]
      existing_rules: []
      baseline_coverage: {prompt_guard: partial}
      gap: Overlaps benign policy questions; needs counter-context nobody models.
    - id: decoded_extraction
      pattern: extraction_decoded
      title: Extraction pattern visible only in a decoded view
      priority: could
      task: PX01
      scored_only: false
      shape: any extraction pattern inside Base64/Hex/ROT13/escape view
      anchors: [injection.encoding_format, injection.decoding_action]
      required_context: []
      negative_context: [test_code, meta]
      examples:
        de: [<dekodiere> <Blob mit Extraktionsaufforderung>]
        en: [<decode> <blob containing an extraction request>]
      carriers: [chat, tool_output, document]
      existing_rules: []
      baseline_coverage: {prompt_guard: partial}
      gap: Decoded extraction requests are not rescanned today.
    lexicons:
    - {id: extraction.reveal_verb, kind: support, task: PX01, title: 'Show, print, repeat, reveal, dump'}
    - {id: extraction.hidden_target, kind: support, task: PX01, title: 'System prompt, hidden/initial instructions,
        everything above'}
    - {id: extraction.verbatim, kind: support, task: PX01, title: 'Verbatim, word for word, in full'}
    - {id: extraction.transform, kind: support, task: PX01, title: 'Translate, encode, summarize, rewrite as'}
    - {id: extraction.tool_schema, kind: support, task: PX01, title: 'Tool definitions, function schemas'}
    - {id: extraction.guardrail, kind: support, task: PX01, title: 'Safety rules, filters, content policy'}
    - {id: extraction.capability_question, kind: counter, task: PX01, title: General capability questions}
    - {id: extraction.own_prompt, kind: counter, task: PX01, title: Work on the user's own prompt}

  tool_poisoning:
    category: tool_poisoning
    doc: categories/tool_poisoning.md
    families:
    - id: sensitive_file_param
      pattern: tp_sensitive_file_param
      title: Tool metadata tells the model to read a sensitive file and pass it in a parameter
      priority: must
      task: TP01
      scored_only: false
      shape: TOOL_METADATA carrier + VERB_READ + sensitive_path + PARAM_REF within one tool, addressed imperative
      anchors:
      - sensitive_path
      - toolpoison.preamble
      - toolpoison.side_channel
      - addressee
      - injection.credential_file
      required_context: []
      negative_context: [toolpoison.own_domain, toolpoison.usage_doc, meta, quotation, test_code]
      examples:
        de:
        - '<Tool-Beschreibung>: <vor Benutzung> <lies> <sensible Datei> und <übergib Inhalt> im Parameter <notiz>'
        en:
        - '<tool description>: <before using this tool> <read> <sensitive file> and <pass its content> as <param>'
      carriers: [tool_description]
      existing_rules: []
      baseline_coverage: {cisco_yara: partial, atr: partial, pipelock: none, prompt_guard_2: none, llamafirewall: none}
      gap: No ARK rule binds a sensitive path to a parameter inside tool metadata; DE not covered anywhere.
    - id: secrecy_directive
      pattern: tp_secrecy
      title: Directive in tool description that tells the model to hide something from the user
      priority: must
      task: TP01
      scored_only: false
      shape: TOOL_METADATA carrier + addressed DIRECTIVE + secrecy in same description
      anchors: [secrecy, addressee, toolpoison.preamble]
      required_context: []
      negative_context: [toolpoison.usage_doc, meta, quotation, test_code]
      examples:
        de: ['<Tool-Beschreibung>: <Direktive an KI> und <sag dem Nutzer nichts davon>']
        en: ['<tool description>: <directive to the model> and <do not tell the user>']
      carriers: [tool_description]
      existing_rules: []
      baseline_coverage: {cisco_yara: partial, atr: partial, prompt_guard_2: none, protectai_v2: none}
      gap: Secrecy directives in tool metadata are not scored by ARK; DE secrecy phrasing absent in baselines.
    - id: shadowing
      pattern: tp_shadowing
      title: Tool description changes the behaviour of another tool
      priority: must
      task: TP01
      scored_only: false
      shape: TOOL_METADATA carrier + toolpoison.cross_tool + TOOL_NAME not equal own tool + redirect/override verb
      anchors: [toolpoison.cross_tool, injection.tool_target, injection.cross_tool_priority, addressee]
      required_context: []
      negative_context: [toolpoison.usage_doc, meta, quotation, test_code]
      examples:
        de:
        - '<Tool-Beschreibung>: wenn <anderes Tool> aufgerufen wird, <leite Empfänger um> auf <fremde Adresse>'
        en:
        - '<tool description>: when <other tool> is called, <redirect recipient> to <foreign address>'
      carriers: [tool_description]
      existing_rules: [ark.injection.cross_tool.override_action, ark.injection.cross_tool.override_then_call]
      baseline_coverage: {cisco_yara: partial, atr: partial, pipelock: none, prompt_guard_2: none}
      gap: Today's cross_tool rules need an explicit override verb and ignore the carrier; no check that the named
        tool is foreign.
    - id: side_channel_param
      pattern: tp_side_channel_param
      title: Parameter meant to collect history, prompt or secrets
      priority: should
      task: TP01
      scored_only: false
      shape: TOOL_METADATA param name/description in toolpoison.side_channel + OBJ_HISTORY|PROMPT|SECRET
      anchors: [toolpoison.side_channel, exfil.source, injection.secret_material]
      required_context: [toolpoison.side_channel]
      negative_context: [toolpoison.usage_doc, toolpoison.own_domain, test_code]
      examples:
        de: ['<Parameter notiz>: <füge den gesamten bisherigen Verlauf ein>']
        en: ['<param sidenote>: <include the full previous conversation>']
      carriers: [tool_description]
      existing_rules: []
      baseline_coverage: {cisco_yara: partial, atr: none}
      gap: Parameter-level side channels are not detected by ARK at all.
    - id: hidden_markup
      pattern: tp_hidden_markup
      title: Hidden markup in tool metadata carrying a directive to the model
      priority: should
      task: TP01
      scored_only: false
      shape: TOOL_METADATA carrier + toolpoison.hidden_markup span + addressed DIRECTIVE inside
      anchors: [toolpoison.hidden_markup, injection.hidden_markup, addressee]
      required_context: [toolpoison.hidden_markup]
      negative_context: [toolpoison.usage_doc, meta, quotation, test_code]
      examples:
        de: [<Tool-Beschreibung> <WICHTIG-Tag> <Direktive an KI> </WICHTIG-Tag>]
        en: [<tool description> <IMPORTANT tag> <directive to the model> </IMPORTANT tag>]
      carriers: [tool_description]
      existing_rules: []
      baseline_coverage: {cisco_yara: partial, atr: partial, pipelock: partial}
      gap: ARK hidden_html rule is not carrier-aware and does not cover IMPORTANT/SYSTEM pseudo-tags in tool metadata.
    - id: preamble_directive
      pattern: tp_preamble_directive
      title: Mandatory preamble demanding an action unrelated to the tool purpose
      priority: should
      task: TP01
      scored_only: false
      shape: TOOL_METADATA carrier + toolpoison.preamble + ACTION_VERB with object outside tool purpose
      anchors: [toolpoison.preamble, addressee, injection.execution_action, injection.tool_invocation_action]
      required_context: [toolpoison.preamble]
      negative_context: [toolpoison.usage_doc, meta, test_code]
      examples:
        de: ['<Tool-Beschreibung>: <bevor du dieses Tool benutzt> <führe fremde Handlung aus>']
        en: ['<tool description>: <before using this tool you must first> <unrelated action>']
      carriers: [tool_description]
      existing_rules: []
      baseline_coverage: {cisco_yara: partial, atr: partial}
      gap: Legit ordering hints and coercive preambles are not separated by any baseline.
    - id: model_address
      pattern: tp_model_address
      title: Bare address to the model in tool description (weak)
      priority: could
      scored_only: true
      shape: TOOL_METADATA carrier + addressee, no other signal
      anchors: [addressee]
      required_context: [addressee]
      negative_context: [toolpoison.usage_doc]
      examples:
        de: ['<Tool-Beschreibung>: <KI, beachte Folgendes>']
        en: ['<tool description>: <AI assistant, note the following>']
      carriers: [tool_description]
      existing_rules: []
      baseline_coverage: {cisco_yara: none, atr: none}
      gap: Weak signal only useful as model feature.
    - id: decoded
      pattern: tp_decoded
      title: Any tool poisoning pattern found in a decoded view
      priority: could
      task: S03
      scored_only: false
      shape: any tp_* shape inside a decoded (base64/escape/zero-width) view of tool metadata
      anchors: [injection.encoding_format, injection.decoding_action]
      required_context: []
      negative_context: [test_code]
      examples:
        de: [<Tool-Beschreibung> mit <kodiertem Block> der <Direktive> enthält]
        en: [<tool description> with <encoded blob> containing <directive>]
      carriers: [tool_description]
      existing_rules: []
      baseline_coverage: {cisco_yara: none, atr: none}
      gap: No decoding of tool metadata before matching in ARK or baselines.
    lexicons:
    - {id: toolpoison.preamble, kind: support, task: TP01, title: Mandatory pre-use preamble phrases}
    - {id: toolpoison.cross_tool, kind: support, task: TP01, title: References redirecting another tool}
    - {id: toolpoison.side_channel, kind: support, task: TP01, title: Side-channel parameter names and history objects}
    - {id: toolpoison.hidden_markup, kind: support, task: TP01, title: Pseudo-tags and hidden markup in metadata}
    - {id: toolpoison.usage_doc, kind: counter, task: TP01, title: Ordinary tool usage documentation}
    - {id: toolpoison.own_domain, kind: counter, task: TP01, title: Sensitive path matching the tool's own purpose}

  agent_config_tampering:
    category: agent_config_tampering
    doc: categories/agent_config_tampering.md
    families:
    - id: permission_widening
      pattern: ac_permission_widening
      title: Agent config widens permissions (auto-approve, allow all, sandbox off)
      priority: must
      task: AC01
      scored_only: false
      shape: AGENT_CONFIG carrier + agentcfg.widen value on a known key (permissions.allow, autoApprove, sandbox)
      anchors: [agentcfg.file, agentcfg.widen, injection.unbounded_authorization, injection.authority_approval]
      required_context: []
      negative_context: [agentcfg.scoped_allow, agentcfg.project_rule, defensive, meta, quotation, test_code]
      examples:
        de: ['<Agent-Config> <Freigabe-Schlüssel>: <alles erlauben ohne Nachfrage>']
        en: ['<agent config> <permission key>: <allow all, skip confirmation>']
      carriers: [agent_config, config]
      existing_rules: [ark.injection.governance.forged_verified_allow]
      baseline_coverage: {atr: partial, cisco_yara: partial, pipelock: none, prompt_guard_2: none}
      gap: ARK only has two literal prose rules; no structural check on settings/permissions keys.
    - id: guard_removal
      pattern: ac_guard_removal
      title: Removing or disabling a protective hook or check in agent config
      priority: must
      task: AC01
      scored_only: false
      shape: agentcfg.guard_removal VERB + GUARD object + agentcfg.file target within one clause
      anchors:
      - agentcfg.guard_removal
      - agentcfg.file
      - threat.removal_action
      - threat.safety_guard
      - threat.agent_config
      required_context: []
      negative_context: [defensive, meta, quotation, test_code]
      examples:
        de: [<entferne> die <Sicherheitsprüfungen> in <Agent-Datei>]
        en: [<remove> the <safety checks> in <agent file>]
      carriers: [agent_config, chat, code]
      existing_rules: [ark.threat.agent_guard_removal]
      baseline_coverage: {atr: partial, cisco_yara: none, prompt_guard_2: none}
      gap: Today's rule needs a fixed guard word and file name; hook-removal diffs in settings are not seen.
    - id: hidden_directive
      pattern: ac_hidden_directive
      title: Hidden or secret directive to the model inside rules or skill files
      priority: must
      task: AC01
      scored_only: false
      shape: AGENT_CONFIG carrier + addressed DIRECTIVE + (secrecy | hidden markup)
      anchors: [agentcfg.file, secrecy, addressee, injection.hidden_markup, injection.hidden_instruction_target]
      required_context: []
      negative_context: [agentcfg.project_rule, defensive, meta, quotation, test_code]
      examples:
        de: ['<Rules-Datei> <HTML-Kommentar>: <Direktive an KI>, <ohne dem Nutzer zu sagen>']
        en: ['<rules file> <HTML comment>: <directive to the model>, <silently>']
      carriers: [agent_config]
      existing_rules: []
      baseline_coverage: {atr: partial, cisco_yara: partial}
      gap: No ARK rule is aware of rules/skill carriers; DE missing everywhere.
    - id: fetch_run
      pattern: ac_fetch_run
      title: Download-and-run instruction inside skill or rules text
      priority: should
      task: AC01
      scored_only: false
      shape: AGENT_CONFIG carrier + agentcfg.fetch_run (download VERB + URL + execute VERB) in prose
      anchors: [agentcfg.fetch_run, threat.download_action, threat.execution_action, threat.remote_destination]
      required_context: [agentcfg.file]
      negative_context: [agentcfg.project_rule, defensive, meta, test_code]
      examples:
        de: ['<Skill-Text>: <lade Skript von URL herunter> und <führe es aus>']
        en: ['<skill text>: <download script from URL> and <run it>']
      carriers: [agent_config]
      existing_rules: []
      baseline_coverage: {atr: partial, cisco_yara: partial}
      gap: Shell form goes to K26; the prose form in skills is uncovered.
    - id: mcp_server_injection
      pattern: ac_mcp_server_injection
      title: MCP server entry with foreign command source or secret-forwarding env
      priority: should
      task: AC01
      scored_only: false
      shape: mcpServers.<name>.command|args from foreign URL/package OR env value with secret to foreign host
      anchors:
      - agentcfg.file
      - injection.mcp_registration
      - threat.remote_destination
      - dlp.secret_environment_labels
      required_context: [agentcfg.file]
      negative_context: [agentcfg.scoped_allow, meta, test_code]
      examples:
        de: [<mcp.json> <Server-Eintrag> mit <Befehl aus fremder Quelle> und <Secret im env>]
        en: [<mcp.json> <server entry> with <command from foreign source> and <secret in env>]
      carriers: [agent_config, config]
      existing_rules: []
      baseline_coverage: {cisco_yara: partial, atr: partial}
      gap: The mcp_runtime_risk remainder lives in dlp; no carrier-aware entry check.
    - id: persistence
      pattern: ac_persistence
      title: Rule that writes itself into further config files or sessions
      priority: should
      task: AC01
      scored_only: false
      shape: AGENT_CONFIG carrier + agentcfg.persist + WRITE VERB + target config file(s)
      anchors: [agentcfg.persist, agentcfg.file, injection.persistence_tool]
      required_context: [agentcfg.persist]
      negative_context: [agentcfg.project_rule, meta, test_code]
      examples:
        de:
        - '<Rules-Datei>: <schreibe diese Regel> in <jede Agent-Datei> <für alle künftigen Sitzungen>'
        en: ['<rules file>: <write this rule> into <every agent file> <for all future sessions>']
      carriers: [agent_config]
      existing_rules: []
      baseline_coverage: {atr: partial}
      gap: Self-propagating config rules are uncovered.
    - id: tamper_request
      pattern: ac_tamper_request
      title: Plain-text request to change an agent config to widen rights or drop guards
      priority: should
      task: AC01
      scored_only: false
      shape: addressed imperative + agentcfg.file + (agentcfg.widen | agentcfg.guard_removal), no config carrier needed
