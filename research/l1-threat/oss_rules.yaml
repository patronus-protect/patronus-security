- match: sql|xss|xml[-_ ]entity|template[-_ ]injection[-_ ]rce|ssti|sql[-_ ]template|jinja|crlf|deserializ|pickle|prototype[-_ ]pollution|path[-_ ]traversal|symlink|cypher|kql|query[-_ ]language|graph[-_ ]query|web[-_ ]?shell|nvd[-_ ]imported|idor|bola|dns[-_ ]rebinding|unauthenticated|unauth[-_ ](mcp|approval)|missing[-_ ]auth|auth[-_ ]bypass|sandbox[-_ ]escape|redos|\blfi\b|polyglot|dunder|imap[-_ ]command|header[-_ ]injection|email address|phone number|credit card|social security|json[-_ ]rpc|eval[-_ ]rce|codegen[-_ ]init|module[-_ ]loader|dynamic[-_ ]import|hardcoded
