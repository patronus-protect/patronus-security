# L1 threat OSS rule inventory (M02). Generated rules and counts; the head (sources, category
# maps, hints, default families) is maintained by hand.
#
# Rebuild: clone each source to <DIR>/<owner>_<repo> at its pinned commit, then
#   python3 scripts/l1_threat/oss_inventory.py build --src <DIR>
# Check:   python3 scripts/l1_threat/oss_inventory.py check
#
# No rule bodies: each rule carries upstream id, title, category, file, kind, mapped class and
# family (taxonomy.yaml), languages, harvest decision and a 12-hex SHA-256 of its body. Harvest is
# yes only for MIT/Apache-2.0 sources, a mapped class, a deterministic text matcher that compiles
# in Rust regex (no lookaround or backreferences), an active rule and the first copy of a body.
# Harvested rules enter a class catalog default off and stay only if they hold dev precision.
# Mapping is a first pass for the M04 review: `mapping: default` marks rules whose family is the
# class default and needs a look.

schema: ark-l1-threat-oss-rules-v1
sources:
- id: atr
  name: Agent Threat Rules
  repo: https://github.com/Agent-Threat-Rule/agent-threat-rules
  commit: a0b314dfd24ea33ae63225106771b692459ff546
  licence: MIT
  licence_file: LICENSE
  extractor: atr
  clone: Agent-Threat-Rule_agent-threat-rules
  paths:
  - rules/*/*.yaml
  category_map:
  - match: ^model-security/
    out_of_scope: model artefact and training-pipeline security, not input text
  - match: ^prompt-injection/
    classes:
    - instruction_injection
    - '*'
  - match: ^agent-manipulation/
    classes:
    - jailbreak
    - '*'
  - match: ^context-exfiltration/
    classes:
    - exfiltration
    - '*'
  - match: ^data-poisoning/
    classes:
    - memory_poisoning
    - '*'
  - match: ^excessive-autonomy/
    classes:
    - unsafe_action
    - '*'
  - match: ^model-abuse/
    classes:
    - harmful_content
    - '*'
  - match: ^privilege-escalation/
    classes:
    - unsafe_action
    - '*'
  - match: ^skill-compromise/
    classes:
    - agent_config_tampering
    - '*'
  - match: ^tool-poisoning/
    classes:
    - tool_poisoning
    - '*'
- id: pipelock
  name: pipelock
  repo: https://github.com/luckyPipewrench/pipelock
  commit: d97bee5b563357517fa4c7efaf0eaf2cd5663d26
  licence: Apache-2.0
  licence_file: LICENSE
  note: 'Core is Apache-2.0; enterprise/ is Elastic License 2.0 (NOTICE) and is not read. Rules: response-scanning defaults (injection), shipped DLP presets (out of scope), tool-description poison patterns.'
  extractor: pipelock_go
  clone: luckyPipewrench_pipelock
  paths:
  - internal/config/defaults.go
  - internal/config/dlp_patterns.go
  - internal/mcp/tools/tools.go
  category_map:
  - match: ^dlp_patterns$
    out_of_scope: secrets in text, covered by the DLP category
  - match: ^defaults$
    classes:
    - instruction_injection
    - '*'
  - match: ^tools$
    classes:
    - tool_poisoning
- id: cisco_mcp_scanner
  name: Cisco mcp-scanner YARA
  repo: https://github.com/cisco-ai-defense/mcp-scanner
  commit: 9ff8fc84b792aae315a838cf4e37b40ef46a0293
  licence: Apache-2.0
  licence_file: LICENSE
  note: One YARA rule per file; inventoried per YARA string.
  extractor: yara
  clone: cisco-ai-defense_mcp-scanner
  paths:
  - mcpscanner/data/yara_rules/*.yara
  category_map:
  - match: ^command_injection$
    handoff: shell_command
  - match: ^(sql_injection|script_injection)$
    out_of_scope: SQL and script injection payloads, application security
  - match: ^tool_poisoning$
    classes:
    - tool_poisoning
  - match: ^coercive_injection$
    classes:
    - tool_poisoning
    family: preamble_directive
  - match: ^prompt_injection$
    classes:
    - instruction_injection
    - '*'
  - match: ^data_exfiltration$
    classes:
    - exfiltration
  - match: ^credential_harvesting$
    classes:
    - unsafe_action
    family: credential_access
  - match: ^code_execution$
    classes:
    - unsafe_action
    family: unsafe_code
  - match: ^system_manipulation$
    classes:
    - unsafe_action
- id: prompt_guard
  name: seojoonkim/prompt-guard
  repo: https://github.com/seojoonkim/prompt-guard
  commit: ce4356bfe714ce34e16704a5a6668d5c829309e1
  licence: MIT
  licence_file: LICENSE
  note: patterns.py lists (per-language dicts carry their language) and the tiered patterns/*.yaml; the YAML tiers repeat many patterns.py bodies (marked duplicate).
  extractor: prompt_guard
  clone: seojoonkim_prompt-guard
  paths:
  - prompt_guard/patterns.py
  - patterns/*.yaml
  category_map:
  - match: dangerous_commands|reverse_shell|ssh_key_injection|ssh_injection
    handoff: shell_command
  - match: sql_injection|xss
    out_of_scope: SQL and script injection payloads, application security
  - match: ^secret_patterns|secret_exfiltration|credential_path|system_file_access
    classes:
    - unsafe_action
    family: credential_access
  - match: instruction_override
    classes:
    - instruction_injection
    family: discard_prior
  - match: role_manipulation
    classes:
    - jailbreak
    family: unbounded_persona
  - match: system_impersonation|system_prompt_mimicry|system_mimicry|template_chat
    classes:
    - instruction_injection
    family: role_spoof
  - match: jailbreak
    classes:
    - jailbreak
    - '*'
  - match: output_manipulation|output_prefix
    classes:
    - instruction_injection
    - jailbreak
  - match: exfiltration
    classes:
    - exfiltration
    - '*'
  - match: phishing
    classes:
    - unsafe_action
    family: credential_phishing
  - match: social_engineering|social_eng|urgency|emotional|cognitive_manipulation
    classes:
    - jailbreak
    family: reward_threat_game
  - match: memory|cognitive_rootkit|semantic_worm|recommendation_poisoning
    classes:
    - memory_poisoning
    - '*'
  - match: hooks|gitignore|allowlist|auto_approve|approval_expansion|supply_chain|subagent
    classes:
    - agent_config_tampering
    - unsafe_action
    - resource_exhaustion
  - match: recursive_delegation|cascade|repetition_attack
    classes:
    - resource_exhaustion
    - '*'
  - match: prompt_extraction|authority_recon
    classes:
    - prompt_extraction
    - '*'
  - match: mcp_abuse|agent_tool_attacks
    classes:
    - tool_poisoning
    - '*'
  - match: malware
    classes:
    - harmful_content
    - '*'
  - match: benign_finetuning|causal_mechanistic|defense_bypass
    classes:
    - jailbreak
    - '*'
  - match: infrastructure|agent_payment
    classes:
    - unsafe_action
    - '*'
  - match: hidden_text|unicode_tag|unicode_steg|token_smuggling|evasion_stealth|obfuscated_payload|language_switch|multimodal
    classes:
    - instruction_injection
    - '*'
  - match: scenario|multi_turn|guardrail_bypass|safety_bypass|bypass_coaching|repetition_bypass|few_shot|sovereignty|action_gate
    classes:
    - jailbreak
    - '*'
  - match: .
    classes:
    - instruction_injection
    - '*'
- id: vigil
  name: Vigil
  repo: https://github.com/deadbits/vigil-llm
  commit: f2b4c134d060bae81d29fad07003f3c657e63fc8
  licence: Apache-2.0
  licence_file: LICENSE
  extractor: yara
  clone: deadbits_vigil-llm
  paths:
  - data/yara/*.yar
  category_map:
  - match: ^(ContainsAPIToken|ContainsSSHKey|ContainsGenericSecretPhrase|ContainsIPv4)$
    out_of_scope: secrets and addresses in text, covered by DLP and PII
  - match: ^InstructionBypass$
    classes:
    - instruction_injection
    family: discard_prior
  - match: ^MarkdownExfiltration$
    classes:
    - exfiltration
    family: markdown_beacon
  - match: ^(ContainsGuidance|ContainsReAct|ContainsReAct_txt|SystemInstructions_vigil)$
    classes:
    - instruction_injection
    family: role_spoof
- id: nemo_yara
  name: NeMo Guardrails injection YARA
  repo: https://github.com/NVIDIA/NeMo-Guardrails
  commit: 093ae1fc7b3eb4701864e9604d6849977947713d
  licence: Apache-2.0
  licence_file: LICENSE.md
  note: Only the injection_detection YARA rules (code, SQL, template, XSS); the dialogue rails are LLM-based and not inventoried.
  extractor: yara
  clone: NVIDIA_NeMo-Guardrails
  paths:
  - nemoguardrails/library/injection_detection/yara_rules/*.yara
  category_map:
  - match: ^(sql_injection|jinja_injection|markdown_xss)$
    out_of_scope: SQL, template and script injection payloads, application security
  - match: ^import_(shells|networking)$
    classes:
    - unsafe_action
    family: unsafe_code
- id: llamafirewall
  name: LlamaFirewall regex scanner
  repo: https://github.com/meta-llama/PurpleLlama
  commit: 7e163b68c0af2ced1fae19ddbd471a8c36341519
  licence: MIT
  licence_file: LlamaFirewall/LICENSE
  note: LlamaFirewall carries its own MIT licence; the PurpleLlama root licence (Llama Community) does not apply to it. Only the regex scanner is deterministic; PromptGuard and AlignmentCheck are models and CodeShield is Semgrep-based.
  extractor: python_re
  clone: meta-llama_PurpleLlama
  paths:
  - LlamaFirewall/src/llamafirewall/scanners/regex_scanner.py
  category_map:
  - match: .
    classes:
    - instruction_injection
    family: discard_prior
- id: skillspector
  name: SkillSpector static YARA
  repo: https://github.com/NVIDIA/SkillSpector
  commit: 5f0f73dd204ad2454cca4ad63b06e60ad1ec3648
  licence: Apache-2.0
  licence_file: LICENSE
  note: Static YARA layer only; malware.yar.b64 is an encoded third-party signature pack and is not read.
  extractor: yara
  clone: NVIDIA_SkillSpector
  paths:
  - src/skillspector/yara_rules/*.yar
  category_map:
  - match: ^(crypto_|php_|python_webshell|jsp_|aspx_|offensive_tool|network_recon|privilege_escalation_tools|exploit_framework|phishing_kit)
    out_of_scope: malware and hack-tool signatures in skill files, not prompt text
  - match: credential_exfiltration
    classes:
    - exfiltration
    family: send_directive
  - match: remote_bootstrap
    classes:
    - agent_config_tampering
    family: fetch_run
  - match: prompt_injection_hidden
    classes:
    - agent_config_tampering
    family: hidden_directive
  - match: mcp_tool_poisoning
    classes:
    - tool_poisoning
  - match: destructive_autonomous
    classes:
    - unsafe_action
- id: sentinel_ai
  name: sentinel-ai
  repo: https://github.com/MaxwellCalkin/sentinel-ai
  commit: 876aff3cdbca15955b0e649cc19117730b10a203
  licence: Apache-2.0
  licence_file: LICENSE
  note: Scanner modules under sentinel/scanners; one entry per re.compile.
  extractor: python_re
  clone: MaxwellCalkin_sentinel-ai
  paths:
  - sentinel/scanners/*.py
  category_map:
  - match: ^(pii|secrets_scanner|dependency_scanner|hallucination|structured_output)$
    out_of_scope: PII, secrets, dependency, hallucination and output-format checks
  - match: ^prompt_injection$
    classes:
    - instruction_injection
    - '*'
  - match: ^harmful_content$
    classes:
    - harmful_content
  - match: ^toxicity$
    classes:
    - toxic_language
  - match: ^tool_use$
    classes:
    - unsafe_action
    - exfiltration
  - match: ^obfuscation$
    classes:
    - instruction_injection
    family: decoded_instruction
  - match: ^code_scanner$
    classes:
    - unsafe_action
    family: unsafe_code
- id: citadel
  name: citadel
  repo: https://github.com/TryMightyAI/citadel
  commit: 66f3ca490a6a7768ec5300aa7bad5bff15d69c68
  licence: Apache-2.0
  licence_file: LICENSE
  note: The research census named citadel-ai/citadel, which no longer resolves; the scanner lives at TryMightyAI/citadel. Pattern registry plus the scorer and multi-turn pattern tables.
  extractor: citadel_go
  clone: TryMightyAI_citadel
  paths:
  - pkg/patterns/categories.go
  - pkg/ml/patterns.go
  - pkg/ml/multiturn_patterns.go
  - pkg/ml/scorer.go
  category_map:
  - match: ^re[A-Z]
    out_of_scope: secrets, keys and PII formats in text, covered by DLP and PII
  - match: ^xxeAttackPatterns$
    out_of_scope: XML external entity payloads, application security
  - match: ^danJailbreakPatterns$
    classes:
    - jailbreak
    - '*'
  - match: ^PolicyInjectionPatterns$
    classes:
    - jailbreak
    family: policy_spoof
  - match: ^FlipAttackPatterns$
    classes:
    - jailbreak
    family: decoded_jailbreak
  - match: ^iclPatternRe$
    classes:
    - jailbreak
    family: many_shot
  - match: ^dangerousPatternRe$
    classes:
    - harmful_content
    family: hazard_mention
  - match: ^systemPromptExtractionPatterns$
    classes:
    - prompt_extraction
    - '*'
  - match: ^buriedAttackPatterns$
    classes:
    - instruction_injection
    - '*'
  - match: ^toolPoisonPatterns$
    classes:
    - tool_poisoning
  - match: ^markdownExfilPatterns$
    classes:
    - exfiltration
    - instruction_injection
  - match: ^(Credential|PathTraversal|Deserialization)$
    out_of_scope: secrets in text and application-security payloads
  - match: ^(NetworkRecon|PrivilegeEsc)$
    handoff: shell_command
  - match: ^SSRF$
    classes:
    - unsafe_action
    family: metadata_ssrf
  - match: ^IndirectInj$
    classes:
    - instruction_injection
    - '*'
  - match: ^Exfiltration$
    classes:
    - exfiltration
    - '*'
  - match: ^InjectionAttack$
    classes:
    - instruction_injection
    - '*'
  - match: ^(Jailbreak|persona_hijack|eval_abuse|escalation|adversarial_suffix)$
    classes:
    - jailbreak
    - '*'
  - match: ^fiction_frame$
    classes:
    - jailbreak
    family: fiction_frame
  - match: ^(PromptExtraction|system_probing)$
    classes:
    - prompt_extraction
    - '*'
  - match: ^exploit_request$
    classes:
    - harmful_content
  - match: ^filesystem$
    classes:
    - unsafe_action
default_families:
  instruction_injection: discard_prior
  jailbreak: unbounded_persona
  prompt_extraction: reveal_hidden
  tool_poisoning: preamble_directive
  agent_config_tampering: hidden_directive
  memory_poisoning: persistent_directive
  exfiltration: send_directive
  unsafe_action: destructive_request
  resource_exhaustion: unbounded_repeat
  harmful_content: howto_hazard
  toxic_language: insult_addressee
hints:
- match: shell[-_ ]?(injection|escape|tool)|command[-_ ]injection|cmd[-_ ]injection|reverse[-_ ]shell|argv[-_ ]injection|argument[-_ ]injection|option[-_ ]injection|path[-_ ]command[-_ ]substitution|covert[-_ ]shell|network[-_ ]shell|output[-_ ]to[-_ ]shell|dangerous[-_ ]shell|shell[-_ ]allowlist|stdio[-_ ]command|ssh[-_ ]mcp|command substitution|backtick
