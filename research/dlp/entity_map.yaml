# Gruppen = entity_group der Treffer. planned: Gruppe hat noch keine ARK-Regel (K09, M-Welle).
taxonomy:
  API_KEY: {family: provider_secret}
  CLOUD_KEY: {family: provider_secret}
  PAYMENT_KEY: {family: provider_secret}
  SECRET_TOKEN: {family: provider_secret}
  CREDENTIAL: {family: generic_credential}
  PASSWORD_HASH: {family: generic_credential}
  PRIVATE_KEY: {family: key_material}
  CRYPTO_KEY: {family: key_material}
  dlp.de.vat_id: {family: business_identifier}
  dlp.de.commercial_register_number: {family: business_identifier}
  dlp.de.facility_number_bsnr: {family: business_identifier}
  dlp.record.case_id: {family: business_identifier}
  dlp.record.contract_id: {family: business_identifier}
  dlp.record.claim_id: {family: business_identifier}
  dlp.record.order_id: {family: business_identifier}
  dlp.record.invoice_id: {family: business_identifier}
  dlp.project_id: {family: business_identifier}
  dlp.organization_id: {family: business_identifier}
  dlp.internal.business_metric: {family: content_class}
  dlp.content.source_code: {family: content_class}
  dlp.content.sql: {family: content_class}
  dlp.content.database_dump: {family: content_class}
  dlp.content.system_log: {family: content_class}
  dlp.document.legal_privileged: {family: document_class, planned: true}
  dlp.document.hr: {family: document_class, planned: true}
  dlp.document.rnd_ip: {family: document_class, planned: true}

# Taxonomie v2 (K09): Untertypen der Secret-Gruppen. Neue Arten (Connection-String, Webhook-URL,
# Auth-URL, OTP-Secret, Seed-Phrase) sind keine eigenen Gruppen, sondern Untertypen bestehender
# Gruppen; Treffer melden sie als `subtype` in `matched_rules`, Spans behalten das Gruppenlabel.
# groups = Gruppen, in denen der Untertyp vorkommen darf (= SecretSubtype::groups in dlp.rs);
# planned = noch keine Regel mit diesem Untertyp. Eine Entität darf `subtype` nennen; dann tragen
# alle ihre ARK-Regeln diesen Untertyp.
subtypes:
  api_key: {groups: [API_KEY, CLOUD_KEY, PAYMENT_KEY]}
  access_token: {groups: [SECRET_TOKEN, CLOUD_KEY]}
  secret_key: {groups: [API_KEY, CLOUD_KEY, PAYMENT_KEY]}
  private_key: {groups: [PRIVATE_KEY, CRYPTO_KEY]}
  seed_phrase: {groups: [CRYPTO_KEY], planned: true}  # C01
  password: {groups: [CREDENTIAL]}
  password_hash: {groups: [PASSWORD_HASH]}
  generic_secret: {groups: [CREDENTIAL]}
  session_token: {groups: [SECRET_TOKEN, CREDENTIAL]}
  signature: {groups: [CREDENTIAL]}
  connection_string: {groups: [CREDENTIAL]}  # G01
  auth_url: {groups: [CREDENTIAL]}  # dlp_credential_in_url; G09
  webhook_url: {groups: [SECRET_TOKEN], planned: true}  # P08
  otp_secret: {groups: [CREDENTIAL], planned: true}  # G08

