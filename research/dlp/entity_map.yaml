# DLP-Taxonomie und Mapping ARK ↔ gitleaks ↔ TruffleHog ↔ detect-secrets ↔ Google Cloud DLP (E01).
# Geprüft von rust/tests/dlp_entity_map.rs.
#
# Eine Entität ist ein Secret-Typ bzw. eine Content-/Dokumentklasse. Sie bündelt alle Regeln, die
# denselben Wert treffen sollen; das Scoreboard (E10) bewertet Recall und Attribution je Entität.
#
# scope:
#   shared         ARK und mindestens ein Baseline-Tool decken die Entität ab (Vergleich M1/M2).
#   ark_only       nur ARK; Hebel gegenüber den Baselines (M3), kein Paarvergleich möglich.
#   baseline_only  nur Baselines; Lücke in ARK, `backlog` nennt die Aufgabe, die sie schließt.
#   out_of_scope   bewusst nicht im L1-DLP-Programm; `reason` begründet das.
#
# Felder: ark = dlp_*-Regel-IDs (jede genau einmal, `group` = deren entity_group);
# gitleaks = Regel-IDs der Default-Config (jede genau einmal); trufflehog = DetectorType-Namen;
# detect_secrets = Plugin-Klassen; google_dlp = Infotype-Namen. Mehrfachnennungen bei TruffleHog,
# detect-secrets und Google DLP sind erlaubt, weil ein Detektor dort mehrere Entitäten abdeckt.
#
# TruffleHog: Das gepinnte Binary ist UPX-gepackt, sein Detektor-Inventar ist offline nicht
# auslesbar. Die Namen folgen dem upstream-Enum `DetectorType` und decken nur ARK-nahe Typen ab.
# `scripts/l1_dlp/run_baselines.py check-entity-map` prüft sie gegen das Binary
# (`--include-detectors`) und die detect-secrets-Plugins gegen das gepinnte Paket (E07).
