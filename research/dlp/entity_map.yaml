  # ── out_of_scope ────────────────────────────────────────────────────────
  - id: action.sensitive_material
    scope: out_of_scope
    ark: [dlp_sensitive_material]
    reason: Aktions-DLP (Anfrage nach sensiblem Material, Threat-Matches), kein Secret-Wert; siehe README „Abgrenzung“.
  - id: action.secret_transfer
    scope: out_of_scope
    ark: [dlp_secret_transfer]
    reason: Aktions-DLP (Übertragung von Secrets), gehört nicht zu diesem Programm.
  - id: action.destructive_operation
    scope: out_of_scope
    ark: [dlp_destructive_operation]
    reason: Aktions-DLP (destruktive Operationen), gehört nicht zu diesem Programm.
  - id: action.mcp_runtime_risk
    scope: out_of_scope
    ark: [dlp_mcp_runtime_risk]
    reason: MCP-Laufzeitrisiko (Agenten-Policy), kein Secret- oder Dokumentwert.
  - id: action.mcp_policy
    scope: out_of_scope
    ark: [dlp_mcp_policy]
    reason: MCP-Policy-Verstoß (Agenten-Policy), kein Secret- oder Dokumentwert.
  - id: public.client_identifier
    scope: out_of_scope
    gitleaks: [adobe-client-id, asana-client-id, bitbucket-client-id, discord-client-id, linkedin-client-id,
      looker-client-id, messagebird-client-id, plaid-client-id, sendbird-access-id, sumologic-access-id,
      new-relic-user-api-id]
    reason: Öffentliche Client-/Account-IDs sind kein Secret; ARK nutzt sie höchstens als Paar-Kontext für das zugehörige Secret.
  - id: public.publishable_key
    scope: out_of_scope
    gitleaks: [flutterwave-public-key, lob-pub-api-key, mailgun-pub-key, new-relic-browser-api-token]
    reason: Publishable/Browser-Keys sind zur Veröffentlichung bestimmt und zählen als Hard Negative (wie Stripe pk_, F10).
  - id: public.test_key
    scope: out_of_scope
    gitleaks: [easypost-test-api-token]
    reason: Test-/Sandbox-Schlüssel sind Hard Negatives bzw. severity test (K06), keine eigene Entität.
  - id: public.ssl_certificate
    scope: out_of_scope
    google_dlp: [SSL_CERTIFICATE]
    reason: Zertifikate sind öffentlich; nur der private Schlüssel ist ein Secret (key.pem_private_key).
  - id: public.ip_address
    scope: out_of_scope
    detect_secrets: [IPPublicDetector]
    reason: IP-Adressen gehören zu PII bzw. Infrastruktur-Topologie (M14), nicht zu Secrets.
  - id: public.legal_finance_document
    scope: out_of_scope
    google_dlp: [DOCUMENT_TYPE/LEGAL/LAW, DOCUMENT_TYPE/LEGAL/BLANK_FORM, DOCUMENT_TYPE/FINANCE/REGULATORY,
      DOCUMENT_TYPE/FINANCE/SEC_FILING]
    reason: Gesetze, Leerformulare und Pflichtveröffentlichungen sind öffentlich und damit keine DLP-Klasse.
