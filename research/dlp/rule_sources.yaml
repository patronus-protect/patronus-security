# Formatquellen der DLP-Regeln (K02). Geprüft von rust/tests/dlp_rule_metadata.rs.
#
# Aufgeführt ist jede Regel mit Provider oder externer Formatquelle; `source_ref` ist identisch mit
# `RuleMeta::source_ref` der Regel und erscheint im Rule-Catalog und in `matched_rules`.
#
# source_ref:
#   gitleaks:<rule-id>  Regel der gepinnten gitleaks-Default-Config (MIT, Inventar in entity_map.yaml)
#   https://…           Hersteller-Doku oder Spezifikation
#   ark                 keine belegbare Formatquelle; `pending` nennt die Aufgabe, die Format und
#                       Quelle festlegt. Neue Provider-Regeln brauchen eine Quelle (backlog `sources`).
#
# Kontextregeln ohne Provider (Zuweisungen, Header, Identifier, Content) haben `source_ref: ark`
# und stehen nicht in dieser Datei.
schema: ark-dlp-rule-sources-v1

rules:
  # ── LLM ──────────────────────────────────────────────────────────────────
  dlp_anthropic_key:
    provider: anthropic
    source_ref: gitleaks:anthropic-api-key
    format: "sk-ant- prefix, base64url body"
  dlp_openai_key:
    provider: openai
    source_ref: gitleaks:openai-api-key
    format: "sk-proj- prefix, base64url body"
  dlp_openai_legacy:
    provider: openai
    source_ref: gitleaks:openai-api-key
    format: "sk- prefix, 48 base62 characters"
  dlp_openai_svc:
    provider: openai
    source_ref: gitleaks:openai-api-key
    format: "sk-svcacct- prefix, base64url body"
  dlp_huggingface:
    provider: huggingface
    source_ref: gitleaks:huggingface-access-token
    format: "hf_ prefix, base62 body"
  dlp_groq_key:
    provider: groq
    source_ref: ark
    format: "gsk_ prefix, at least 48 base62 characters"
    pending: T02
  dlp_xai_key:
    provider: xai
    source_ref: ark
    format: "xai- prefix, at least 80 base64url characters"
    pending: F06
  dlp_replicate:
    provider: replicate
    source_ref: ark
    format: "r8_ prefix, base62 body"
    pending: T02

  # ── Cloud ────────────────────────────────────────────────────────────────
  dlp_aws_access_key:
    provider: aws
    source_ref: gitleaks:aws-access-token
    format: "credential prefix of the IAM unique-ID table (AKIA long-term, ASIA temporary, ABIA STS service bearer token, ACCA context-specific credential; legacy A3T + one upper-case alphanumeric) and exactly 16 Base32 characters (A-Z, 2-7); 20 characters in total. Group, user, role, policy and other unique IDs (AGPA, AIDA, AROA, AIPA, ANPA, ANVA, APKA, ASCA) are no credentials (https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html#identifiers-unique-ids; gitleaks aws-access-token; F05)"
  dlp_aws_secret_key:
    provider: aws
    source_ref: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
    format: "40 base64 characters (A-Z, a-z, 0-9, /, +; no padding) with upper and lower case letters, as a whole run, in structural AWS context (F05): after an AWS key name or label (aws_secret_access_key, AwsSecretAccessKey, aws.secretKey, AWS-Secret-Access-Key, SecretAccessKey, secret_access_key; in prose up to two lines on), right after an access key ID (SDK call, IAM credentials CSV, CLI), or after a generic secret key name (secret_key, secret-key, secretKey) with AWS context: an access key ID or access_key/accessKeyId key, Terraform provider \"aws\"/backend \"s3\", amazonaws.com or aws as a name part within five lines above or two below"
  dlp_google_api_key:
    provider: google
    source_ref: gitleaks:gcp-api-key
    format: "AIza prefix, 35 base64url characters"
  dlp_google_oauth_token:
    provider: google
    source_ref: ark
    format: "ya29. prefix, base64url body"
    pending: T02
  dlp_gcp_client_secret:
    provider: google
    source_ref: ark
    format: "GOCSPX- prefix, base64url body"
    pending: T02

  # ── Source control and registries ────────────────────────────────────────
  dlp_github_token:
    provider: github
    source_ref: gitleaks:github-pat
    format: "ghp_/gho_/ghu_/ghs_/ghr_ prefix, exactly 36 base62 characters: 30 random and their CRC32 as 6 base62 digits (GitHub token format, 2021; F03)"
  dlp_github_pat:
    provider: github
    source_ref: gitleaks:github-fine-grained-pat
    format: "github_pat_ prefix, exactly 82 base62 and underscore characters (F03)"
  dlp_gitlab_pat:
    provider: gitlab
    source_ref: gitleaks:gitlab-pat
    format: "glpat- prefix and exactly 20 base64url characters, or the routable form: 27-300 base64url characters, a dot, a two-character version and a seven-character base36 check value, or the current form with .01., two base36 length digits and seven base36 CRC32 digits (gitleaks gitlab-pat, gitlab-pat-routable; GitLab HTTP router docs; F04)"
  dlp_gitlab_token:
    provider: gitlab
    source_ref: https://docs.gitlab.com/security/tokens/#token-prefixes
    format: "Documented GitLab token prefixes with the lengths of the gitleaks rules (F04): gldt- deploy, glrt- runner, glrtr- runner created through a registration token, glft- feed, glsoat- SCIM and glffct- feature flag client token with 20 base64url characters; glrt-t<digit>_ routable runner token (27-300 characters, dot, 2 + 7 base36); current routable glrt-, glrtr- runner and glwt- workspace token (27-300 base64url characters, .01., 2 base36 length digits, 7 base36 CRC32 digits; https://docs.gitlab.com/development/cells/http_router/); glcbt- CI/CD job token (1-5 alphanumerics, _, 20 characters); glimt- incoming mail token (25); glagent- Kubernetes agent token (50); glptt- pipeline trigger token (40 lower-case hex); GR1348941 runner registration token (20). gitleaks gitlab-deploy-token, gitlab-runner-authentication-token(-routable), gitlab-feed-token, gitlab-scim-token, gitlab-feature-flag-client-token, gitlab-cicd-job-token, gitlab-incoming-mail-token, gitlab-kubernetes-agent-token, gitlab-ptt, gitlab-rrt"
  dlp_gitlab_oauth_secret:
    provider: gitlab
    source_ref: gitleaks:gitlab-oauth-app-secret
    format: "gloas- prefix, exactly 64 base64url characters (OAuth application secret; F04)"
  dlp_npm_token:
    provider: npm
    source_ref: gitleaks:npm-access-token
    format: "npm_ prefix, exactly 36 base62 characters: 30 random and their CRC32 as 6 base62 digits (npm token format 2021, same layout as GitHub tokens; F04)"

  # ── Payment ──────────────────────────────────────────────────────────────
  dlp_stripe_key:
    provider: stripe
    source_ref: gitleaks:stripe-access-token
    format: "sk_/rk_ prefix with live or test mode, base62 body; test mode is severity test"
  dlp_stripe_webhook:
    provider: stripe
    source_ref: https://docs.stripe.com/webhooks
    format: "whsec_ prefix, base64url body"

  # ── Communication ────────────────────────────────────────────────────────
  dlp_slack_token:
    provider: slack
    source_ref: https://api.slack.com/authentication/token-types
    format: "xoxb-/xoxp-/xoxr-/xoxa-/xoxs- prefix, digit and alphanumeric segments"
  dlp_discord_token:
    provider: discord
    source_ref: ark
    format: "three dot-separated base64url segments, first segment starts with M or N"
    pending: F09

  # ── Key material ─────────────────────────────────────────────────────────
  dlp_eth_private_key:
    provider: ethereum
    source_ref: https://ethereum.org/en/developers/docs/accounts/
    format: "0x and 64 hex digits (32-byte secp256k1 private key, 1 <= k < n); reported only in a key context (F01), since tx/block hashes share the shape"
  dlp_btc_wif:
    provider: bitcoin
    source_ref: https://en.bitcoin.it/wiki/Wallet_import_format
    format: "Base58Check WIF: version byte 0x80 (mainnet) or 0xef (testnet/signet/regtest, severity test), 32-byte secp256k1 scalar, 0x01 flag for compressed keys; 51 characters starting with 5/9 or 52 starting with K/L/c (F02)"
  dlp_private_key_block:
    source_ref: gitleaks:private-key
    format: "PEM armor BEGIN/END … PRIVATE KEY with body"
  dlp_private_key_header:
    source_ref: gitleaks:private-key
    format: "PEM armor BEGIN … PRIVATE KEY"
  dlp_jwt_token:
    source_ref: gitleaks:jwt
    format: "three base64url segments, header and payload start with ey"
  dlp_bearer_token:
    source_ref: https://www.rfc-editor.org/rfc/rfc6750#section-2.1
    format: "Bearer followed by a b64token (letters, digits, -._~+/ and trailing =) anywhere: in an Authorization header, under authorization/proxy_authorization keys, in logs and standalone in prose (F-HTTP); the token has at least 16 characters, two character classes, 3 bits of entropy per character, no sequential or repeated runs and is no identifier; a value that parses as a JWT is left to dlp_jwt_token"
  dlp_basic_auth:
    source_ref: https://www.rfc-editor.org/rfc/rfc7617#section-2
    format: "Basic followed by canonical padded base64 (RFC 4648 section 4) anywhere, as a whole token; it decodes to printable UTF-8 user-id:password with a non-empty user-id (no colon) and password; the password is no stand-in, credential name or metasyntactic word, also read without leetspeak (user:p@ss), and differs from the user-id (F-HTTP)"
  dlp_connection_string_password:
    source_ref: https://learn.microsoft.com/en-us/dotnet/framework/data/adonet/connection-string-syntax
    format: "password/pwd key of a connection string (G01): ;-separated key/value strings with a server, data source, host, DSN, driver or provider key or after a jdbc: URL (ADO.NET, ODBC with {…} values, OLE DB, JDBC SQL Server/DB2 properties, https://learn.microsoft.com/en-us/sql/connect/jdbc/building-the-connection-url); libpq keyword/value strings with a host and a dbname, user or port (https://www.postgresql.org/docs/current/libpq-connect.html#LIBPQ-CONNSTRING); the password query parameter of a database or broker URL (libpq URI, MySQL Connector/J, MongoDB, Redis, AMQP …); Oracle thin/OCI jdbc:oracle:thin:user/password@host (https://docs.oracle.com/en/database/oracle/oracle-database/23/jjdbc/data-sources-and-URLs.html); the password is no stand-in or credential name"
  dlp_ldap_bind_password:
    source_ref: https://www.openldap.org/software/man.cgi?query=ldapsearch
    format: "LDAP simple-bind password (G01): -w <password> of the OpenLDAP client tools (ldapsearch, ldapmodify, ldapadd, ldapdelete, ldappasswd, ldapwhoami, ldapcompare, ldapmodrdn, ldapexop); bindpw/bind_pw (nss-pam-ldapd nslcd.conf, pam_ldap), bindCredential (Keycloak LDAP provider), ldap_default_authtok (SSSD), AuthLDAPBindPassword (Apache mod_authnz_ldap); a directive without = or : only at the start of its line; the password is no stand-in or credential name"
  dlp_url_userinfo_token:
    source_ref: https://github.blog/2012-09-21-easier-builds-and-deployments-using-git-over-https-and-oauth/
    format: "token as the username of a URL with the constant password x-oauth-basic (https://<token>:x-oauth-basic@github.com/…); the token needs two character classes, 3 bits of entropy per character and no sequential or repeated runs (F-GEN1)"
