# Herstellerdokumentierte Beispielwerte und öffentlich bekannte Testschlüssel (K06).
# Geprüft von rust/tests/dlp_documented_values.rs und dem Unit-Test in
# rust/src/detectors/dlp/rules/documented.rs (Tabelle dort == diese Datei).
#
# Werte stehen hier nie im Klartext, nur als SHA-256 des normalisierten Werts:
#   - umgebende Anführungszeichen entfernt;
#   - Hex-Schlüssel (`0x…`): ohne `0x`, klein geschrieben;
#   - PEM-Blöcke: nur der Base64-Body (Armor, Zeilenumbrüche und JSON-Escapes `\n` entfernt).
# Die Tests erzeugen die Werte zur Testzeit aus der dokumentierten Quelle (Schlüsselbytes,
# Claims + HMAC-Schlüssel) und vergleichen die Fingerprints.
#
# kind:
#   example  dokumentierter Beispielwert ohne Funktion: der Treffer entfällt (jede Secret-Regel)
#   test     öffentlich bekannter Testschlüssel: der Treffer bleibt, `severity: test`
schema: ark-dlp-documented-values-v1

values:
  - id: aws_access_key_id_docs
    rule_id: dlp_aws_access_key
    kind: example
    sha256: 1a5d44a2dca19669d72edf4c4f1c27c4c1ca4b4408fbb17f6ce4ad452d78ddb3
    source: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
    note: "AWS example access key ID (AKIA…EXAMPLE)"
