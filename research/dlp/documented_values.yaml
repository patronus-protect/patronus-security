# JWTs der Doku tragen feste Claims; erkannt wird jede Signatur und jeder Header (der
# jwt.io-Debugger signiert dieselben Claims mit HS256, RS256, ES256 …). Ein JWT gilt als
# Beispiel, wenn sein Payload alle Claims eines Eintrags mit genau diesen Werten enthält.
jwt_claims:
  - id: jwt_io_debugger
    claims: {sub: "1234567890", name: "John Doe"}
    source: https://jwt.io/
    note: "default token of the jwt.io debugger and the JWT introduction"
  - id: rfc7519_example
    claims: {iss: "joe", exp: 1300819380}
    source: https://www.rfc-editor.org/rfc/rfc7519#section-3.1
    note: "RFC 7519 section 3.1 / RFC 7515 appendix A example claims set"
