  - {id: C04, title: "JWK/JWKS mit privaten Parametern (d, p, q, dp, dq, qi) und OKP-Keys", type: new-entity, deps: [K05]}
  - {id: C05, title: "PKCS#12/JKS/Keychain/KeePass als base64-Blob (Magic Bytes nach Dekodierung) und Zertifikats-Passwörter (keystore.password)", type: new-entity, deps: [D01]}
  - {id: C06, title: "WireGuard PrivateKey, OpenVPN <key>/<tls-auth>, IPsec PSK (Kontext)", type: new-entity, deps: [K05]}
  - {id: C07, title: "SSH: unverschlüsselt vs. verschlüsselt (bcrypt-KDF) unterscheiden → severity; authorized_keys/known_hosts als Hard Negatives", type: precision-fix, deps: [F08]}
  - {id: C08, title: "Symmetrische Schlüssel in Code (AES/HMAC-Konstanten als Byte-Arrays/Hex mit Kontext key/secret), Django SECRET_KEY, Rails secret_key_base, Laravel APP_KEY", type: new-entity, deps: [G02]}

  # ── D: Decoder und Obfuskation ────────────────────────────────────────
  - {id: D01, title: "Decoder-Pipeline base64/base64url mit Offset-Rückabbildung, Rekursionstiefe 2, Größenlimit", type: engine, deps: [K02], accept: "Decodierte Treffer zeigen auf den kodierten Bereich; Latenzbudget eingehalten"}
  - {id: D02, title: "Hex-, URL-Percent-, JSON-/C-Escape- und Unicode-Escape-Dekodierung", type: engine, deps: [D01]}
  - {id: D03, title: "UTF-16LE/BE-Text (PowerShell -EncodedCommand, Windows-Exporte)", type: engine, deps: [D02]}
  - {id: D04, title: "Zusammengesetzte Strings (\"sk-\" + \"…\", Template-Literale, Zeilenumbruch mit \\ ) und Zero-Width/Vollbreite über PII-K06", type: engine, deps: [D02], ext_deps: [pii:K06]}
  - {id: D05, title: "Secrets in Diffs/Patches und Git-Log-Ausgaben (+/- Zeilen, nur hinzugefügte zählen als aktuell)", type: engine, deps: [K05]}

  # ── M: Sensible Materialien und Dokumentklassen ───────────────────────
  - {id: M01, title: "Content-Klassen-Engine: Dokumentlabel aus Anker-Kombination (stark/mittel/strukturell) + Evidenzspan, Mindestdichte, Gegen-Kontext", type: engine, deps: [E12, K04]}
  - {id: M02, title: "Klassifizierungsmarkierungen DE: VS-NUR FÜR DEN DIENSTGEBRAUCH, VS-VERTRAULICH, GEHEIM, STRENG GEHEIM; Unternehmensstufen intern/vertraulich/streng vertraulich", type: new-entity, deps: [M01]}
  - {id: M03, title: "Klassifizierungsmarkierungen EN/international: Confidential, Restricted, Internal Only, TLP 2.0 (CLEAR/GREEN/AMBER/AMBER+STRICT/RED), NATO/EU-Kennungen", type: new-entity, deps: [M02]}
  - {id: M04, title: "Geheimhaltung/NDA: Geheimhaltungsvereinbarung, GeschGehG-Hinweis, Trade-Secret-Marker, Sperrfrist/Embargo", type: new-entity, deps: [M01]}
  - {id: M05, title: "Rechtlich privilegiert: Anwalts-/Mandantenkorrespondenz, attorney-client privileged, Schriftsatzentwürfe, Vergleichsverhandlungen", type: new-entity, deps: [M01]}
  - {id: M06, title: "HR-Dokumente: Arbeitszeugnis, Abmahnung, Kündigung, Aufhebungsvertrag, Gehaltsabrechnung/payslip, Leistungsbeurteilung", type: new-entity, deps: [M01]}
  - {id: M07, title: "Finanzen unveröffentlicht: Quartals-/Jahreszahlen vor Veröffentlichung, Ad-hoc/Insiderinformation (MAR Art. 7), Insiderliste, Guidance", type: new-entity, deps: [M01, F16]}
  - {id: M08, title: "M&A/Transaktionen: Term Sheet, LOI, Due Diligence, Datenraum, Projekt-Codenamen, SPA, Bewertung/Cap Table", type: new-entity, deps: [M01]}
  - {id: M09, title: "Gremien: Vorstands-/Aufsichtsratsprotokolle, Board Minutes, Beschlussvorlagen", type: new-entity, deps: [M01]}
  - {id: M10, title: "Konditionen/Preise: Einkaufspreise, Rabattstaffeln, Preislisten intern, Angebotskalkulation, Lieferantenkonditionen", type: new-entity, deps: [M01, F16]}
  - {id: M11, title: "Bulk-Personendaten: CSV/JSON/Tabellen mit ≥ N PII-Spalten (Header-Erkennung) und ≥ M Zeilen — Kundenlisten-Export", type: new-entity, deps: [M01], ext_deps: [pii:K04]}
  - {id: M12, title: "Gesundheitsdokumente als Klasse: Arztbrief, Befund, AU-Bescheinigung, Entlassbrief (Dokumentlabel; Einzelwerte bleiben PII)", type: new-entity, deps: [M01]}
  - {id: M13, title: "Sicherheitsdokumente: Pentest-/Audit-Berichte, interne Schwachstellen mit Systembezug, Incident-Reports, Firewall-Regelwerke", type: new-entity, deps: [M01]}
  - {id: M14, title: "Infrastruktur-Topologie: interne Hostnamen/Domains (.corp/.intern/.local), RFC1918 + Port-Inventare, AD-DNs (CN=…,DC=…), Netzpläne", type: new-entity, deps: [M01]}
  - {id: M15, title: "Infrastruktur-Dateien: terraform.tfstate, Ansible-Inventory/Vault-Header, Cisco running-config, iptables/nftables-Dumps, docker-compose mit environment", type: new-entity, deps: [M01, G02]}
  - {id: M16, title: "Exportkontrolle: Ausfuhrliste (AL-Nummern), ECCN, ITAR/EAR, Dual-Use-Verordnung-Kennungen mit Kontext", type: new-entity, deps: [M01]}
  - {id: M17, title: "F&E/IP: Erfindungsmeldung, Invention Disclosure, Patententwurf vor Anmeldung, Rezepturen/Spezifikationen mit Vertraulichkeitsmarker", type: new-entity, deps: [M01]}
  - {id: M18, title: "Quellcode-Erkennung erweitern: Java, C#, C/C++, Go, PHP, Ruby, Kotlin, Swift, Shell, PowerShell, HCL, CI-YAML; Jupyter-Notebooks", type: recall-fix, deps: [E12]}
  - {id: M19, title: "Logs erweitern: JSON-Logs, syslog, Access-Logs mit Auth-Parametern, Kubernetes-Events, Java/Go/.NET/Node-Stacktraces", type: recall-fix, deps: [E12]}
  - {id: M20, title: "Datenbank-Dumps erweitern: pg_dump COPY-Blöcke, mysqldump-Header, MongoDB-Exporte (JSON Lines mit _id/$oid), Redis/RDB-Hinweise", type: recall-fix, deps: [E12]}
  - {id: M21, title: "Business-Metriken erweitern: Pipeline, CAC/LTV, Churn, Bewertung, Burn/Runway, Budget-Ist-Abweichung in Tabellenform", type: recall-fix, deps: [F16, K05]}
  - {id: M22, title: "Kunden-/Lieferantenverträge als Klasse (Vertragsparteien + Vergütung + Laufzeit + Vertraulichkeitsklausel)", type: new-entity, deps: [M01]}
  - {id: M23, title: "Default-Profil für Content-/Dokumentklassen festlegen (welche Klassen default an)", type: engine, deps: [M22], needs_decision: true}

  # ── H: Härtung und Abschluss ──────────────────────────────────────────
  - {id: H01, title: "Hard-Negative-Mining: 1.000 technische Benign-Snippets (Hashes, UUIDs, Digests, Lockfile-Integrity, Commit-SHAs, Testvektoren, Doku-Beispielkeys)", type: precision-fix, deps: [M23, D05, C08, G14]}
  - {id: H02, title: "Property-/Fuzz-Tests: kein Panic, gültige UTF-8-Offsets nach Dekodierung, strict bitgleich, Decoder-Rekursionslimit", type: test, deps: [H01]}
  - {id: H03, title: "Latenz-/Durchsatz-Budget nach allen Regeln (100 KiB p95 ≤ 10 ms, ≥ gitleaks-Durchsatz), Prefilter-Abdeckung 100 %", type: perf, deps: [H01]}
  - {id: H04, title: "Redaction-Qualität: PlaceholderEncoder für neue Gruppen, keine Secret-Fragmente in details/Logs", type: test, deps: [H01]}
  - {id: H05, title: "Doku: categories, rule catalog (Provider/Validator/Quelle), result schema, choose-categories, Vergleichsseite", type: docs, deps: [H03, H04]}
  - {id: H06, title: "Abschlussbericht M1–M4 auf Holdout inkl. Coverage-Matrix gitleaks/TruffleHog/detect-secrets/Google DLP", type: report, deps: [H05]}

