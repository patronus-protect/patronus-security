# L1-DLP backlog. One scheduled run completes exactly one task.
# Selection (deterministic, ark-l1 --program dlp next): first task in file order with
# status: todo, all deps done, all ext_deps merged to main and no open needs_decision.
# status: todo | in_progress | done | blocked | manual | deferred | bundled
# deferred: skipped by the schedule, field `deferred` gives the reason (trim 2026-10-21).
# bundled: absorbed into the bundle named in `into`; a bundle lists its old tasks in `bundles`.
# ext_deps: tasks of other programs, form <program>:<id> (e.g. pii:K03); must be on main.
#
# Shared acceptance (applies to every task in addition to `accept`):
#   tests_first:  goldens via generate_l1_goldens.py (>= 5 positives + 5 hard negatives per language,
#                 DE + EN; secrets in carriers: .env/YAML/JSON/code/log/prose), entry in
#                 rust/tests/fixtures/l1_bilingual_rules.json, Rust unit tests incl. structure/
#                 checksum vectors (valid/invalid) — committed before the implementation.
#   synthetic:    only synthetic secret values from the generator (E02); never real, leaked or
#                 live-valid secrets; no plaintext tokens with a valid checksum in the repo.
#   sources:      every new provider rule names its format source in research/dlp/rule_sources.yaml
#                 (vendor docs or gitleaks rule ID, MIT); undocumented formats are not built.
#   gate:         cargo fmt --check, clippy -D warnings, cargo test -p patronus-ark,
#                 13_l1_golden_eval green, DLP scoreboard without regression (> 0.5 pp F1 per group/class),
#                 FP/MB on benign code not higher, 0 new FP on hard negatives,
#                 100 KiB p95 at most +10 % (per task) and the H03 budget never exceeded.
#   docs:         CHANGELOG "Detection change", l1-rule-catalog via scripts/generate_docs.py.
#   no_relax:     never relax validators to buy recall; recall comes from structure/context/decoders.
#   defaults:     new secret groups on by default; new content/document classes off by default.
#   span:         secret span = the value only (for prefixed tokens incl. the prefix), never the key name.

setup:  # manual, not run by the schedule
  - id: S01
    title: Install pinned gitleaks, TruffleHog (unmodified binary, AGPL only executed), detect-secrets, optionally Kingfisher on the VPS (~/ark-dlp/baselines, versions in VERSIONS — gitleaks 8.30.1, trufflehog 3.97.9, detect-secrets 1.5.0)
    status: done
  - id: S02
    title: Extend the runner (research/l1-pii/runner) with --program {pii,dlp} (backlog, prompt, prefix dlp/, label ark-dlp, root ~/ark-dlp, golden arg dlp, scoreboard scripts/l1_dlp), ext_deps resolution, shared lock across both programs
    status: done
  - id: S03
    title: Create ~/ark-dlp (holdout 700, data/dev, state); both holdouts in InaccessiblePaths of both programs; benign code corpus (repo split) only on the VPS
    status: done
  - id: S04
    title: Merge research/dlp + runner to main, run runner/install.sh on the VPS (creates ~/ark-dlp, label ark-dlp, ark-dlp.timer at 21:00/02:00), enable timer
    status: manual
    owner: user
  - id: S05
    title: Find out whether GitHub push protection / secret scanning is active in the repo; if so, bypass policy only for generator recipes
    status: manual
    owner: user

tasks:
  # ── E: Measurement infrastructure ─────────────────────────────────────
  - id: E01
    status: done
    title: DLP taxonomy + mapping ARK ↔ gitleaks rule IDs ↔ TruffleHog detectors ↔ detect-secrets plugins ↔ Google DLP infotypes
    type: eval-infra
    deps: []
    accept: research/dlp/entity_map.yaml with scopes (shared, ark_only, baseline_only, out_of_scope); test that every dlp_* rule is mapped

  - id: E02
    status: done
    title: Secret-safe golden format (generator recipes instead of plaintext, materialized at test time)
    type: eval-infra
    deps: []
    decision: generator recipes (approved 2026-10-11)   # golden schema dlp_l1.jsonl; migrate the existing 115 cases
    accept: >-
      Secret values in dlp_l1.jsonl only as a recipe {"gen": "<generator>", "seed": <int>} plus a carrier template with
      placeholder, spans relative to the materialized text; deterministic materialization in Rust (golden eval/tests)
      and Python (generator) with identical results (cross test); dlp_l1.jsonl contains no checksum-valid tokens;
      migration of the existing 115 cases with a bit-identical 13_l1_golden_eval result; docs in benchmark_data/README

  - id: E03
    status: done
    title: Synthetic secret generator (format- and checksum-valid fake values per provider, deterministic per seed)
    type: eval-infra
    deps: [E01, E02]
    accept: python/patronus_ark/dlp_synth/ with generators for all current rules; unit tests that values pass the rule validators

  - id: E04
    status: done
    title: Carrier templates (env, YAML, JSON, TOML, HCL, XML, properties, shell/CLI, Dockerfile, CI YAML, Jupyter, log, HTTP, code in 8 languages, DE/EN chat/ticket/mail)
    type: eval-infra
    deps: [E03]
    accept: template families with separate dev/holdout subsets; spans in code points; hard-negative variants (placeholder, env reference, docs example value, test key)

  - id: E05
    status: done
    title: Benign code corpus (permissively licensed, pinned repos without secret-scanner repos; lockfiles, minified JS, SVG/base64, git logs)
    type: eval-infra
    deps: []
    accept: script in the repo, data only on the VPS; repo split dev/holdout, manifest with SHA-256 and license per repo; metric FP/MB

  - id: E06
    status: done
    title: Benign document corpus DE/EN (prose, public-domain/CC government and corporate texts) for content and document classes
    type: eval-infra
    deps: []
    accept: manifest with license + SHA-256, split dev/holdout, only on the VPS

  - id: E07
    status: done
    title: Baseline runner gitleaks / TruffleHog (--no-verification) / detect-secrets → unified prediction format
    type: eval-infra
    deps: [E01]
    accept: scripts/l1_dlp/run_baselines.py, pinned versions, span normalization to the value span documented per tool

  - id: E08
    status: done
    title: ARK runner in the same format (Python bindings), incl. rule_id, group, score
    type: eval-infra
    deps: [E07]

  - id: E09
    status: done
    title: Freeze the holdout (generator seed + holdout template families + benign holdout) under ~/ark-dlp/holdout
    type: eval-infra
    deps: [E04, E05, E06]
    accept: scripts/l1_dlp/prepare_corpora.py --dev-out DIR --holdout-out DIR (runner calls it in the gate, writes holdout/.ready); manifest with SHA-256; agent sandbox has no access

  - id: E10
    status: done
    title: DLP scoreboard (exact + overlap P/R/F1 per group and provider, attribution, FP/MB, document level for content, delta to base, exit code on regression)
    type: eval-infra
    deps: [E08, E09]
    accept: scripts/l1_dlp/scoreboard.py gate --head WT --base-sha SHA --dev DIR --holdout DIR --cache DIR (interface like scripts/l1_presidio), exit != 0 on regression

  - id: E11
    status: done
    title: Latency and throughput benchmark ARK vs. gitleaks/TruffleHog/detect-secrets (short / 4 KiB / 100 KiB / 10 MiB repo)
    type: eval-infra
    deps: [E10]

  - id: E12
    status: done
    title: Integrate external content goldens (gitleaks Go, SchemaPile) into the scoreboard + prediction attach/scope contract for document labels
    type: eval-infra
    deps: [E10]
    accept: contract in docs/research (document label + evidence span), exact-span score reported for SchemaPile

  - id: E13
    status: done
    title: Golden schema v2 for DLP (N per language, difficulty tags carrier/no_context/encoded/split/prose) + coverage per rule_id
    type: eval-infra
    deps: [E02]

  # TRIAGE 2026-W43 (dev scoreboard e3ee3c9, default profile: exact F1 35.0, P 23.2, R 71.4; 4011 FP on
  # 7012 hard-negative rows; benign code 10.17 FP/MB vs. gitleaks 0.21 / TruffleHog 1.43)
  - {id: T05, title: "run_baselines.py: detect-secrets aborts the whole benign-code run when one plugin raises on a file (ValueError from a YAML date in the dev split), so E14 has no detect-secrets FP/MB; catch per file like latency.py and count errors in the meta", type: eval-infra, deps: [E07], accept: "Test with a file that makes a plugin raise: run finishes, the file is listed under errors in <output>.meta.json, other files keep their findings; benign-code dev run completes", status: done}

  - id: E14
    status: done
    title: Baseline report ARK vs. gitleaks/TruffleHog/detect-secrets + static coverage matrix vs. Google DLP / Purview + error buckets
    type: report
    deps: [E10, E11, E12]
    accept: research/dlp/scoreboard/baseline.md; gaps as TRIAGE candidates

  # ── K: Engine ─────────────────────────────────────────────────────────
  - id: K01
    status: done
    title: Split dlp.rs into modules (secrets/providers, credentials, hashes, crypto, identifiers, content) without behaviour change
    type: refactor
    deps: [E13]
    accept: goldens and scoreboard bit-identical

  # TRIAGE 2026-W43: largest error bucket. 3734 of 4011 hard-negative FP are doc_example/test_key values
  # (EXAMPLE…/TESTKEY… markers, repeated chunks, 000000 tails); every provider rule fires on all 80.
  # TruffleHog filters these (API_KEY P 99.7 vs. ARK 33.3). Slice of K06 pulled forward; K06 keeps the
  # vendor-documented example allowlist, severity test and the template syntaxes beyond T07.
  - {id: T06, title: "Example/test value check for secret rules: marker words (EXAMPLE, SAMPLE, TEST/TESTKEY, DUMMY, FAKE, BEISPIEL, MUSTER) as whole words for every rule; repeated chunks, sequential runs (1234567890abcdef…) and long zero/same-character runs only for fixed-format provider tokens or with explicit example/test context (docs, sample, fixture), never on their own for generic password/credential assignments", type: precision-fix, deps: [K01], accept: "Shared helper next to is_secret_value with unit tests (marker in random base62 must not trigger by chance: require a whole marker word or repetition); hard negatives per provider DE/EN; positive goldens for weak but real credentials stay detected (password=abcabcabcabc, generic token with a 1234567890abcdef run, provider token with a repeated chunk outside example context); no golden positive lost; dev hard-negative FP doc_example/test_key down by >= 90 %", status: done}
  - {id: T07, title: "Placeholder/reference values in value-capturing rules (env_var_secret, generic/password assignment, credential_in_url, signed_url_signature, url_userinfo_password, csrf, bearer): SCREAMING_SNAKE/kebab placeholders DE/EN (YOUR_…_HERE, BITTE_AENDERN, HIER_…_EINTRAGEN, TODO, CHANGEME, YOUR-API-TOKEN), $VAR, {{var}}, var.x, os.environ[…], ENV.fetch(…), os.Getenv/System.getenv/Environment.GetEnvironmentVariable, process.env.X", type: precision-fix, deps: [K01], accept: "277 dev FP on placeholder/env_ref rows as hard negatives (Ruby/Python/Go/C#/HCL/Handlebars/shell); general code expressions stay with T03", status: done}

  - id: K02
    status: done
    title: Rule metadata v2 (provider, validator_strength checksum/structure/format/none, keywords for prefilter, min_entropy, source_ref, severity live/test)
    type: engine
    deps: [K01]
    accept: output in details; generate_docs.py renders provider/validator/source in the rule catalog

  - id: K03
    status: done
    title: Shared validator library (CRC32-Base62, Base58Check, Bech32/Bech32m, Base64/DER parse, JWT header, Shannon entropy, character classes)
    type: engine
    deps: [K01]
    accept: rust/src/detectors/validators/ with test vectors; reusable by PII

  - id: K04
    status: done
    title: Connect the score model to PII K02 (base per rule + validator strength + context), modes strict/balanced/recall
    type: engine
    deps: [K02, E14]
    ext_deps: [pii:K02]
    accept: strict = current behaviour bit-identical; P/R curves in the scoreboard

  - id: K06
    status: done
    title: Allowlist/suppression (documented provider example values, placeholders DE/EN, test/sandbox keys as severity test, variable/template references ${}, {{}}, %()s)
    type: precision-fix
    deps: [K02]

  - id: K07
    status: done
    title: Prefilter scaling for 200+ rules (Aho-Corasick over prefixes/keywords, AnchorGate coverage per rule)
    type: perf
    deps: [K02]
    accept: 100 KiB p95 before/after in the scoreboard; new rules without a keyword fail the test

  - id: K08
    status: done
    title: Overlap resolution (provider > token > credential > generic; hash vs. secret; DLP vs. PII double labels)
    type: engine
    deps: [K04]

  - id: K09
    status: done
    title: Taxonomy v2 (new groups CONNECTION_STRING, WEBHOOK_URL, AUTH_URL, OTP_SECRET, SEED_PHRASE; provider attribute in details)
    type: engine
    deps: [K02]
    decision: no new groups; the new kinds stay in existing groups with a subtype in details (approved 2026-10-19)
    accept: docs/reference/result-schema.md and categories updated; old groups unchanged

  # ── F: Repair existing rules ──────────────────────────────────────────
  # TRIAGE 2026-W42 (without scoreboard: dev probe on 3.2 MB of repo code + technical hard negatives)
  - {id: T01, title: "Token boundaries for all prefix rules: no match inside identifiers, hex runs or base64 blobs (probe: dlp_btc_wif 10 FP in Cargo.lock checksums and sha256 digests; hf_/npm_/AKIA in CamelCase identifiers)", type: precision-fix, deps: [K01], accept: "Left/right boundary per rule (no [A-Za-z0-9_] before/after, or provider alphabet), hard negatives Cargo.lock/go.sum/Docker digest/identifiers; checksum validation stays with F02–F05", status: done}
  - {id: F01, title: "dlp_eth_private_key: only with context (private key, privkey, mnemonic, wallet) instead of every 0x-64-hex (tx/block hash FP)", type: precision-fix, deps: [K03], status: done}
  - {id: F02, title: "dlp_btc_wif: Base58Check + version byte (mainnet/testnet, compressed)", type: precision-fix, deps: [K03], status: done}
  - {id: F03, title: "GitHub tokens (ghp/gho/ghu/ghs/ghr, github_pat_): exact lengths + CRC32 checksum", type: precision-fix, deps: [K03], status: done}
  - {id: F04, title: "npm token: length + CRC32 checksum; GitLab: all documented prefixes (deploy, runner, trigger, feed, OAuth …)", type: recall-fix, deps: [K03], status: done}
  - {id: F05, title: "AWS access key ID: exactly 20 characters, Base32 alphabet, prefix list; AWS secret key via structural context (credentials file, Terraform, CLI)", type: precision-fix, deps: [K03], status: done}
  - {id: F06, title: "OpenAI (project/svcacct/admin/legacy) and Anthropic (api/admin): format markers and lengths per docs; unify the validator", type: precision-fix, deps: [K03], status: bundled, into: F-LLM}
  - {id: T02, title: "Provider rules without an F task: HuggingFace (hf_, api_org_), Groq (gsk_), Replicate (r8_), Google API key (AIza, exactly 39), OAuth ya29., GCP GOCSPX-: lengths/alphabet per source instead of open {20,}", type: precision-fix, deps: [K03, T01], accept: "Format source per rule in rule_sources.yaml; set entity_map backlog for these entities to T02", status: bundled, into: F-LLM}
  - {id: F07, title: "JWT: header base64url → JSON with alg/typ; flag none alg; distinguish Supabase/Firebase service JWTs", type: precision-fix, deps: [K03], status: bundled, into: F-STRUCT}
  - {id: F08, title: "PEM blocks: all types (PKCS#8, ENCRYPTED, EC, DSA, OPENSSH, PGP PRIVATE KEY BLOCK, PuTTY PPK) + body base64/DER check; header only when a body is nearby", type: precision-fix, deps: [K03], status: bundled, into: F-STRUCT}
  - {id: F09, title: "Slack (bot/user/app/config/refresh) and Discord (bot token: ID segment base64 → snowflake digits)", type: precision-fix, deps: [K03], status: bundled, into: F-PROV}
  - {id: F10, title: "Stripe: sk/rk live vs. test (severity), pk_ explicitly negative; webhook secret length", type: precision-fix, deps: [K02], status: bundled, into: F-PROV}
  - {id: F11, title: "dlp_password_assignment/dlp_generic_credential_assignment: password likeness (character classes, DE/EN dictionary, entropy) against prose FP (\"Passwort ist falsch\")", type: precision-fix, deps: [K03], status: bundled, into: F-GEN1}
  - {id: T03, title: "Generic assignments: reject code expressions as values (function call, index/member access, type annotation string/str/Option<…>/Arc<…>, paths, format placeholder %s, shell variable as key $PWD:) — probe: 17 of 21 CREDENTIAL matches in repo code", type: precision-fix, deps: [F11], accept: "Hard negatives in Rust/Python/TS/Go/Shell (token: Option<&str>, token = get_token(), password = os.environ[…], docker -v \"$PWD:/work\"); prose FP stays with F11", status: bundled, into: F-GEN1}
  - {id: T04, title: "Capture quoted values in dlp_password_assignment/dlp_generic_credential_assignment up to the closing quote (spaces, ; , } in the value) — today truncated (\"blue Kite …\" → blue) or missed (value < 4 characters before ;)", type: recall-fix, deps: [T03], accept: "Exact spans for YAML/JSON/TOML/INI with quotes and special characters; interim until K05 takes over extraction structurally", status: bundled, into: F-GEN2}
  - {id: T08, title: "dlp_env_var_secret: value without surrounding quotes and trailing ;/, (today the span includes the quote: 120 extra spans on dev positives, 20 shell export '…' FN), also KEY: \"value\" (YAML/compose env), and reject code constants (DATA_API_KEY = '.data-api', AUTH_FLOW_PASSWORD = \"password\")", type: precision-fix, deps: [T04], accept: "Exact spans in env/shell/Dockerfile/code/YAML carriers; benign-code FP of the rule (30 on dev) as hard negatives", status: bundled, into: F-GEN2}
  - {id: T10, title: "dlp_url_userinfo_password: password likeness from F11 for userinfo (test credentials user:pass, user:secret, till:test, masked ***), and token-in-username forms (https://<token>:x-oauth-basic@, x-token-auth:<token>@) attribute the token, not the pseudo-password — 23 FP on dev benign code", type: precision-fix, deps: [F11], accept: "Hard negatives from test-suite URL patterns; token-in-username as positive with the token span", status: bundled, into: F-GEN1}
