  - {id: F16, title: "Business/record IDs and business_metric: counter-context (example, template, sample), table headers as anchors", type: precision-fix, deps: [K05], status: deferred, deferred: "Opt-in business classes; their precision is no milestone criterion and M3 already counts them"}
  - {id: T12, title: "Business/record IDs (opt-in): key-name anchors in config/code (order_id/orderId, vat_id/vatId, bsnr, case_id …) and the label in parentheses in prose (\"(Bestellnummer)\", \"(USt-IdNr.)\") — extended profile recall 4/32 per class on dev", type: recall-fix, deps: [F16, F15], accept: "Extended-profile goldens per class DE/EN; benign-docs flagged not higher", status: deferred, deferred: "Opt-in business ID recall (extended profile) is no milestone criterion"}

