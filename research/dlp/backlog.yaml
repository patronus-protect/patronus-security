  # ── Critical path (trim 2026-10-21) ───────────────────────────────
  # Only open tasks that move a milestone (M1–M4, research/dlp/README.md) or are infrastructure for
  # one, ordered by the measured gap in scoreboard/baseline.md: M1/always FP/MB (10.17 vs. gitleaks
  # 0.21) and M2 CREDENTIAL F1 (22.0 vs. target 43.7) first, then M3 breadth, then M4/report.
  # Bundles (bundles: [...]) replace several old tasks in one run; absorbed tasks carry
  # status: bundled + into, the rest status: deferred + deferred (reason). Both are skipped.
  - {id: F-GEN1, title: "Generic credential precision (F11 + T03 + T10): password likeness (character classes, DE/EN dictionary, entropy) for dlp_password_assignment/dlp_generic_credential_assignment against prose FP (\"Passwort ist falsch\"); reject code expressions as values (function call, index/member access, type annotations string/str/Option<…>/Arc<…>, paths, %s, $PWD: as key); reuse the likeness for dlp_url_userinfo_password (test credentials, masked ***, token in the username attributes the token)", type: precision-fix, deps: [K03], bundles: [F11, T03, T10], accept: "Hard negatives in Rust/Python/TS/Go/Shell for code expressions (token: Option<&str>, token = get_token(), password = os.environ[…], docker -v \"$PWD:/work\") and DE/EN prose; test-suite URL patterns as hard negatives, token-in-username as positive with the token span; dev benign-code FP of generic_credential_assignment + password_assignment + url_userinfo_password (222 on dev) down by >= 80 %; weak but real passwords stay detected; no golden positive lost", status: done}
  - {id: F-GEN2, title: "Value capture (T04 + T08): quoted values of dlp_password_assignment/dlp_generic_credential_assignment up to the closing quote (spaces, ; , } inside the value, values < 4 characters before ;); dlp_env_var_secret value without surrounding quotes and trailing ;/, plus KEY: \"value\" (YAML/compose env), code constants rejected (DATA_API_KEY = '.data-api', AUTH_FLOW_PASSWORD = \"password\")", type: recall-fix, deps: [F-GEN1], bundles: [T04, T08], accept: "Exact spans in YAML/JSON/TOML/INI/env/shell/Dockerfile/code carriers with quotes and special characters; the 20 dev boundary errors and the 120 extra dlp_env_var_secret spans fixed; the 30 dev benign-code FP of dlp_env_var_secret as hard negatives; interim until K05 takes over extraction structurally", status: done}
  - {id: T09, title: "Key shapes in key-anchored rules (password/generic assignment, csrf, password_hash, aws_secret_key): quoted keys (\"client_secret\": …, 'password' => …), prefixed/compound keys (db_password, service_secret, Aws-Secret-Access-Key:), camelCase (dbPassword, clientSecret, passwordHash, awsSecretAccessKey), typed declarations (const X: &str = …, : string = …), escaped quotes in JSON strings/notebooks (\\\"…\\\"), XML key=\"…\" value=\"…\" — 87 dev FN", type: recall-fix, deps: [F-GEN2], accept: "Goldens per key shape in JSON/YAML/TOML/XML/TS/Rust/Jupyter; benign-code FP not higher (T03 rejections stay); interim until K05/G02", status: done}
  - {id: F-HTTP, title: "HTTP auth values (F13 + T11): decode Basic base64 → user:pass, pre-attribute bearer values against JWT/provider, cookie names (connect.sid, laravel_session, __Host-*); Bearer/Basic/session cookie outside a literal header line (authorization/proxy_authorization keys in env/JSON/YAML/TOML/code, standalone values with DE/EN context in tickets/mails/logs, JSESSIONID=/PHPSESSID= without Cookie:)", type: recall-fix, deps: [K03], bundles: [F13, T11], accept: "Basic only when the base64 decodes to user:pass, bearer with entropy/JWT/provider check; dev recall of credential.http_basic_auth, credential.http_bearer and credential.session_cookie from 7.5 % to >= 80 % each; dev benign-code FP not higher (swagger-ui tests: Bearer abc123.xyz.789, Bearer secret_token as hard negatives)", status: done}

  - id: K05
    status: done
    title: Config key→value extraction, part 1 (env, INI/properties, HTTP headers) on PII K04, with a value-shape filter
    type: engine
    deps: [K04]
    ext_deps: [pii:K04]
    source: "Split 2026-10-21: the full-format K05 was blocked after 3 red rounds (holdout precision regression)"
    accept: >-
      Before a value is bound through a credential-like key, shapes that are not secrets are rejected:
      UUIDs, algorithm-prefixed or bare hex digests, ObjectIds, template/format fields, variable references,
      booleans, numbers, paths and URLs without credentials. Hard negatives for each shape (DE/EN keys);
      scoreboard without precision regression on any family

