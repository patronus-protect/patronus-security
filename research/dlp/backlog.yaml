# L1-DLP-Backlog. Ein geplanter Lauf erledigt genau eine Aufgabe.
# Auswahl (deterministisch, ark-l1 --program dlp next): erste Aufgabe in Dateireihenfolge mit
# status: todo, allen deps auf done, allen ext_deps auf main gemergt und ohne offenes needs_decision.
# status: todo | in_progress | done | blocked | manual
# ext_deps: Aufgaben anderer Programme, Form <programm>:<id> (z. B. pii:K03); müssen auf main sein.
#
# Gemeinsame Akzeptanz (gilt für jede Aufgabe zusätzlich zu `accept`):
#   tests_first:  Goldens über generate_l1_goldens.py (>= 5 Positive + 5 Hard Negatives je Sprache,
#                 DE + EN; Secrets in Carriern: .env/YAML/JSON/Code/Log/Prosa), Eintrag in
#                 rust/tests/fixtures/l1_bilingual_rules.json, Rust-Unit-Tests inkl. Struktur-/
#                 Prüfsummen-Vektoren (gültig/ungültig) — vor der Implementierung committet.
#   synthetic:    Nur synthetische Secret-Werte aus dem Generator (E02); nie echte, geleakte oder
#                 live-gültige Secrets; keine Klartext-Tokens mit gültiger Prüfsumme im Repo.
#   sources:      Jede neue Provider-Regel nennt in research/dlp/rule_sources.yaml ihre Formatquelle
#                 (Hersteller-Doku oder gitleaks-Regel-ID, MIT); unbelegte Formate werden nicht gebaut.
#   gate:         cargo fmt --check, clippy -D warnings, cargo test -p patronus-ark,
#                 13_l1_golden_eval grün, DLP-Scoreboard ohne Regression (> 0,5 pp F1 je Gruppe/Klasse),
#                 FP/MB auf Benign-Code nicht höher, 0 neue FP auf Hard Negatives,
#                 100 KiB p95 höchstens +10 % (je Aufgabe) und Budget aus H03 nie überschritten.
#   docs:         CHANGELOG „Detection change“, l1-rule-catalog via scripts/generate_docs.py.
#   no_relax:     Validatoren nie lockern, um Recall zu kaufen; Recall kommt über Struktur/Kontext/Decoder.
#   defaults:     Neue Secret-Gruppen default an; neue Content-/Dokumentklassen default aus.
#   span:         Secret-Span = nur der Wert (bei Präfix-Tokens inkl. Präfix), nie der Schlüsselname.

setup:  # manuell, nicht vom Schedule
  - id: S01
    title: gitleaks, TruffleHog (unverändertes Binary, AGPL nur ausgeführt), detect-secrets, optional Kingfisher auf der VPS gepinnt installieren (~/ark-dlp/baselines, Versionen in VERSIONS — gitleaks 8.30.1, trufflehog 3.97.9, detect-secrets 1.5.0)
    status: done
  - id: S02
    title: Runner (research/l1-pii/runner) um --program {pii,dlp} erweitern (Backlog, Prompt, Präfix dlp/, Label ark-dlp, Root ~/ark-dlp, Golden-Arg dlp, Scoreboard scripts/l1_dlp), ext_deps-Auflösung, gemeinsamer Lock über beide Programme
    status: done
  - id: S03
    title: ~/ark-dlp anlegen (holdout 700, data/dev, state); beide Holdouts in InaccessiblePaths beider Programme; Benign-Code-Korpus (Repo-Split) nur auf der VPS
    status: done
  - id: S04
    title: research/dlp + Runner auf main mergen, runner/install.sh auf der VPS ausführen (legt ~/ark-dlp, Label ark-dlp, ark-dlp.timer 21/02 Uhr an), Timer aktivieren
    status: manual
    owner: user
  - id: S05
    title: Klären, ob GitHub Push Protection / Secret Scanning im Repo aktiv ist; ggf. Bypass-Policy nur für Generator-Rezepte
    status: manual
    owner: user

tasks:
  # ── E: Messinfrastruktur ──────────────────────────────────────────────
  - id: E01
    status: done
    title: DLP-Taxonomie + Mapping ARK ↔ gitleaks-Regel-IDs ↔ TruffleHog-Detektoren ↔ detect-secrets-Plugins ↔ Google-DLP-Infotypes
    type: eval-infra
    deps: []
    accept: research/dlp/entity_map.yaml mit Scopes (shared, ark_only, baseline_only, out_of_scope); Test, dass jede dlp_*-Regel gemappt ist

  - id: E02
    status: done
    title: Secret-sicheres Golden-Format (Generator-Rezepte statt Klartext, Materialisierung zur Testzeit)
    type: eval-infra
    deps: []
    decision: Generator-Rezepte (freigegeben 2026-10-11)   # Golden-Schema dlp_l1.jsonl; bestehende 115 Fälle migrieren
    accept: >-
      Secret-Werte in dlp_l1.jsonl nur als Rezept {"gen": "<generator>", "seed": <int>} plus Carrier-Template mit
      Platzhalter, Spans relativ zum materialisierten Text; deterministische Materialisierung in Rust (Golden-Eval/Tests)
      und Python (Generator) mit identischem Ergebnis (Kreuztest); dlp_l1.jsonl enthält keine prüfsummengültigen Tokens;
      Migration der bestehenden 115 Fälle mit bitgleichem 13_l1_golden_eval-Ergebnis; Doku im benchmark_data/README

  - id: E03
    status: done
    title: Synthetischer Secret-Generator (format- und prüfsummengültige Fake-Werte je Provider, deterministisch per Seed)
    type: eval-infra
    deps: [E01, E02]
    accept: python/patronus_ark/dlp_synth/ mit Generatoren für alle heutigen Regeln; Unit-Tests, dass Werte die Regel-Validatoren bestehen

  - id: E04
    status: done
    title: Carrier-Templates (env, YAML, JSON, TOML, HCL, XML, properties, Shell/CLI, Dockerfile, CI-YAML, Jupyter, Log, HTTP, Code in 8 Sprachen, DE/EN-Chat/Ticket/Mail)
    type: eval-infra
    deps: [E03]
    accept: Template-Familien mit getrennten dev/holdout-Teilmengen; Spans in Code-Points; Hard-Negative-Varianten (Platzhalter, Env-Referenz, Doku-Beispielwert, Testschlüssel)

  - id: E05
    status: done
    title: Benign-Code-Korpus (permissiv lizenzierte, gepinnte Repos ohne Secret-Scanner-Repos; Lockfiles, Minified JS, SVG/base64, Git-Logs)
    type: eval-infra
    deps: []
    accept: Skript im Repo, Daten nur auf VPS; Repo-Split dev/holdout, Manifest mit SHA-256 und Lizenz je Repo; Metrik FP/MB

  - id: E06
    status: done
    title: Benign-Dokumentkorpus DE/EN (Prosa, Behörden-/Unternehmenstexte gemeinfrei/CC) für Content- und Dokumentklassen
    type: eval-infra
    deps: []
    accept: Manifest mit Lizenz + SHA-256, Split dev/holdout, nur auf VPS

  - id: E07
    status: done
    title: Baseline-Runner gitleaks / TruffleHog (--no-verification) / detect-secrets → einheitliches Vorhersageformat
    type: eval-infra
    deps: [E01]
    accept: scripts/l1_dlp/run_baselines.py, gepinnte Versionen, Span-Normalisierung auf Wert-Span je Tool dokumentiert

  - id: E08
    title: ARK-Runner im selben Format (Python-Bindings), inkl. rule_id, Gruppe, Score
    type: eval-infra
    deps: [E07]

  - id: E09
    title: Holdout einfrieren (Generator-Seed + Holdout-Template-Familien + Benign-Holdout) unter ~/ark-dlp/holdout
    type: eval-infra
    deps: [E04, E05, E06]
    accept: scripts/l1_dlp/prepare_corpora.py --dev-out DIR --holdout-out DIR (Runner ruft es im Gate, schreibt holdout/.ready); Manifest mit SHA-256; Agent-Sandbox hat keinen Zugriff

  - id: E10
    title: DLP-Scoreboard (exact + overlap P/R/F1 je Gruppe und Provider, Attribution, FP/MB, Dokumentebene für Content, Delta zur Base, Exit-Code bei Regression)
    type: eval-infra
    deps: [E08, E09]
    accept: scripts/l1_dlp/scoreboard.py gate --head WT --base-sha SHA --dev DIR --holdout DIR --cache DIR (Schnittstelle wie scripts/l1_presidio), Exit != 0 bei Regression

  - id: E11
    title: Latenz- und Durchsatz-Benchmark ARK vs. gitleaks/TruffleHog/detect-secrets (kurz / 4 KiB / 100 KiB / 10 MiB Repo)
    type: eval-infra
    deps: [E10]

  - id: E12
    title: Externe Content-Goldens (gitleaks-Go, SchemaPile) in Scoreboard integrieren + Prediction-Attach/Scope-Vertrag für Dokumentlabels
    type: eval-infra
    deps: [E10]
    accept: Vertrag in docs/research (Dokumentlabel + Evidenzspan), Exact-Span-Score für SchemaPile berichtet

  - id: E13
    title: Golden-Schema v2 für DLP (N je Sprache, difficulty-Tags carrier/no_context/encoded/split/prose) + Abdeckung je rule_id
    type: eval-infra
    deps: [E02]

  - id: E14
    title: Baseline-Report ARK vs. gitleaks/TruffleHog/detect-secrets + statische Coverage-Matrix vs. Google DLP / Purview + Fehler-Buckets
    type: report
    deps: [E10, E11, E12]
    accept: research/dlp/scoreboard/baseline.md; Lücken als TRIAGE-Kandidaten

  # ── K: Engine ─────────────────────────────────────────────────────────
  - id: K01
    title: dlp.rs in Module aufteilen (secrets/providers, credentials, hashes, crypto, identifiers, content) ohne Verhaltensänderung
    type: refactor
    deps: [E13]
    accept: Goldens und Scoreboard bitgleich

  - id: K02
    title: Regel-Metadaten v2 (provider, validator_strength checksum/structure/format/none, keywords für Prefilter, min_entropy, source_ref, severity live/test)
    type: engine
    deps: [K01]
    accept: Ausgabe in details; generate_docs.py rendert Provider/Validator/Quelle in den Rule-Catalog

  - id: K03
    title: Gemeinsame Validator-Bibliothek (CRC32-Base62, Base58Check, Bech32/Bech32m, Base64/DER-Parse, JWT-Header, Shannon-Entropie, Zeichenklassen)
    type: engine
    deps: [K01]
    accept: rust/src/detectors/validators/ mit Testvektoren; von PII mitnutzbar

  - id: K04
    title: Score-Modell an PII-K02 anschließen (Basis je Regel + Validatorstärke + Kontext), Modi strict/balanced/recall
    type: engine
    deps: [K02, E14]
    ext_deps: [pii:K02]
    accept: strict = heutiges Verhalten bitgleich; P/R-Kurven im Scoreboard

  - id: K05
    title: Config-Format-Kontext (env, YAML, JSON, TOML, INI/properties, HCL, XML-Attribute/-Elemente, HTTP-Header) als Key→Value-Extraktion auf PII-K04
    type: engine
    deps: [K04]
    ext_deps: [pii:K04]

  - id: K06
    title: Allowlist/Unterdrückung (dokumentierte Beispielwerte der Provider, Platzhalter DE/EN, Test-/Sandbox-Schlüssel als severity test, Variablen-/Template-Referenzen ${}, {{}}, %()s)
    type: precision-fix
    deps: [K02]

  - id: K07
    title: Prefilter-Skalierung für 200+ Regeln (Aho-Corasick über Präfixe/Keywords, AnchorGate-Abdeckung je Regel)
    type: perf
    deps: [K02]
    accept: 100 KiB p95 vor/nach im Scoreboard; neue Regeln ohne Keyword schlagen im Test fehl

  - id: K08
    title: Overlap-Auflösung (Provider > Token > Credential > Generic; Hash vs. Secret; DLP vs. PII-Doppel-Labels)
    type: engine
    deps: [K04]

  - id: K09
    title: Taxonomie v2 (neue Gruppen CONNECTION_STRING, WEBHOOK_URL, AUTH_URL, OTP_SECRET, SEED_PHRASE; provider-Attribut in details)
    type: engine
    deps: [K02]
    needs_decision: true   # Result-Schema, PlaceholderEncoder, Default-Profile
    accept: docs/reference/result-schema.md und categories aktualisiert; alte Gruppen unverändert

