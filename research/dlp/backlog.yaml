  # TRIAGE 2026-W44 (dev scoreboard 81ecc0e on the frozen E09 corpora, default secret groups: exact
  # P 99.3, R 97.8; 32 FN = 30 prose values in chat/ticket/mail (G-PROSE) + 2 XML-escaped signed URLs (T16);
  # 10 hard-negative FP, all dlp_private_key_block (T14); benign code 0.13 FP/MB (gitleaks 0.21): 3
  # url_userinfo_password (T17) + 2 dlp_sensitive_material (action DLP, out_of_scope, no task). The 144
  # opt-in hard-negative FP are business IDs (Q-DLP-BIZ1/2). Attribution 99.2 %: 12 values found under the
  # wrong entity, 10 of them password values under dlp_env_var_secret (T15) — the main cause of the
  # Q-DLP-PW floor gap (credential.password_assignment recall 24/40).
  - {id: T15, title: "Overlap attribution in the generic tier: on the same value span dlp_password_assignment (subtype password) loses to dlp_env_var_secret (generic_secret) today (DB_PASSWORD=…, ENV DB_PASSWORD …, export, CI env, code constants), so 10 of the 16 dev misses of credential.password_assignment are attribution errors; prefer the rule with the more specific subtype on an identical span in the generic tier (password > generic secret)", type: precision-fix, deps: [], accept: "Rust test per carrier (env, Dockerfile, shell export, CI YAML, code constant) that the surviving span is dlp_password_assignment with suppressed_by on dlp_env_var_secret; spans unchanged (untyped F1 bit-identical); dev credential.password_assignment exact recall 24/40 -> >= 34/40 and the entity at F1 >= 80 (Q-DLP-PW); no other entity loses attribution; non-password keys (API_KEY, CLIENT_SECRET) stay dlp_env_var_secret"}
  - {id: T17, title: "dlp_url_userinfo_password: percent-decode the userinfo before the F-GEN1 test-credential/likeness check (http://user:p%40ss@…, me%40company:p%40ssw%24rd in composer docs/tests are p@ss/p@ssw$rd) — 3 of 5 dev benign-code FP", type: precision-fix, deps: [], accept: "Hard negatives with percent-encoded test credentials (DE/EN docs, PHP/Python test arrays); positives with percent-encoded real passwords (reserved characters %40 %24 %3A in a chosen password) keep the encoded span; dev benign-code FP of the rule 3 -> 0; latency unchanged (decode only on matched userinfo)"}
  - {id: G-PROSE, title: "DE/EN prose credentials (G06 + G07): „Passwort lautet/ist“, „Zugangsdaten: user / pass“, login + password in tickets, chats and mails; PIN/TAN/PUK/Geheimzahl, online banking access and Wi-Fi key/WPA-PSK with DE/EN context; password likeness from F-GEN1", type: recall-fix, deps: [F-GEN1, K04], bundles: [G06, G07], accept: "Dev recall on chat/ticket/mail carriers (54 missed values today) >= 70 %; PIN/TAN only with DE/EN context, never bare digit runs; benign-docs flagged not higher (encyclopedia/law prose mentioning Passwort/PIN as hard negatives)"}
  - {id: Q-DLP-PW, title: "Quality: credential.password_assignment F1 75 -> >= 80 (default profile)", type: recall-fix, deps: [T15, G-PROSE], source: "Gold/quality pass 2026-10-25", accept: "Quality floor (decided 2026-10-25): every listed entity reaches exact F1 >= 80 in the profile the entity is measured in (default or opt-in) on every source family where it has gold (snapshot research/scoreboard/*.json); strict shows no regression; validators are never loosened; an entity that cannot reach 80 by a recorded decision is documented in the README"}
  - {id: G01, title: "Connection strings per scheme (postgres, mysql, mongodb+srv, redis, amqp, mssql/ADO.NET Password=, JDBC, ODBC, LDAP bind) incl. query passwords", type: new-entity, deps: [K05, K09], status: done}
  - {id: G03, title: "CLI credentials: curl -u, mysql -p…, psql PGPASSWORD=, sshpass -p, docker login -p, htpasswd -b, PowerShell ConvertTo-SecureString -AsPlainText, net use /user", type: new-entity, deps: [K05]}
  - {id: G02, title: "Structure-aware config keys: all secret-like keys in YAML/JSON/TOML/HCL/XML/properties (password, secret, token, apiKey, credentials, privateKey, DE variants)", type: recall-fix, deps: [K05C]}
  - {id: F-LLM, title: "LLM/Google provider formats (F06 + T02): OpenAI project/svcacct/admin/legacy and Anthropic api/admin markers and lengths with one shared validator; HuggingFace (hf_, api_org_), Groq (gsk_), Replicate (r8_), Google API key (AIza, exactly 39), OAuth ya29., GCP GOCSPX- lengths/alphabet per source instead of open {20,}", type: precision-fix, deps: [K03], bundles: [F06, T02], accept: "Format source per rule in rule_sources.yaml; entity_map backlog for these entities set to F-LLM; hard negatives with wrong length/alphabet; dev recall on llm.* and cloud.gcp.* stays 100 %"}
  - {id: F-STRUCT, title: "JWT and PEM structure (F07 + F08 + C07): JWT header base64url → JSON with alg/typ, flag alg none, distinguish Supabase/Firebase service JWTs; PEM blocks of all types (PKCS#8, ENCRYPTED, EC, DSA, OPENSSH, PGP PRIVATE KEY BLOCK, PuTTY PPK) with body base64/DER check, header only with a body nearby; OpenSSH unencrypted vs. encrypted (bcrypt KDF) as severity, authorized_keys/known_hosts as hard negatives", type: precision-fix, deps: [K03], bundles: [F07, F08, C07], accept: "Valid/invalid vectors per JWT header shape and PEM type (DER parse via K03), validator_strength structure in RuleMeta; dev recall on token.jwt and key.pem_private_key stays 100 %; dev benign-code FP of dlp_jwt_token not higher (2 today)"}
  - {id: T14, title: "Example/test check on decoded key material: dlp_private_key_block reports PEM/OpenSSH blocks whose base64 body encodes EXAMPLEKEY/TESTKEY markers or repeated chunks (T06 sees only the encoded text) — all 10 default-profile hard-negative FP on dev (PRIVATE_KEY P 78.7); same for base64 JSON payloads of token formats (1Password ops_eyJ…, JWT claims) once their rules exist", type: precision-fix, deps: [F-STRUCT], accept: "Shared helper on the decoded bytes (marker words as whole ASCII runs, repeated chunk over the key octets) reused by the PEM rule and future base64-JSON token rules; hard negatives per PEM type with marker/repeated key material (yaml, json, toml, hcl, code, jupyter, mail; DE/EN); generated random keys never rejected (property test over seeds); dev hard-negative FP of dlp_private_key_block 10 -> 0, key.pem_private_key recall stays 100 %"}
  - {id: F-PROV, title: "Slack, Discord and Stripe formats (F09 + F10): Slack bot/user/app/config/refresh tokens, Discord bot token ID segment base64 → snowflake digits; Stripe sk/rk live vs. test as severity, pk_ explicitly negative, webhook secret length", type: precision-fix, deps: [K02, K03], bundles: [F09, F10], accept: "Format sources in rule_sources.yaml; Discord snowflake check as validator_strength structure; sk_test_/rk_test_ with severity test, pk_ as hard negative; dev recall on comm.slack, comm.discord and payment.stripe stays 100 %"}
  - {id: G-URL, title: "URL credentials (F12 + G08 + G09): dlp_credential_in_url/dlp_signed_url_signature exclude pagination/cursor/CSRF parameters, signature only with signed-URL structure (X-Amz-*, X-Goog-*, Azure sv/se/sp); otpauth:// URIs (secret=Base32), TOTP seeds with context, 2FA recovery code lists; auth URLs (password reset/magic links, OAuth code/access_token in redirect fragments, invitation path tokens with entropy)", type: new-entity, deps: [K02, K09], bundles: [F12, G08, G09], accept: "Hard negatives for pagination/cursor/CSRF query parameters; Base32 check for otpauth secrets; K09 subtypes otp_secret/auth_url; dev recall on credential.signed_url_signature and credential.url_query_secret >= 95 %; benign-code FP not higher"}
  - {id: T16, title: "URL query rules in XML/HTML attribute values: dlp_credential_in_url and dlp_signed_url_signature do not take &amp; as a parameter separator (G01 does for DB URLs), so X-Amz-Signature after &amp;X-Amz-Expires=… is missed and api_key=… inside an <add value=\"https://…&amp;api_key=…\"> falls to dlp_generic_credential_assignment — 2 dev FN + 2 dev attribution errors in xml.* carriers", type: recall-fix, deps: [G-URL], accept: "Positives for signed URLs (AWS/GCS/Azure SAS) and secret query parameters with &amp; and &#38; in XML/HTML attributes and .config files DE/EN, span = the parameter value; dev credential.signed_url_signature and credential.url_query_secret recall 38/40 -> 40/40 with the right rule_id; pagination/cursor hard negatives from G-URL stay negative"}
