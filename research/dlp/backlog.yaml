  - {id: G06, title: "DE/EN prose: „Passwort lautet/ist“, „Zugangsdaten: user / pass“, „login with … password …“ in tickets, chats, emails; password likeness from F11", type: recall-fix, deps: [F11, K04], status: bundled, into: G-PROSE}
  - {id: G07, title: "PIN/TAN/PUK/Geheimzahl, card blocking/online banking access, Wi-Fi key/WPA-PSK (DE/EN context)", type: new-entity, deps: [G06], status: bundled, into: G-PROSE}
