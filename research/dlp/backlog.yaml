# L1-DLP backlog. One scheduled run completes exactly one task.
# Selection (deterministic, ark-l1 --program dlp next): first task in file order with
# status: todo, all deps done, all ext_deps merged to main and no open needs_decision.
# status: todo | in_progress | done | blocked | manual
# ext_deps: tasks of other programs, form <program>:<id> (e.g. pii:K03); must be on main.
#
# Shared acceptance (applies to every task in addition to `accept`):
#   tests_first:  goldens via generate_l1_goldens.py (>= 5 positives + 5 hard negatives per language,
#                 DE + EN; secrets in carriers: .env/YAML/JSON/code/log/prose), entry in
#                 rust/tests/fixtures/l1_bilingual_rules.json, Rust unit tests incl. structure/
#                 checksum vectors (valid/invalid) — committed before the implementation.
#   synthetic:    only synthetic secret values from the generator (E02); never real, leaked or
#                 live-valid secrets; no plaintext tokens with a valid checksum in the repo.
#   sources:      every new provider rule names its format source in research/dlp/rule_sources.yaml
#                 (vendor docs or gitleaks rule ID, MIT); undocumented formats are not built.
#   gate:         cargo fmt --check, clippy -D warnings, cargo test -p patronus-ark,
#                 13_l1_golden_eval green, DLP scoreboard without regression (> 0.5 pp F1 per group/class),
#                 FP/MB on benign code not higher, 0 new FP on hard negatives,
#                 100 KiB p95 at most +10 % (per task) and the H03 budget never exceeded.
#   docs:         CHANGELOG "Detection change", l1-rule-catalog via scripts/generate_docs.py.
#   no_relax:     never relax validators to buy recall; recall comes from structure/context/decoders.
#   defaults:     new secret groups on by default; new content/document classes off by default.
#   span:         secret span = the value only (for prefixed tokens incl. the prefix), never the key name.

setup:  # manual, not run by the schedule
  - id: S01
    title: Install pinned gitleaks, TruffleHog (unmodified binary, AGPL only executed), detect-secrets, optionally Kingfisher on the VPS (~/ark-dlp/baselines, versions in VERSIONS — gitleaks 8.30.1, trufflehog 3.97.9, detect-secrets 1.5.0)
    status: done
  - id: S02
    title: Extend the runner (research/l1-pii/runner) with --program {pii,dlp} (backlog, prompt, prefix dlp/, label ark-dlp, root ~/ark-dlp, golden arg dlp, scoreboard scripts/l1_dlp), ext_deps resolution, shared lock across both programs
    status: done
  - id: S03
    title: Create ~/ark-dlp (holdout 700, data/dev, state); both holdouts in InaccessiblePaths of both programs; benign code corpus (repo split) only on the VPS
    status: done
  - id: S04
    title: Merge research/dlp + runner to main, run runner/install.sh on the VPS (creates ~/ark-dlp, label ark-dlp, ark-dlp.timer at 21:00/02:00), enable timer
    status: manual
    owner: user
  - id: S05
    title: Find out whether GitHub push protection / secret scanning is active in the repo; if so, bypass policy only for generator recipes
    status: manual
    owner: user

tasks:
  # ── E: Measurement infrastructure ─────────────────────────────────────
  - id: E01
    status: done
    title: DLP taxonomy + mapping ARK ↔ gitleaks rule IDs ↔ TruffleHog detectors ↔ detect-secrets plugins ↔ Google DLP infotypes
    type: eval-infra
    deps: []
    accept: research/dlp/entity_map.yaml with scopes (shared, ark_only, baseline_only, out_of_scope); test that every dlp_* rule is mapped

  - id: E02
    status: done
    title: Secret-safe golden format (generator recipes instead of plaintext, materialized at test time)
    type: eval-infra
    deps: []
    decision: generator recipes (approved 2026-10-11)   # golden schema dlp_l1.jsonl; migrate the existing 115 cases
    accept: >-
      Secret values in dlp_l1.jsonl only as a recipe {"gen": "<generator>", "seed": <int>} plus a carrier template with
      placeholder, spans relative to the materialized text; deterministic materialization in Rust (golden eval/tests)
      and Python (generator) with identical results (cross test); dlp_l1.jsonl contains no checksum-valid tokens;
      migration of the existing 115 cases with a bit-identical 13_l1_golden_eval result; docs in benchmark_data/README

  - id: E03
    status: done
    title: Synthetic secret generator (format- and checksum-valid fake values per provider, deterministic per seed)
    type: eval-infra
    deps: [E01, E02]
    accept: python/patronus_ark/dlp_synth/ with generators for all current rules; unit tests that values pass the rule validators

  - id: E04
    title: Carrier templates (env, YAML, JSON, TOML, HCL, XML, properties, shell/CLI, Dockerfile, CI YAML, Jupyter, log, HTTP, code in 8 languages, DE/EN chat/ticket/mail)
    type: eval-infra
    deps: [E03]
    accept: template families with separate dev/holdout subsets; spans in code points; hard-negative variants (placeholder, env reference, docs example value, test key)

  - id: E05
    title: Benign code corpus (permissively licensed, pinned repos without secret-scanner repos; lockfiles, minified JS, SVG/base64, git logs)
    type: eval-infra
    deps: []
    accept: script in the repo, data only on the VPS; repo split dev/holdout, manifest with SHA-256 and license per repo; metric FP/MB

  - id: E06
    title: Benign document corpus DE/EN (prose, public-domain/CC government and corporate texts) for content and document classes
    type: eval-infra
    deps: []
    accept: manifest with license + SHA-256, split dev/holdout, only on the VPS

  - id: E07
    title: Baseline runner gitleaks / TruffleHog (--no-verification) / detect-secrets → unified prediction format
    type: eval-infra
    deps: [E01]
    accept: scripts/l1_dlp/run_baselines.py, pinned versions, span normalization to the value span documented per tool

  - id: E08
    title: ARK runner in the same format (Python bindings), incl. rule_id, group, score
    type: eval-infra
    deps: [E07]

  - id: E09
    title: Freeze the holdout (generator seed + holdout template families + benign holdout) under ~/ark-dlp/holdout
    type: eval-infra
    deps: [E04, E05, E06]
    accept: scripts/l1_dlp/prepare_corpora.py --dev-out DIR --holdout-out DIR (runner calls it in the gate, writes holdout/.ready); manifest with SHA-256; agent sandbox has no access

  - id: E10
    title: DLP scoreboard (exact + overlap P/R/F1 per group and provider, attribution, FP/MB, document level for content, delta to base, exit code on regression)
    type: eval-infra
    deps: [E08, E09]
    accept: scripts/l1_dlp/scoreboard.py gate --head WT --base-sha SHA --dev DIR --holdout DIR --cache DIR (interface like scripts/l1_presidio), exit != 0 on regression

  - id: E11
    title: Latency and throughput benchmark ARK vs. gitleaks/TruffleHog/detect-secrets (short / 4 KiB / 100 KiB / 10 MiB repo)
    type: eval-infra
    deps: [E10]

  - id: E12
    title: Integrate external content goldens (gitleaks Go, SchemaPile) into the scoreboard + prediction attach/scope contract for document labels
    type: eval-infra
    deps: [E10]
    accept: contract in docs/research (document label + evidence span), exact-span score reported for SchemaPile

  - id: E13
    title: Golden schema v2 for DLP (N per language, difficulty tags carrier/no_context/encoded/split/prose) + coverage per rule_id
    type: eval-infra
    deps: [E02]

  - id: E14
    title: Baseline report ARK vs. gitleaks/TruffleHog/detect-secrets + static coverage matrix vs. Google DLP / Purview + error buckets
    type: report
    deps: [E10, E11, E12]
    accept: research/dlp/scoreboard/baseline.md; gaps as TRIAGE candidates

  # ── K: Engine ─────────────────────────────────────────────────────────
  - id: K01
    title: Split dlp.rs into modules (secrets/providers, credentials, hashes, crypto, identifiers, content) without behaviour change
    type: refactor
    deps: [E13]
    accept: goldens and scoreboard bit-identical

  - id: K02
    title: Rule metadata v2 (provider, validator_strength checksum/structure/format/none, keywords for prefilter, min_entropy, source_ref, severity live/test)
    type: engine
    deps: [K01]
    accept: output in details; generate_docs.py renders provider/validator/source in the rule catalog

  - id: K03
    title: Shared validator library (CRC32-Base62, Base58Check, Bech32/Bech32m, Base64/DER parse, JWT header, Shannon entropy, character classes)
    type: engine
    deps: [K01]
    accept: rust/src/detectors/validators/ with test vectors; reusable by PII

  - id: K04
    title: Connect the score model to PII K02 (base per rule + validator strength + context), modes strict/balanced/recall
    type: engine
    deps: [K02, E14]
    ext_deps: [pii:K02]
    accept: strict = current behaviour bit-identical; P/R curves in the scoreboard

  - id: K05
    title: Config format context (env, YAML, JSON, TOML, INI/properties, HCL, XML attributes/elements, HTTP headers) as key→value extraction on PII K04
    type: engine
    deps: [K04]
    ext_deps: [pii:K04]

  - id: K06
    title: Allowlist/suppression (documented provider example values, placeholders DE/EN, test/sandbox keys as severity test, variable/template references ${}, {{}}, %()s)
    type: precision-fix
    deps: [K02]

  - id: K07
    title: Prefilter scaling for 200+ rules (Aho-Corasick over prefixes/keywords, AnchorGate coverage per rule)
    type: perf
    deps: [K02]
    accept: 100 KiB p95 before/after in the scoreboard; new rules without a keyword fail the test

  - id: K08
    title: Overlap resolution (provider > token > credential > generic; hash vs. secret; DLP vs. PII double labels)
    type: engine
    deps: [K04]

  - id: K09
    title: Taxonomy v2 (new groups CONNECTION_STRING, WEBHOOK_URL, AUTH_URL, OTP_SECRET, SEED_PHRASE; provider attribute in details)
    type: engine
    deps: [K02]
    needs_decision: true   # result schema, PlaceholderEncoder, default profiles
    accept: docs/reference/result-schema.md and categories updated; old groups unchanged

  # ── F: Repair existing rules ──────────────────────────────────────────
  # TRIAGE 2026-W42 (without scoreboard: dev probe on 3.2 MB of repo code + technical hard negatives)
  - {id: T01, title: "Token boundaries for all prefix rules: no match inside identifiers, hex runs or base64 blobs (probe: dlp_btc_wif 10 FP in Cargo.lock checksums and sha256 digests; hf_/npm_/AKIA in CamelCase identifiers)", type: precision-fix, deps: [K01], accept: "Left/right boundary per rule (no [A-Za-z0-9_] before/after, or provider alphabet), hard negatives Cargo.lock/go.sum/Docker digest/identifiers; checksum validation stays with F02–F05"}
  - {id: F01, title: "dlp_eth_private_key: only with context (private key, privkey, mnemonic, wallet) instead of every 0x-64-hex (tx/block hash FP)", type: precision-fix, deps: [K03]}
  - {id: F02, title: "dlp_btc_wif: Base58Check + version byte (mainnet/testnet, compressed)", type: precision-fix, deps: [K03]}
  - {id: F03, title: "GitHub tokens (ghp/gho/ghu/ghs/ghr, github_pat_): exact lengths + CRC32 checksum", type: precision-fix, deps: [K03]}
  - {id: F04, title: "npm token: length + CRC32 checksum; GitLab: all documented prefixes (deploy, runner, trigger, feed, OAuth …)", type: recall-fix, deps: [K03]}
  - {id: F05, title: "AWS access key ID: exactly 20 characters, Base32 alphabet, prefix list; AWS secret key via structural context (credentials file, Terraform, CLI)", type: precision-fix, deps: [K03]}
  - {id: F06, title: "OpenAI (project/svcacct/admin/legacy) and Anthropic (api/admin): format markers and lengths per docs; unify the validator", type: precision-fix, deps: [K03]}
  - {id: T02, title: "Provider rules without an F task: HuggingFace (hf_, api_org_), Groq (gsk_), Replicate (r8_), Google API key (AIza, exactly 39), OAuth ya29., GCP GOCSPX-: lengths/alphabet per source instead of open {20,}", type: precision-fix, deps: [K03, T01], accept: "Format source per rule in rule_sources.yaml; set entity_map backlog for these entities to T02"}
  - {id: F07, title: "JWT: header base64url → JSON with alg/typ; flag none alg; distinguish Supabase/Firebase service JWTs", type: precision-fix, deps: [K03]}
  - {id: F08, title: "PEM blocks: all types (PKCS#8, ENCRYPTED, EC, DSA, OPENSSH, PGP PRIVATE KEY BLOCK, PuTTY PPK) + body base64/DER check; header only when a body is nearby", type: precision-fix, deps: [K03]}
  - {id: F09, title: "Slack (bot/user/app/config/refresh) and Discord (bot token: ID segment base64 → snowflake digits)", type: precision-fix, deps: [K03]}
  - {id: F10, title: "Stripe: sk/rk live vs. test (severity), pk_ explicitly negative; webhook secret length", type: precision-fix, deps: [K02]}
  - {id: F11, title: "dlp_password_assignment/dlp_generic_credential_assignment: password likeness (character classes, DE/EN dictionary, entropy) against prose FP (\"Passwort ist falsch\")", type: precision-fix, deps: [K03]}
  - {id: T03, title: "Generic assignments: reject code expressions as values (function call, index/member access, type annotation string/str/Option<…>/Arc<…>, paths, format placeholder %s, shell variable as key $PWD:) — probe: 17 of 21 CREDENTIAL matches in repo code", type: precision-fix, deps: [F11], accept: "Hard negatives in Rust/Python/TS/Go/Shell (token: Option<&str>, token = get_token(), password = os.environ[…], docker -v \"$PWD:/work\"); prose FP stays with F11"}
  - {id: T04, title: "Capture quoted values in dlp_password_assignment/dlp_generic_credential_assignment up to the closing quote (spaces, ; , } in the value) — today truncated (\"blue Kite …\" → blue) or missed (value < 4 characters before ;)", type: recall-fix, deps: [T03], accept: "Exact spans for YAML/JSON/TOML/INI with quotes and special characters; interim until K05 takes over extraction structurally"}
  - {id: F12, title: "dlp_credential_in_url / dlp_signed_url_signature: exclude pagination/cursor/CSRF parameters, signature only with signed-URL structure (X-Amz-*, X-Goog-*, Azure sv/se/sp)", type: precision-fix, deps: [K02]}
  - {id: F13, title: "Bearer/Basic/Cookie/CSRF: decode Basic auth base64 → user:pass; pre-attribute bearer values against JWT/provider; extend cookie names (connect.sid, laravel_session, __Host-*)", type: recall-fix, deps: [K03]}
  - {id: F14, title: "Password hash: relax the anchor requirement in favour of format detection ($2y$, $argon2id$, $6$, $5$, $1$, $apr1$, pbkdf2_sha256$, scrypt) with context", type: recall-fix, deps: [K04]}
  - {id: F15, title: "Clarify DLP vs. PII ownership for VAT ID, commercial register, BSNR and resolve double labels", type: engine, deps: [K08], needs_decision: true}
  - {id: F16, title: "Business/record IDs and business_metric: counter-context (example, template, sample), table headers as anchors", type: precision-fix, deps: [K05]}

  # ── P: Provider secrets ───────────────────────────────────────────────
  - {id: P01, title: "LLM/AI I: Google Gemini/AI Studio, Mistral, Cohere, Perplexity, DeepSeek, OpenRouter, Together, Fireworks", type: new-entity, deps: [F06]}
  - {id: P02, title: "LLM/AI II: Azure OpenAI (context), LangSmith, Pinecone, Weights & Biases, ElevenLabs, AssemblyAI, Deepgram, Stability", type: new-entity, deps: [P01]}
  - {id: P03, title: "Hyperscalers: AWS session token/MWS, Azure Storage AccountKey + SAS + Entra client secret, GCP service account JSON, Alibaba, Tencent, IBM Cloud, Oracle OCI", type: new-entity, deps: [F05, F12]}
  - {id: P04, title: "EU/DE cloud: IONOS, Hetzner, STACKIT, OVHcloud, Scaleway, Open Telekom Cloud, Exoscale (formats only with a source, otherwise context rule)", type: new-entity, deps: [K04]}
  - {id: P05, title: "DevOps/registries: Docker Hub PAT, PyPI (macaroon structure), RubyGems, NuGet, crates.io, Packagist, JFrog, Terraform Cloud, Pulumi, Vault, Doppler", type: new-entity, deps: [F04]}
  - {id: P06, title: "CI/hosting: Bitbucket, Azure DevOps PAT (context), CircleCI, Travis, Vercel, Netlify, Fly.io, Heroku, Render, Railway, Cloudflare, DigitalOcean", type: new-entity, deps: [P05]}
  - {id: P07, title: "Observability: Datadog, New Relic, Sentry (token + DSN), Grafana (cloud/service account), Dynatrace, Splunk HEC, Elastic, Honeycomb, PagerDuty", type: new-entity, deps: [K04]}
  - {id: P08, title: "Communication/webhooks: Slack/Teams/Discord webhook URLs, Telegram bot, Twilio (SK/AC + context), SendGrid, Mailgun, Mailchimp, Postmark, Brevo", type: new-entity, deps: [F09]}
  - {id: P09, title: "Payment/commerce: PayPal/Braintree, Square, Adyen, Mollie, Klarna, Shopify (all token types), Coinbase, Plaid, GoCardless", type: new-entity, deps: [F10]}
  - {id: P10, title: "Productivity/SaaS: Atlassian, Notion, Linear, Airtable, Figma, Asana, monday, HubSpot, Salesforce (context), Zendesk, Intercom, Postman, Mapbox (sk vs. pk)", type: new-entity, deps: [K04]}
  - {id: P11, title: "Identity/auth: Okta, Auth0 (client secret context), Clerk, Supabase (service role JWT, sbp_), Firebase (Admin SDK JSON), age secret key, 1Password service account", type: new-entity, deps: [F07]}
  - {id: P12, title: "Data/DB platforms: Databricks, Snowflake, PlanetScale, Neon, MongoDB Atlas API, Confluent, Algolia admin key (context), Elastic Cloud", type: new-entity, deps: [K04]}

  # ── G: Generic credentials ────────────────────────────────────────────
  - {id: G01, title: "Connection strings per scheme (postgres, mysql, mongodb+srv, redis, amqp, mssql/ADO.NET Password=, JDBC, ODBC, LDAP bind) incl. query passwords", type: new-entity, deps: [K05, K09]}
  - {id: G02, title: "Structure-aware config keys: all secret-like keys in YAML/JSON/TOML/HCL/XML/properties (password, secret, token, apiKey, credentials, privateKey, DE variants)", type: recall-fix, deps: [K05]}
  - {id: G03, title: "CLI credentials: curl -u, mysql -p…, psql PGPASSWORD=, sshpass -p, docker login -p, htpasswd -b, PowerShell ConvertTo-SecureString -AsPlainText, net use /user", type: new-entity, deps: [K05]}
  - {id: G04, title: "Credential files: .netrc, .git-credentials, .npmrc _authToken, .pypirc, docker config.json auths, Maven settings.xml, NuGet.config, rclone/s3cfg", type: new-entity, deps: [K05]}
  - {id: G05, title: "Kubernetes: secret manifests (data base64 → check decoded, stringData), kubeconfig (client-key-data, token), Helm values", type: new-entity, deps: [G02, D01]}
  - {id: G06, title: "DE/EN prose: „Passwort lautet/ist“, „Zugangsdaten: user / pass“, „login with … password …“ in tickets, chats, emails; password likeness from F11", type: recall-fix, deps: [F11, K04]}
  - {id: G07, title: "PIN/TAN/PUK/Geheimzahl, card blocking/online banking access, Wi-Fi key/WPA-PSK (DE/EN context)", type: new-entity, deps: [G06]}
  - {id: G08, title: "OTP: otpauth:// URIs (secret=Base32), TOTP seeds with context, 2FA recovery/backup code lists", type: new-entity, deps: [K09]}
  - {id: G09, title: "Auth URLs: password reset/magic links, OAuth code/access_token in redirect fragments, invitation tokens (path token with entropy)", type: new-entity, deps: [K09, F12]}
  - {id: G10, title: "System hashes: /etc/shadow lines, htpasswd, NTLM/LM (pwdump/secretsdump format), MySQL *41hex, PostgreSQL md5/SCRAM, Kerberos hash formats", type: new-entity, deps: [F14]}
  - {id: G11, title: "Network devices: Cisco type 5/7/8/9 + enable secret, Juniper $9$, SNMP community, RADIUS/TACACS shared secrets, Windows GPP cpassword, unattend.xml", type: new-entity, deps: [F14]}
  - {id: G12, title: "Generic high-entropy value only on a secret-like key (detect-secrets parity, but with allowlist/structure), balanced/recall mode only", type: recall-fix, deps: [G02, K06]}
  - {id: G13, title: "References to sensitive paths as context anchors (~/.ssh/id_*, ~/.aws/credentials, .env, kubeconfig, /etc/shadow, Keychain/Credential Manager) — no finding type of their own", type: engine, deps: [K02]}
  - {id: G14, title: "Remote access: VNC/RDP files (password 51:b:), FileZilla/WinSCP saved passwords, SSH agent forwarding configs with IdentityFile + passphrase context", type: new-entity, deps: [G04]}

  # ── C: Crypto and key material ────────────────────────────────────────
  - {id: C01, title: "BIP39 seed phrases (12/15/18/21/24 words, EN + other official word lists, checksum), also numbered/line by line", type: new-entity, deps: [K09, K03]}
  - {id: C02, title: "Extended private keys (xprv/yprv/zprv/tprv, Base58Check) and Electrum seeds (context)", type: new-entity, deps: [F02]}
  - {id: C03, title: "Wallet files: Ethereum keystore JSON (crypto.ciphertext/kdf), Solana keypair array (64 bytes, context), Monero/Cardano signing keys with a source", type: new-entity, deps: [F01]}
  - {id: C04, title: "JWK/JWKS with private parameters (d, p, q, dp, dq, qi) and OKP keys", type: new-entity, deps: [K05]}
  - {id: C05, title: "PKCS#12/JKS/Keychain/KeePass as base64 blob (magic bytes after decoding) and certificate passwords (keystore.password)", type: new-entity, deps: [D01]}
  - {id: C06, title: "WireGuard PrivateKey, OpenVPN <key>/<tls-auth>, IPsec PSK (context)", type: new-entity, deps: [K05]}
  - {id: C07, title: "SSH: distinguish unencrypted vs. encrypted (bcrypt KDF) → severity; authorized_keys/known_hosts as hard negatives", type: precision-fix, deps: [F08]}
  - {id: C08, title: "Symmetric keys in code (AES/HMAC constants as byte arrays/hex with context key/secret), Django SECRET_KEY, Rails secret_key_base, Laravel APP_KEY", type: new-entity, deps: [G02]}

  # ── D: Decoders and obfuscation ───────────────────────────────────────
  - {id: D01, title: "Decoder pipeline base64/base64url with offset back-mapping, recursion depth 2, size limit", type: engine, deps: [K02], accept: "Decoded matches point to the encoded range; latency budget kept"}
  - {id: D02, title: "Hex, URL percent, JSON/C escape and Unicode escape decoding", type: engine, deps: [D01]}
  - {id: D03, title: "UTF-16LE/BE text (PowerShell -EncodedCommand, Windows exports)", type: engine, deps: [D02]}
  - {id: D04, title: "Concatenated strings (\"sk-\" + \"…\", template literals, line continuation with \\ ) and zero-width/full-width via PII K06", type: engine, deps: [D02], ext_deps: [pii:K06]}
  - {id: D05, title: "Secrets in diffs/patches and git log output (+/- lines, only added lines count as current)", type: engine, deps: [K05]}

  # ── M: Sensitive material and document classes ───────────────────────
  - {id: M01, title: "Content class engine: document label from anchor combination (strong/medium/structural) + evidence span, minimum density, counter-context", type: engine, deps: [E12, K04]}
  - {id: M02, title: "Classification markings DE: VS-NUR FÜR DEN DIENSTGEBRAUCH, VS-VERTRAULICH, GEHEIM, STRENG GEHEIM; corporate levels intern/vertraulich/streng vertraulich", type: new-entity, deps: [M01]}
  - {id: M03, title: "Classification markings EN/international: Confidential, Restricted, Internal Only, TLP 2.0 (CLEAR/GREEN/AMBER/AMBER+STRICT/RED), NATO/EU markings", type: new-entity, deps: [M02]}
  - {id: M04, title: "Confidentiality/NDA: non-disclosure agreement (Geheimhaltungsvereinbarung), GeschGehG notice, trade secret markers, embargo/blocking period", type: new-entity, deps: [M01]}
  - {id: M05, title: "Legally privileged: lawyer/client correspondence, attorney-client privileged, draft pleadings, settlement negotiations", type: new-entity, deps: [M01]}
  - {id: M06, title: "HR documents: employment reference (Arbeitszeugnis), warning letter (Abmahnung), termination, termination agreement, payslip, performance review", type: new-entity, deps: [M01]}
  - {id: M07, title: "Unpublished financials: quarterly/annual figures before publication, ad hoc/inside information (MAR Art. 7), insider list, guidance", type: new-entity, deps: [M01, F16]}
  - {id: M08, title: "M&A/transactions: term sheet, LOI, due diligence, data room, project code names, SPA, valuation/cap table", type: new-entity, deps: [M01]}
  - {id: M09, title: "Boards: management/supervisory board minutes, board minutes, resolution drafts", type: new-entity, deps: [M01]}
  - {id: M10, title: "Terms/prices: purchase prices, discount tiers, internal price lists, quote calculations, supplier terms", type: new-entity, deps: [M01, F16]}
