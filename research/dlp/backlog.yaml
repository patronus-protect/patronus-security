  - {id: T18, title: "Generic rules on machine-issued values of providers without an ARK rule: dlp_generic_credential_assignment and dlp_env_var_secret report doc_example/test_key values such as SK+deadbeef…, deadbeef…-us10, 1234567890…-12345678-…, shippo_live_1234…, xapp-1-…-1234567890… because the T06 repetition/sequence check runs only for pure hex under a generic key (is_machine_hex) — 230 hard-negative FP on the 4,200 GOLD-D2 hard-negative rows of the current dev generator (0 on lookalike)", type: precision-fix, deps: [], accept: "Generic example check treats a value as machine-issued when it holds a hex/digit/base62 run of >= 24 characters next to a short prefix or suffix (SK…, …-usNN, word_live_…, dash-separated hex groups) and then applies the fixed-format repetition/sequence check to that run; hand-typed weak passwords (abcabcabcabc, Passwort123!) and the T06 positive goldens stay detected; hard negatives from the GOLD-D2 doc_example/test_key rows DE/EN; dev hard-negative FP of the two generic rules on baseline-entity rows 230 -> <= 23"}
