  - {id: P04, title: "EU/DE cloud: IONOS, Hetzner, STACKIT, OVHcloud, Scaleway, Open Telekom Cloud, Exoscale (formats only with a source, otherwise context rule)", type: new-entity, deps: [K04], status: deferred, deferred: "Few gitleaks default rules and mostly undocumented formats; M3 thresholds are reachable with the other P packages"}

