  - {id: G10, title: "System hashes: /etc/shadow lines, htpasswd, NTLM/LM (pwdump/secretsdump format), MySQL *41hex, PostgreSQL md5/SCRAM, Kerberos hash formats", type: new-entity, deps: [F14], status: bundled, into: G-HASH}
