  - {id: G12, title: "Generic high-entropy value only on a secret-like key (detect-secrets parity, but with allowlist/structure), balanced/recall mode only", type: recall-fix, deps: [G02, K06], status: deferred, deferred: "Balanced/recall mode only; milestones are judged in the default profile"}
