benchmarks:
  - id: promptshield_test
    name: PromptShield benchmark, test split
    classes: [instruction_injection]
    languages: [en]
    source: https://huggingface.co/datasets/hendzh/PromptShield
    licence: Apache-2.0
    revision: a5234cb1f5cdb256600cab64b8c961195b5e8404
    files:
      - {path: test.json, sha256: 526207c2485829d9961407011d7f4cd929569e7f285dc8396b3f385e0608bc70}
    commercial: true
    eval_only: true
    format: json
    text: prompt
    positive:
      - {field: label, equals: 1}
    protocol: tpr_at_fpr
    targets: [0.01, 0.001]
    note: >-
      23,516 prompts (field prompt, label 1 = injection); the paper picks each detector's cut on the test split's own
      benign prompts at 1 % and 0.1 % FPR (arXiv 2501.15145, Table 4)
  - id: sentinel_deepset
    name: deepset prompt-injections (Sentinel protocol)
    classes: [instruction_injection]
    languages: [de, en]
    source: https://huggingface.co/datasets/deepset/prompt-injections
    licence: Apache-2.0
    revision: 4f61ecb038e9c3fb77e21034b22511b523772cdd
    dataset: deepset_prompt_injections
    commercial: true
    eval_only: true
    positive:
      - {field: label, equals: "1"}
    protocol: f1_at_cut
    note: >-
      binary F1 at each system's own decision (arXiv 2506.05446, Table 2); the paper does not name the split or the
      threshold, so all rows of the registered report set are scored and classifiers decide at 0.5
  - id: sentinel_jackhhao
    name: jackhhao jailbreak-classification (Sentinel protocol)
    classes: [jailbreak]
    languages: [en]
    source: https://huggingface.co/datasets/jackhhao/jailbreak-classification
    licence: Apache-2.0
    revision: 2f2ceeb39658696fd3f462403562b6eea5306287
    dataset: jackhhao_jailbreak
    commercial: true
    eval_only: true
    positive:
      - {field: type, equals: jailbreak}
    protocol: f1_at_cut
    note: >-
      binary F1 at each system's own decision (arXiv 2506.05446, Table 2); ProtectAI v2 lists this set among its
      training data, so its number is contaminated
  - id: sentinel_wildjailbreak
    name: WildJailbreak (Sentinel protocol)
    classes: [jailbreak]
    languages: [en]
    source: https://huggingface.co/datasets/allenai/wildjailbreak
    licence: ODC-BY-1.0
    revision: pending
    commercial: true
    eval_only: true
    protocol: f1_at_cut
    pending: >-
      the eval split (2,000 + 210 rows) is part of ARK's own dev data, so it can not serve as an evaluation-only
      benchmark; the train split is gated upstream (terms to accept), and the paper does not say which split it scored
    note: binary F1 (arXiv 2506.05446, Table 2)
  - id: mcp_tool_poisoning_2604_10534
    name: MCP tool-poisoning detection (arXiv 2604.10534, binary)
    classes: [tool_poisoning]
    languages: [en]
    source: https://arxiv.org/abs/2604.10534
    licence: unknown
    revision: pending
    commercial: unknown
    eval_only: true
    protocol: f1_at_cut
    dropped: >-
      holdout source: the malicious tool descriptions are MCPTox, a holdout set of this program, and the benign tool
      descriptions (own GitHub crawl, 142-row test split) are not released
    note: binary F1 on a 90/10 split; Cisco MCP-scanner YARA 31.25 % (Table 1)
  - id: openai_moderation_f1
    name: OpenAI moderation evaluation set (F1 at the decision)
    classes: [harmful_content, toxic_language]
    languages: [en]
    source: https://github.com/openai/moderation-api-release
    licence: MIT
    revision: f4ab51b5edd3bfbcb349a56324274235b674e0e4
