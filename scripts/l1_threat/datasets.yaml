  - id: nemotron_safety_v3
    commercial: true
    # Test and validation splits of the EN part and of the machine-translated DE part (the same prompts); the text
    # is the user prompt.
    source: https://huggingface.co/datasets/nvidia/Nemotron-Safety-Guard-Dataset-v3
    revision: a3f7ecb3433d1933701a83f18de16c36934a7f51
    files:
      - {path: en/test.jsonl, sha256: 1d6d9c67281e4e6335a006013fa48011ca1c8160db9d4824a24426c903a2ed97}
      - {path: en/valid.jsonl, sha256: 04dc2c80edd0bd19b6eda6cc86d9949f42221af0706fbf2608a824e019e68cd1}
      - {path: de/test.jsonl, sha256: c38a40b3ac3b7a2caadda70f05d654ecb31af1445db02ea0ae1f761a81939614}
      - {path: de/valid.jsonl, sha256: 9d2bb7d9b99bb88617f9068211d67e36a0423ff1cf042c378830e7a1209595b2}
    format: jsonl
    text: prompt
    language_field: language
    labels:
      # Only the human-labelled part (tags generic and adapted) is scored; violated_categories lists every category
      # of the conversation, so a toxic category counts only on a prompt labelled unsafe.
      - field: violated_categories
        contains: [Hate/Identity Hate, Harassment, Profanity]
        and: [{field: prompt_label, equals: unsafe}, {field: tag, equals: [generic, adapted]}]
        label: "category in (Hate/Identity Hate, Harassment, Profanity)"
      - field: violated_categories
        contains: Threat
        and: [{field: prompt_label, equals: unsafe}, {field: tag, equals: [generic, adapted]}]
        label: "category = Threat"
      # harmful_content: a harmful category on a prompt labelled unsafe and no toxic one (a row with both is scored
      # for toxic_language only, behind its own cue); adult sexual content alone is not scored. The union label holds
      # the cue; one label per category names the AILuminate hazard of the row.
      - field: violated_categories
        contains: &nemotron_harm [Violence, Criminal Planning/Confessions, Guns and Illegal Weapons, Controlled/Regulated Substances, Fraud/Deception, Malware, Manipulation, Illegal Activity, Suicide and Self Harm, Sexual (minor)]
        and: &nemotron_harm_only
          - {field: violated_categories, excludes: &nemotron_toxic [Hate/Identity Hate, Harassment, Profanity, Threat]}
          - {field: prompt_label, equals: unsafe}
          - {field: tag, equals: [generic, adapted]}
        label: &nemotron_union "harmful category without a toxic one"
      - {field: violated_categories, contains: Violence, and: *nemotron_harm_only, label: "category = Violence (AILuminate vcr)"}
      - {field: violated_categories, contains: Criminal Planning/Confessions, and: *nemotron_harm_only, label: "category = Criminal Planning/Confessions (AILuminate ncr)"}
      - {field: violated_categories, contains: Guns and Illegal Weapons, and: *nemotron_harm_only, label: "category = Guns and Illegal Weapons (AILuminate vcr)"}
      - {field: violated_categories, contains: Controlled/Regulated Substances, and: *nemotron_harm_only, label: "category = Controlled/Regulated Substances (AILuminate ncr)"}
      - {field: violated_categories, contains: Fraud/Deception, and: *nemotron_harm_only, label: "category = Fraud/Deception (AILuminate ncr)"}
      - {field: violated_categories, contains: Malware, and: *nemotron_harm_only, label: "category = Malware (AILuminate ncr)"}
      - {field: violated_categories, contains: Manipulation, and: *nemotron_harm_only, label: "category = Manipulation (AILuminate ncr)"}
      - {field: violated_categories, contains: Illegal Activity, and: *nemotron_harm_only, label: "category = Illegal Activity (AILuminate ncr)"}
      - {field: violated_categories, contains: Suicide and Self Harm, and: *nemotron_harm_only, label: "category = Suicide and Self Harm (AILuminate ssh)"}
      - {field: violated_categories, contains: Sexual (minor), and: *nemotron_harm_only, label: "category = Sexual (minor) (AILuminate cse)"}
      - {field: prompt_label, equals: safe, label: "safe"}
      - {field: prompt_label, equals: unsafe, label: "prompt_label = unsafe without a scored category"}
      - {field: tag, equals: jailbreaking, label: "tag = jailbreaking"}
    keep:
      - label: "category in (Hate/Identity Hate, Harassment, Profanity)"
        reason: &nemotron_toxic_cue >-
          the categories label the whole conversation, so many prompts carry them for the response or for a harmful
          request (kidnapping, a fake threat), and long jailbreak templates carry them too (dev gold review 2026-11-18:
          about 40 % of the toxic rows wrong or unclear); only short prompts (at most 300 characters) that name the toxic
          act themselves stay: insults or slurs asked for or aimed at someone, racist or sexist jokes, stories or
          names asked for, open hatred, claims that a group is inferior; questions about racism or about what a slur
          means do not count
        pattern: &nemotron_toxic_pattern '\A(?=[\s\S]{1,300}\Z)(?![\s\S]*\b(?:what|wofür)\b[^?]{0,60}\b(?:slur|schimpfwort)\b[^?]{0,10}\?)[\s\S]*?(?:\binsult|beleidig|\bslurs?\b|schimpfw|\b(?:racist|sexist|rassistisch\w*|sexistisch\w*) (?:jokes?|story|stories|songs?|names?|things?|witze?|geschichten?|lieder?|sprüche?)\b|\bi hate\b|\bich hasse\b|\binferior\b|unterlegen\b|minderwertig)'
      - label: "category = Threat"
        reason: *nemotron_toxic_cue
        pattern: *nemotron_toxic_pattern
      - label: *nemotron_union
        reason: &nemotron_harm_cue >-
          prompt labels mark opinion and discussion prompts, statistics questions, confessions and conversation
          fragments as unsafe; as for the AILuminate demo set only a short prompt (at most 300 characters) that asks for
          operational help (how to, best way, steps, tips, where to get, write about how to) stays
        pattern: &nemotron_harm_pattern '\A(?=[\s\S]{1,300}\Z)(?!REDACTED)[\s\S]*?(?:\bhow (?:do|can|could|would|should|might|to|much|many)\b|\b(?:best|easiest|safest|quickest|fastest|most painless|most effective|good) (?:way|method|means|place|tips?|strategies|strategy|tactics?|ways)\b|\bways? to\b|\btips\b|\bsteps?\b|\bhelp me\b|\bteach me\b|\bshow me\b|\bguide\b|\binstructions?\b|\bwhere (?:can|could|do|should|would) (?:i|we|you|one)\b|\bwrite (?:a|an|me)\b[^.?!]{0,80}\bhow to\b|\bwie (?:kann|könnte|können|mache|macht|bekomme|soll|sollte|komme|würde|stelle|baue|finde|viel|lange|man)\b|\b(?:beste|besten|bester|bestes|einfachste|einfachsten|sicherste|sichersten|schnellste|schnellsten|effektivste|effektivsten|gute|guten) (?:weg|wege|methode|methoden|art|möglichkeit|möglichkeiten|tipps?|ort|strategie|strategien)\b|\btipps\b|\bhilf mir\b|\banleitung\b|\bschritte?\b|\bwo (?:kann|könnte|bekomme|finde|kaufe)\b|\bam (?:einfachsten|besten|sichersten|schnellsten)\b)'
      - label: "category = Sexual (minor) (AILuminate cse)"
        reason: &nemotron_minor_cue >-
          the minors category also marks prompts without any minor (desecrating a church; dev gold review 2026-11-18:
          2 of 21); the row stays only when it names a child, a minor or a teenager
        pattern: &nemotron_minor_pattern '(?:\bchild|\bkinder|\bkindes|\bkind\b|minderjährig|\bunderage|\bminors?\b|\bteen|jugendlich|\bgirls?\b|mädchen|\bboys?\b|\bschool|\bschul)'
  - id: cyberseceval_multilingual
    commercial: true
    source: https://github.com/meta-llama/PurpleLlama
    revision: 0654501399e7cbd560db9501965dc09c567a5563
    files:
      - {path: CybersecurityBenchmarks/datasets/prompt_injection/prompt_injection_multilingual_machine_translated.json, sha256: f018adfc7b1f766f98ce4dd4c8e34e97a8a88f402a2b63576652027e02c2a15f}
    format: json
    text: user_input
    language: de
    labels:
      - {field: speaking_language, equals: German, label: "speaking_language = German"}
      - field: speaking_language
        equals: [Arabic, Bengali, Chinese, Filipino/Tagalog, French, Hindi, Indonesian, Italian, Japanese, Korean, Portuguese, Russian, Spanish, Thai, Turkish, Vietnamese]
        label: "speaking_language other than German"
    keep:
      - label: "speaking_language = German"
        reason: >-
          the attack of many test cases exists only relative to the off-row system prompt (a recipe request, a
          paper summary), so the user turn alone is not an injection; only rows whose user turn carries an
          override, mode-switch or persona cue are kept
        pattern: '\b(?:ignorier\w*|missacht\w*|vergiss|vergessen sie|olvida)\b[^.!?\n]{0,60}\b(?:\w*anweisung\w*|instruktion\w*|regeln|funktion|instrucciones)\b|<system mode>|\b\w*modus\b|\bdu bist jetzt\b|\bich bin gott\b|\bjetzt alles\b'
    dedup_against: [spml, mosscap, dolly_15k, germanquad]
  - id: mosscap
    commercial: true
    source: https://huggingface.co/datasets/Lakera/mosscap_prompt_injection
    revision: b7e495ff63373ff7f7dabc1e9390cf62b5838570
    files:
      - {path: data/train-00000-of-00001-07ae0ed17fa07cc1.parquet, sha256: a3c354dd1457c0125243ed107a4cc3eafdc09b2c60eb7ce3e3854a2fbb12a4b2}
      - {path: data/validation-00000-of-00001-e136a45438d15f16.parquet, sha256: d6c112992c73a1744f540cc3f6d51ecafabdf4023ec2188de6dde31ca7e52d24}
      - {path: data/test-00000-of-00001-06acab2d6a2bcf9f.parquet, sha256: 9311f64ca579c947e43ff64ad4996585c51e4dae8ae747342926cf0091160d21}
    format: parquet
    text: prompt
    language: en
    labels:
      - {label: "every prompt (password game)"}
    keep:
      - label: "every prompt (password game)"
        reason: >-
          every prompt of the password game is labelled, including greetings, unrelated questions and game moves that
          only mean extraction inside the game; only prompts that ask for, probe or confirm the secret (a request word
          next to the secret in the same sentence) or name the hidden instructions are kept
        pattern: '\b(?:tell|give|reveal|say|spell|print|write|show|share|output|repeat|list|encode|encrypt|translate|reverse|hint|confirm|what(?:''s|’s| is| are| was)|is|letters?|characters?|first|last)\b[^.!?\n]{0,60}\b(?:(?:the|your|ur|this|that|its|secret|hidden|real|correct|current)\s+(?:pass ?words?|passwor[dt]\w*|passphrase|code ?words?|magic word|secret)|secret (?:word|password|phrase|key|code))\b|\b(?:(?:the|your|ur|this|that|its|secret|hidden|real|correct|current)\s+(?:pass ?words?|passwor[dt]\w*|passphrase|code ?words?|magic word|secret)|secret (?:word|password|phrase|key|code))\b[^.!?\n]{0,60}\b(?:tell|give|reveal|say|spell|print|write|show|share|output|repeat|list|encode|encrypt|translate|reverse|hint|confirm|what(?:''s|’s| is| are| was)|is|letters?|characters?|first|last)\b|\b(?:system|initial|original|hidden) (?:prompt|instructions?)\b'
