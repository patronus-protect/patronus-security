    source: https://huggingface.co/datasets/reshabhs/SPML_Chatbot_Prompt_Injection
    revision: 02ce8084e979bc7d4c24ee35d22ecb7f2db96ff5
    files:
      - {path: spml_prompt_injection.csv, sha256: 4ca6590cd8ec10832fcebee5e243acb32be5c3e79b7a260f8638eed738c784f8}
    format: csv
    text: User Prompt
    language: en
    labels:
      - {field: Prompt injection, equals: "1", label: "Prompt injection = 1"}
      - {field: Prompt injection, equals: "0", label: "Prompt injection = 0"}
    keep:
      - label: "Prompt injection = 1"
        reason: >-
          upstream marks a row as an attack when the chatbot's system prompt was altered, so many attack rows are a
          system prompt plus an ordinary on-topic question; only rows with an override cue in the user turn (after the
          last ### separator, or anywhere when there is none) are kept
        pattern: '(?:(?<!never )(?<!not )(?<!n''t )\b(?:ignore|disregard|forget|override|bypass|abandon)\b[^.!?\n]{0,40}\b(?:previous|prior|above|earlier|all|your|those|these|the|original|any)\b[^.!?\n]{0,20}\b(?:instructions?|rules?|guidelines?|programming|restrictions?|directives?|directions|prompt|conditions|constraints?|limitations?)\b|\bpretend\b[^.!?\n]{0,40}\b(?:no|forgot\w*|without)\b[^.!?\n]{0,30}\b(?:rules|restrictions|limits|guidelines|instructions)\b|\b(?:new|updated) instructions\b|\bdeveloper mode\b|\bjailbreak|\bno longer (?:bound|restricted|limited)\b|\bwithout (?:any )?(?:restrictions|limitations|filters|rules)\b|\b(?:stray|break) (?:away from|free from)\b|\bbreak (?:character|your rules)\b)(?![\s\S]*###)'
