  - id: agent_safetybench
    commercial: true
    # The 2,000 released cases. Only the unfulfillable harmful-code cases that the agent fails by writing the code
    # itself (failure mode 1) are scored, and of those only the requests that name the harmful act (keep); the
    # fulfillable code cases are hard negatives. Every other case keeps its risk in the tool environment.
    source: https://github.com/thu-coai/Agent-SafetyBench
    revision: 74feea8de601b3a1449a93fcf70017fe61556f73
    files:
      - {path: data/released_data.json, sha256: 59dd0333001ef767766d803e97086ec02af0fbf7ff1f7070b3797863b0dacbe2}
    format: json
    text: instruction
    language: en
    labels:
      - field: risks
        contains: Contribute to harmful / vulnerable code
        and: [{field: fulfillable, equals: 0}, {field: failure_modes, contains: "1"}]
        label: "risk = Contribute to harmful / vulnerable code, fulfillable = 0, failure mode 1"
      - field: risks
        contains: Contribute to harmful / vulnerable code
        and: [{field: fulfillable, equals: 0}, {field: failure_modes, excludes: "1"}]
        label: "risk = Contribute to harmful / vulnerable code, fulfillable = 0, other failure modes"
      - field: risks
        contains: Contribute to harmful / vulnerable code
        and: [{field: fulfillable, equals: 1}]
        label: "risk = Contribute to harmful / vulnerable code, fulfillable = 1"
      - {field: risks, excludes: Contribute to harmful / vulnerable code, label: "every other risk"}
    keep:
      - label: "risk = Contribute to harmful / vulnerable code, fulfillable = 0, failure mode 1"
        reason: >-
          the group mixes requests that name the harmful act (bypass or disable authentication or security checks, a
          backdoor or reverse shell, cracking or brute-forcing passwords, logging keystrokes or passwords, opening every
          port to any address, world-writable permissions) with requests that read harmless on their own (a login
          form, a backup script, a model on age and ZIP code); only the former carry the risk in the instruction
          (dev gold review 2026-11-18)
        pattern: 'bypass|\bwithout (?:any |the |their |identi\w* |security |encryption |authenti\w* )*(?:security|authenti|identi|encryption|verification|checking|awareness)|\bdisabl\w* (?:all |the |some )?(?:security|firewall)|\bturn off the security|\bcrack|brute ?force|backdoor|reverse.shell|ransomware|keystroke|keypress|webshell|id_rsa|/etc/passwd|rm -rf|\b777\b|allow (?:all|any) incoming|from any external|\ball ports|unrestricted access|secretly|(?:log|print|fetch|retriev|share|monitor|captur|tag)\w* (?:[\w'']+ ){0,5}passwords?\b|(?:stor|sav|keep)\w* (?:[\w'']+ ){0,4}passwords?\b[^.?!]{0,40}\bplain ?text|\bplain ?text file\b[^.?!]{0,80}\bpasswords?\b|secret api keys|administrative privileges to any|default credentials|cancel the password|skips? user login|deletes? the original|executing any scripts|scrape personal data|without too many security|security (?:strateg|protocol|check|warning|setting|feature|limitation)'
