  - id: nemotron_content_safety_v2
    commercial: true
    # Training split (reported only): the test and validation splits are the English test and validation prompts of
    # nemotron_safety_v3 (dropped against it below); the text is the user prompt, labels as there.
    source: https://huggingface.co/datasets/nvidia/Aegis-AI-Content-Safety-Dataset-2.0
    revision: d86bb8bedff51d25ac834ab7838f1cc61acb7a2c
    files:
      - {path: train.json, sha256: 154fba82c71d9fa73abd2ca5588a198e693ddc816c83444df180a22f613e02f6}
    format: json
    text: prompt
    language: en
    labels:
      - field: violated_categories
        contains: *nemotron_harm
        and: &aegis_harm_only
          - {field: violated_categories, excludes: *nemotron_toxic}
          - {field: prompt_label, equals: unsafe}
          - {field: prompt_label_source, equals: human}
        label: *nemotron_union
      - {field: violated_categories, contains: Violence, and: *aegis_harm_only, label: "category = Violence (AILuminate vcr)"}
      - {field: violated_categories, contains: Criminal Planning/Confessions, and: *aegis_harm_only, label: "category = Criminal Planning/Confessions (AILuminate ncr)"}
      - {field: violated_categories, contains: Guns and Illegal Weapons, and: *aegis_harm_only, label: "category = Guns and Illegal Weapons (AILuminate vcr)"}
      - {field: violated_categories, contains: Controlled/Regulated Substances, and: *aegis_harm_only, label: "category = Controlled/Regulated Substances (AILuminate ncr)"}
      - {field: violated_categories, contains: Fraud/Deception, and: *aegis_harm_only, label: "category = Fraud/Deception (AILuminate ncr)"}
      - {field: violated_categories, contains: Malware, and: *aegis_harm_only, label: "category = Malware (AILuminate ncr)"}
      - {field: violated_categories, contains: Manipulation, and: *aegis_harm_only, label: "category = Manipulation (AILuminate ncr)"}
      - {field: violated_categories, contains: Illegal Activity, and: *aegis_harm_only, label: "category = Illegal Activity (AILuminate ncr)"}
      - {field: violated_categories, contains: Suicide and Self Harm, and: *aegis_harm_only, label: "category = Suicide and Self Harm (AILuminate ssh)"}
      - {field: violated_categories, contains: Sexual (minor), and: *aegis_harm_only, label: "category = Sexual (minor) (AILuminate cse)"}
      - {label: "every prompt"}
    keep:
      - {label: *nemotron_union, reason: *nemotron_harm_cue, pattern: *nemotron_harm_pattern}
      - {label: "category = Sexual (minor) (AILuminate cse)", reason: *nemotron_minor_cue, pattern: *nemotron_minor_pattern}
    dedup_against: [nemotron_safety_v3]
    cap: 1500
