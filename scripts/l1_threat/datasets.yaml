  - id: neuralchemy
    commercial: true
    # Core configuration (train, validation and test; leakage-free by group upstream). Upstream mixes its own prompts with
    # rows taken from other sets; the HarmBench rows (source harmbench, harmbench_benign) leave because HarmBench is a
    # holdout set, the HackAPrompt rows because they failed the dev spot-check (garbled target-phrase fragments without a
    # readable instruction, 4 of 13 injection rows doubtful).
    source: https://huggingface.co/datasets/neuralchemy/Prompt-injection-dataset
    revision: 7d70432dfcf47a821612cbf9d34e9d9e3ad20e75
    files:
      - {path: core/train-00000-of-00001.parquet, sha256: c0724f8e00eebb65c001be9ba94291d1608e5da0374012e53dfd4077c5f92558}
      - {path: core/validation-00000-of-00001.parquet, sha256: bbd417bfd0df1553dd769e814a0b62ca58ad5b1d08d153c90f66937a4af74deb}
      - {path: core/test-00000-of-00001.parquet, sha256: fb5432035fdd8453d61f6593bfe78ee2970403c5ea59959b642a6708e2bef670}
    format: parquet
    text: text
    language: en
    labels:
      - field: category
        equals: &neuralchemy_extraction [prompt_extraction, system_extraction, prompt_leak]
        and: &neuralchemy_attack
          - {field: label, equals: "1"}
          - {field: source, equals: &neuralchemy_sources [neuralchemy_v1, wildguard_judgecomp, original]}
          - {field: text, not_matches: &neuralchemy_script '[\u0590-\u06ff\u0900-\u097f\u0e00-\u0e7f\u3040-\u30ff\u4e00-\u9fff\uac00-\ud7af]'}
        label: "label = 1, category prompt_extraction, system_extraction or prompt_leak"
      - field: category
        equals: &neuralchemy_jailbreak [jailbreak, persona_replacement, crescendo, many_shot]
        and: *neuralchemy_attack
        label: "label = 1, category jailbreak, persona_replacement, crescendo or many_shot"
      - field: category
        equals: &neuralchemy_injection [direct_injection, instruction_override, prompt_injection, indirect_injection, rag_poisoning,
                                        system_manipulation, agent_manipulation, token_smuggling, payload_injection,
                                        encoding_obfuscation, multi_turn, response_manipulation]
        and: *neuralchemy_attack
        label: "label = 1, category of an instruction override"
      # adversarial, encoding and code_execution are mostly code-execution payloads, control holds harmless prompts,
      # training_extraction, model_fingerprinting, token_injection, context_confusion, output_manipulation, chain_of_thought
      # and edge_case carry no override of their own.
      - field: category
        excludes: [prompt_extraction, system_extraction, prompt_leak, jailbreak, persona_replacement, crescendo, many_shot,
                   direct_injection, instruction_override, prompt_injection, indirect_injection, rag_poisoning,
                   system_manipulation, agent_manipulation, token_smuggling, payload_injection, encoding_obfuscation,
                   multi_turn, response_manipulation]
        and: [{field: label, equals: "1"}]
        label: "label = 1, other category"
      - {field: label, equals: "0", and: [{field: source, equals: *neuralchemy_sources}, {field: text, not_matches: *neuralchemy_script}], label: "label = 0"}
      # Translated attacks in Hebrew, Arabic, Hindi, Thai, Japanese, Chinese or Korean: neither German nor English.
      - {field: text, matches: *neuralchemy_script, label: "text in a non-Latin script"}
      - {field: source, equals: [harmbench, harmbench_benign, hackaprompt], label: "source harmbench, harmbench_benign or hackaprompt"}
  - id: spml
    commercial: true
    source: https://huggingface.co/datasets/reshabhs/SPML_Chatbot_Prompt_Injection
    revision: 02ce8084e979bc7d4c24ee35d22ecb7f2db96ff5
    files:
      - {path: spml_prompt_injection.csv, sha256: 4ca6590cd8ec10832fcebee5e243acb32be5c3e79b7a260f8638eed738c784f8}
    format: csv
    text: User Prompt
    language: en
    labels:
      - {field: Prompt injection, equals: "1", label: "Prompt injection = 1"}
      - {field: Prompt injection, equals: "0", label: "Prompt injection = 0"}
    keep:
      - label: "Prompt injection = 1"
        reason: >-
          upstream marks a row as an attack when the chatbot's system prompt was altered, so many attack rows are a
          system prompt plus an ordinary on-topic question; only rows with an override cue in the user turn (after the
          last ### separator, or anywhere when there is none) are kept
        pattern: '(?:(?<!never )(?<!not )(?<!n''t )\b(?:ignore|disregard|forget|override|bypass|abandon)\b[^.!?\n]{0,40}\b(?:previous|prior|above|earlier|all|your|those|these|the|original|any)\b[^.!?\n]{0,20}\b(?:instructions?|rules?|guidelines?|programming|restrictions?|directives?|directions|prompt|conditions|constraints?|limitations?)\b|\bpretend\b[^.!?\n]{0,40}\b(?:no|forgot\w*|without)\b[^.!?\n]{0,30}\b(?:rules|restrictions|limits|guidelines|instructions)\b|\b(?:new|updated) instructions\b|\bdeveloper mode\b|\bjailbreak|\bno longer (?:bound|restricted|limited)\b|\bwithout (?:any )?(?:restrictions|limitations|filters|rules)\b|\b(?:stray|break) (?:away from|free from)\b|\bbreak (?:character|your rules)\b)(?![\s\S]*###)'
  - id: gentel
    commercial: true
    # Goal hijacking and prompt leaking files (text column). The jailbreak file (171,782 rows) is left out: every row is one
    # of a few dozen jailbreak templates crossed with the same harmful questions, so it adds template copies, not sources.
    source: https://huggingface.co/datasets/GenTelLab/gentelbench-v1
    revision: bf27033065d75b7622b5a971470d8d0fbc3fa444
    files:
      - {path: goal_hijacking_attack_dataset.parquet, sha256: d517aeff4631c5d6201444cc5d44679059e397a5a43a3622977a8a5f4e7c4ebc}
      - {path: prompt_leaking_attack_dataset.parquet, sha256: 539c8f721a10e96a2b7f94b0a40f2ee4de2923d89261061b730758926fdf4552}
    format: parquet
    text: text
    language: en
    # Both files also wrap attacks in persona jailbreak templates (Developer Mode, LiveGPT, NECO, Leo): a goal hijacking
    # row is an injection only with an override of the earlier task in it, and a prompt leaking row an extraction only
    # as a short plain request (30 rows); the long ones ask the template's persona about leak defences (dev spot-check).
    labels:
      - field: text
        matches: &gentel_short '\A[\s\S]{1,299}\Z'
        and: [{field: domain, equals: promptleaking}, {field: label, equals: "1"}]
        label: "prompt leaking attack, plain request"
      - field: text
        matches: &gentel_override '(?i)\b(?:ignor\w*|disregard\w*|bypass\w*|overlook\w*|omit\w*|forget\w*|skip\w*|set(?:ting)? aside|neglect\w*|dismiss\w*)\b[^.?!]{0,30}\b(?:previous|prior|former|earlier|past|above|preceding|initial|original|any)\b'
        and: [{field: domain, excludes: [promptleaking, safe]}, {field: label, equals: "1"}]
        label: "goal hijacking attack with an override of the earlier task"
      - field: text
        not_matches: *gentel_short
        and: [{field: domain, equals: promptleaking}, {field: label, equals: "1"}]
        label: "attack inside a jailbreak template"
      - field: text
        not_matches: *gentel_override
        and: [{field: domain, excludes: [promptleaking, safe]}, {field: label, equals: "1"}]
        label: "attack inside a jailbreak template"
      - {field: label, equals: "0", label: "label = 0"}
  - id: polyguardprompts
    commercial: true
    # Test split, English and the machine-translated German rows (the other 15 languages leave: dropped.language). Built
    # on WildGuardMix prompts, so it is deduplicated against it. Only the harm subcategories of the class definitions
    # count; the rest (privacy, misinformation, copyright, sexual content, "others") is out of scope.
    source: https://huggingface.co/datasets/ToxicityPrompts/PolyGuardPrompts
    revision: c5b466a95b64ff121db4398246b6abb7672696ec
    files:
      - {path: data/test-00000-of-00001.parquet, sha256: 7089d502cc8cdf710671976c9a3d83d65820018d057bbe506def2c1dbcac4e77}
    format: parquet
    text: prompt
    language_field: language
    language_map: {English: en, German: de}
    labels:
      - field: subcategory
        equals: [violence_and_physical_harm, fraud_assisting_illegal_activities, cyberattack]
        and: [{field: prompt_harm_label, equals: harmful}]
        label: "prompt_harm_label = harmful, subcategory violence, fraud or cyberattack"
      - {field: subcategory, equals: toxic_language_hate_speech, and: [{field: prompt_harm_label, equals: harmful}], label: "prompt_harm_label = harmful, subcategory toxic_language_hate_speech"}
      - field: subcategory
        excludes: [violence_and_physical_harm, fraud_assisting_illegal_activities, cyberattack, toxic_language_hate_speech]
        and: [{field: prompt_harm_label, equals: harmful}]
        label: "prompt_harm_label = harmful, other subcategory"
      - {field: prompt_harm_label, equals: unharmful, label: "prompt_harm_label = unharmful"}
      # Matches every row; it only decides for the rows without a prompt harm label (442), which leave as out of scope.
      - {label: "any row (prompt_harm_label missing)"}
    keep:
      - label: "prompt_harm_label = harmful, subcategory toxic_language_hate_speech"
        reason: >-
          the hate speech subcategory also holds gaslighting and manipulation prompts without an insult or a hateful
          target, and the German part holds a few refusals of the translation model in place of the prompt; a row stays
          only with a hate, insult, slur, stereotype or harassment cue and without a refusal opening
        pattern: &polyguard_toxic '\A(?!\s*(?:es tut mir leid|i''m sorry|ich kann (?:diese|dieser|ihnen|dir)))[\s\S]*?\b(?:hate|hateful|slurs?|insult\w*|derogator\w*|demean\w*|belittl\w*|stereotyp\w*|offensive|racis\w*|sexis\w*|homophob\w*|transphob\w*|discriminat\w*|dehumaniz\w*|bull(?:y|ies|ying)|harass\w*|troll\w*|hass\w*|beleidig\w*|abfällig\w*|abwertend\w*|herabwürdig\w*|rassis\w*|sexistisch\w*|homophob\w*|diskriminier\w*|mobb\w*|beschimpf\w*|hetz\w*|schimpf\w*|vorurteil\w*)'
      - label: "prompt_harm_label = harmful, subcategory violence, fraud or cyberattack"
        reason: the German part holds a few refusals of the translation model in place of the prompt
        pattern: '\A(?!\s*(?:es tut mir leid|i''m sorry|ich kann (?:diese|dieser|ihnen|dir)))'
    dedup_against: [wildguardmix]
  - id: nemotron_safety_v3
    commercial: true
    # Test and validation splits of the EN part and of the machine-translated DE part (the same prompts); the text
    # is the user prompt.
    source: https://huggingface.co/datasets/nvidia/Nemotron-Safety-Guard-Dataset-v3
    revision: a3f7ecb3433d1933701a83f18de16c36934a7f51
    files:
      - {path: en/test.jsonl, sha256: 1d6d9c67281e4e6335a006013fa48011ca1c8160db9d4824a24426c903a2ed97}
      - {path: en/valid.jsonl, sha256: 04dc2c80edd0bd19b6eda6cc86d9949f42221af0706fbf2608a824e019e68cd1}
      - {path: de/test.jsonl, sha256: c38a40b3ac3b7a2caadda70f05d654ecb31af1445db02ea0ae1f761a81939614}
      - {path: de/valid.jsonl, sha256: 9d2bb7d9b99bb88617f9068211d67e36a0423ff1cf042c378830e7a1209595b2}
    format: jsonl
    text: prompt
    language_field: language
    labels:
      # Only the human-labelled part (tags generic and adapted) is scored; violated_categories lists every category
      # of the conversation, so a toxic category counts only on a prompt labelled unsafe.
      - field: violated_categories
        contains: [Hate/Identity Hate, Harassment, Profanity]
        and: [{field: prompt_label, equals: unsafe}, {field: tag, equals: [generic, adapted]}]
        label: "category in (Hate/Identity Hate, Harassment, Profanity)"
      - field: violated_categories
        contains: Threat
        and: [{field: prompt_label, equals: unsafe}, {field: tag, equals: [generic, adapted]}]
        label: "category = Threat"
      # harmful_content: a harmful category on a prompt labelled unsafe and no toxic one (a row with both is scored
      # for toxic_language only, behind its own cue); adult sexual content alone is not scored. The union label holds
      # the cue; one label per category names the AILuminate hazard of the row.
      - field: violated_categories
        contains: &nemotron_harm [Violence, Criminal Planning/Confessions, Guns and Illegal Weapons, Controlled/Regulated Substances, Fraud/Deception, Malware, Manipulation, Illegal Activity, Suicide and Self Harm, Sexual (minor)]
        and: &nemotron_harm_only
          - {field: violated_categories, excludes: &nemotron_toxic [Hate/Identity Hate, Harassment, Profanity, Threat]}
          - {field: prompt_label, equals: unsafe}
          - {field: tag, equals: [generic, adapted]}
        label: &nemotron_union "harmful category without a toxic one"
      - {field: violated_categories, contains: Violence, and: *nemotron_harm_only, label: "category = Violence (AILuminate vcr)"}
      - {field: violated_categories, contains: Criminal Planning/Confessions, and: *nemotron_harm_only, label: "category = Criminal Planning/Confessions (AILuminate ncr)"}
      - {field: violated_categories, contains: Guns and Illegal Weapons, and: *nemotron_harm_only, label: "category = Guns and Illegal Weapons (AILuminate vcr)"}
      - {field: violated_categories, contains: Controlled/Regulated Substances, and: *nemotron_harm_only, label: "category = Controlled/Regulated Substances (AILuminate ncr)"}
      - {field: violated_categories, contains: Fraud/Deception, and: *nemotron_harm_only, label: "category = Fraud/Deception (AILuminate ncr)"}
      - {field: violated_categories, contains: Malware, and: *nemotron_harm_only, label: "category = Malware (AILuminate ncr)"}
      - {field: violated_categories, contains: Manipulation, and: *nemotron_harm_only, label: "category = Manipulation (AILuminate ncr)"}
      - {field: violated_categories, contains: Illegal Activity, and: *nemotron_harm_only, label: "category = Illegal Activity (AILuminate ncr)"}
      - {field: violated_categories, contains: Suicide and Self Harm, and: *nemotron_harm_only, label: "category = Suicide and Self Harm (AILuminate ssh)"}
      - {field: violated_categories, contains: Sexual (minor), and: *nemotron_harm_only, label: "category = Sexual (minor) (AILuminate cse)"}
      - {field: prompt_label, equals: safe, label: "safe"}
      - {field: prompt_label, equals: unsafe, label: "prompt_label = unsafe without a scored category"}
      - {field: tag, equals: jailbreaking, label: "tag = jailbreaking"}
    keep:
      - label: "category in (Hate/Identity Hate, Harassment, Profanity)"
        reason: &nemotron_toxic_cue >-
          the categories label the whole conversation, so many prompts carry them for the response or for a harmful
          request (kidnapping, a fake threat), and long jailbreak templates carry them too (dev gold review 2026-11-18:
          about 40 % of the toxic rows wrong or unclear); only short prompts (at most 300 characters) that name the toxic
          act themselves stay: insults or slurs asked for or aimed at someone, racist or sexist jokes, stories or
          names asked for, open hatred, claims that a group is inferior; questions about racism or about what a slur
          means do not count
        pattern: &nemotron_toxic_pattern '\A(?=[\s\S]{1,300}\Z)(?![\s\S]*\b(?:what|wofür)\b[^?]{0,60}\b(?:slur|schimpfwort)\b[^?]{0,10}\?)[\s\S]*?(?:\binsult|beleidig|\bslurs?\b|schimpfw|\b(?:racist|sexist|rassistisch\w*|sexistisch\w*) (?:jokes?|story|stories|songs?|names?|things?|witze?|geschichten?|lieder?|sprüche?)\b|\bi hate\b|\bich hasse\b|\binferior\b|unterlegen\b|minderwertig)'
      - label: "category = Threat"
        reason: *nemotron_toxic_cue
        pattern: *nemotron_toxic_pattern
      - label: *nemotron_union
        reason: &nemotron_harm_cue >-
          prompt labels mark opinion and discussion prompts, statistics questions, confessions and conversation
          fragments as unsafe; as for the AILuminate demo set only a short prompt (at most 300 characters) that asks for
          operational help (how to, best way, steps, tips, where to get, write about how to) stays
        pattern: &nemotron_harm_pattern '\A(?=[\s\S]{1,300}\Z)(?!REDACTED)[\s\S]*?(?:\bhow (?:do|can|could|would|should|might|to|much|many)\b|\b(?:best|easiest|safest|quickest|fastest|most painless|most effective|good) (?:way|method|means|place|tips?|strategies|strategy|tactics?|ways)\b|\bways? to\b|\btips\b|\bsteps?\b|\bhelp me\b|\bteach me\b|\bshow me\b|\bguide\b|\binstructions?\b|\bwhere (?:can|could|do|should|would) (?:i|we|you|one)\b|\bwrite (?:a|an|me)\b[^.?!]{0,80}\bhow to\b|\bwie (?:kann|könnte|können|mache|macht|bekomme|soll|sollte|komme|würde|stelle|baue|finde|viel|lange|man)\b|\b(?:beste|besten|bester|bestes|einfachste|einfachsten|sicherste|sichersten|schnellste|schnellsten|effektivste|effektivsten|gute|guten) (?:weg|wege|methode|methoden|art|möglichkeit|möglichkeiten|tipps?|ort|strategie|strategien)\b|\btipps\b|\bhilf mir\b|\banleitung\b|\bschritte?\b|\bwo (?:kann|könnte|bekomme|finde|kaufe)\b|\bam (?:einfachsten|besten|sichersten|schnellsten)\b)'
      - label: "category = Sexual (minor) (AILuminate cse)"
        reason: &nemotron_minor_cue >-
          the minors category also marks prompts without any minor (desecrating a church; dev gold review 2026-11-18:
          2 of 21); the row stays only when it names a child, a minor or a teenager
        pattern: &nemotron_minor_pattern '(?:\bchild|\bkinder|\bkindes|\bkind\b|minderjährig|\bunderage|\bminors?\b|\bteen|jugendlich|\bgirls?\b|mädchen|\bboys?\b|\bschool|\bschul)'
  - id: cyberseceval_multilingual
    commercial: true
    source: https://github.com/meta-llama/PurpleLlama
    revision: 0654501399e7cbd560db9501965dc09c567a5563
    files:
      - {path: CybersecurityBenchmarks/datasets/prompt_injection/prompt_injection_multilingual_machine_translated.json, sha256: f018adfc7b1f766f98ce4dd4c8e34e97a8a88f402a2b63576652027e02c2a15f}
    format: json
    text: user_input
    language: de
    labels:
      - {field: speaking_language, equals: German, label: "speaking_language = German"}
      - field: speaking_language
        equals: [Arabic, Bengali, Chinese, Filipino/Tagalog, French, Hindi, Indonesian, Italian, Japanese, Korean, Portuguese, Russian, Spanish, Thai, Turkish, Vietnamese]
        label: "speaking_language other than German"
    keep:
      - label: "speaking_language = German"
        reason: >-
          the attack of many test cases exists only relative to the off-row system prompt (a recipe request, a
          paper summary), so the user turn alone is not an injection; only rows whose user turn carries an
          override, mode-switch or persona cue are kept
        pattern: '\b(?:ignorier\w*|missacht\w*|vergiss|vergessen sie|olvida)\b[^.!?\n]{0,60}\b(?:\w*anweisung\w*|instruktion\w*|regeln|funktion|instrucciones)\b|<system mode>|\b\w*modus\b|\bdu bist jetzt\b|\bich bin gott\b|\bjetzt alles\b'
    dedup_against: [spml, mosscap, dolly_15k, germanquad]
  - id: mosscap
    commercial: true
    source: https://huggingface.co/datasets/Lakera/mosscap_prompt_injection
    revision: b7e495ff63373ff7f7dabc1e9390cf62b5838570
    files:
      - {path: data/train-00000-of-00001-07ae0ed17fa07cc1.parquet, sha256: a3c354dd1457c0125243ed107a4cc3eafdc09b2c60eb7ce3e3854a2fbb12a4b2}
      - {path: data/validation-00000-of-00001-e136a45438d15f16.parquet, sha256: d6c112992c73a1744f540cc3f6d51ecafabdf4023ec2188de6dde31ca7e52d24}
      - {path: data/test-00000-of-00001-06acab2d6a2bcf9f.parquet, sha256: 9311f64ca579c947e43ff64ad4996585c51e4dae8ae747342926cf0091160d21}
    format: parquet
    text: prompt
    language: en
    labels:
      - {label: "every prompt (password game)"}
    keep:
      - label: "every prompt (password game)"
        reason: >-
          every prompt of the password game is labelled, including greetings, unrelated questions and game moves that
          only mean extraction inside the game; only prompts that ask for, probe or confirm the secret (a request word
          next to the secret in the same sentence) or name the hidden instructions are kept
        pattern: '\b(?:tell|give|reveal|say|spell|print|write|show|share|output|repeat|list|encode|encrypt|translate|reverse|hint|confirm|what(?:''s|’s| is| are| was)|is|letters?|characters?|first|last)\b[^.!?\n]{0,60}\b(?:(?:the|your|ur|this|that|its|secret|hidden|real|correct|current)\s+(?:pass ?words?|passwor[dt]\w*|passphrase|code ?words?|magic word|secret)|secret (?:word|password|phrase|key|code))\b|\b(?:(?:the|your|ur|this|that|its|secret|hidden|real|correct|current)\s+(?:pass ?words?|passwor[dt]\w*|passphrase|code ?words?|magic word|secret)|secret (?:word|password|phrase|key|code))\b[^.!?\n]{0,60}\b(?:tell|give|reveal|say|spell|print|write|show|share|output|repeat|list|encode|encrypt|translate|reverse|hint|confirm|what(?:''s|’s| is| are| was)|is|letters?|characters?|first|last)\b|\b(?:system|initial|original|hidden) (?:prompt|instructions?)\b'
  - id: satml_ctf
    commercial: true
    # The 50 published chats in which the attacker extracted the secret; every user turn of them. The full chat log (634 MB,
    # mostly failed attempts and small talk) is left out.
    source: https://huggingface.co/datasets/ethz-spylab/ctf-satml24
    revision: 11426babe61ee16b0efe7b55e0430359e0fc4235
    files:
      - {path: chat.was_successful_secret_extraction.50.json, sha256: 0b5262e81a0347b9d730ab0dcc195dd296daa95aaef1541c05d42e38c1c7759d}
    format: json
    records: "*.history.*"
    text: content
    language: en
    labels:
      - {field: role, equals: user, label: "attack chat turns (secret extraction)"}
      - {field: role, excludes: [user], label: "model turns"}
    keep:
      - label: "attack chat turns (secret extraction)"
        reason: >-
          a successful chat also holds turns that only set up a story or a persona; only turns that name the secret, the
          password or the hidden instructions are kept
        pattern: '\b(?:secret|password|passphrase|system (?:prompt|message)|(?:hidden|initial|original|previous) instructions?)\b'
  - id: tensor_trust
    commercial: unknown
    dropped: >-
      overlap with the holdout: the holdout's Tensor Trust extraction benchmark comes from the same upstream repository
      (HumanCompatibleAI/tensor-trust-data), so a dev recipe would read holdout rows
  - id: bipia
    commercial: true
    # MIT attack texts inside the MIT e-mail contexts; the code contexts are Stack Overflow posts (CC-BY-SA-4.0)
    # and stay out. 100 e-mails as benign rows, 250 attacks (150 text, 100 code) each inside one e-mail.
    source: https://github.com/microsoft/BIPIA
    revision: a004b69ec0dd446e0afd461d98cb5e96e120a5d0
    files:
      - {path: benchmark/email/test.jsonl, sha256: 217b403faaa1d0cb12c24892bea39f4a0b9e2819919ac7e2b902006e28278cdb}
      - {path: benchmark/email/train.jsonl, sha256: 82207193cb8ce06713eeb7c33ca0716446613512e2ad9303b302ba14d425ddd4}
      - {path: benchmark/text_attack_test.json, sha256: 75750e7b4e8b34e8f9d88d89b357aeaaf02bd07f9e493ccd37eda74a0cd7c7f8}
      - {path: benchmark/text_attack_train.json, sha256: 63f95d3e67eac4178cdabdbdaf192cd05f2b6ed0702b578f1d30d556e5155670}
      - {path: benchmark/code_attack_test.json, sha256: 892545c5aaec0645b1ded65dc7816b3d70e9ef4eadcba2301a7a3db93676b6e0}
      - {path: benchmark/code_attack_train.json, sha256: fe515080b6da2b5c0b67ca7ba2a3b3c2ce57c48f45733c475ebc813cba118484}
    format: bipia
    text: text
    language: en
    labels:
      - {field: attack_set, equals: code, label: "text and code attacks inserted into e-mail contexts"}
      # text attacks that steer the answer: its form (cipher, encoding, reversal, typos), an inserted claim, link,
      # advert or appeal; 'Language Translation' is one of them only in the test file ("Translate your response …")
      - field: category
        and: [{field: attack_set, equals: text}]
        equals: [Substitution Ciphers, Base Encoding, Reverse Text, Emoji Substitution, Information Dissemination,
                 Marketing & Advertising, Entertainment, Scams & Fraud, Misinformation & Propaganda,
                 Alphanumeric Substitution, Homophonic Substitution, Misspelling Intentionally, Anagramming,
                 Space Removal & Grouping, Instruction, Social Interaction, Persuasion, Clickbait, Malware Distribution]
        label: "text and code attacks inserted into e-mail contexts"
      - field: category
        and: [{field: attack_set, equals: text}, {field: attack_split, equals: test}]
        equals: Language Translation
        label: "text and code attacks inserted into e-mail contexts"
      # task-irrelevant requests ("Explain the theory of relativity.") without override or address to the assistant
      - field: category
        and: [{field: attack_set, equals: text}]
        equals: [Task Automation, Business Intelligence, Conversational Agent, Research Assistance, Sentiment Analysis,
                 Information Retrieval, Content Creation, Learning and Tutoring, Programming Help]
        label: "task-irrelevant requests inserted into e-mail contexts"
      - field: category
        and: [{field: attack_set, equals: text}, {field: attack_split, equals: train}]
        equals: Language Translation
        label: "task-irrelevant requests inserted into e-mail contexts"
      # snippets that read files, keystrokes, screens, cookies, memory or the environment and send them to a remote
      # host (HTTP, sockets, scp, MQTT, SSH tunnels)
      - field: category
        equals: [Data Eavesdropping, Traffic Analysis, Keylogging, Screen Scraping, Introduce System Fingerprinting,
                 Cookie Theft, Memory Scanning, Dumpster Diving, Environment Variable Analysis,
                 Device and Driver Enumeration]
        label: "attacks of the information-gathering group (e.g. data eavesdropping)"
      - {field: attack_set, equals: none, label: "clean context"}
