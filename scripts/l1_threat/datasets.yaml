# L1 threat dataset registry (E01): how prepare_corpora.py fetches and reads every dataset of
# entity_map.yaml. Nothing here is data; rows are fetched at evaluation time only and never committed.
#
# Licence, languages, split, source family and the meaning of every upstream label stay in
# entity_map.yaml; this file only adds what fetching needs. The role of a set is derived, not stored:
#   decisive  holdout set of a deciding family (neutral, ark_blind) that may be used commercially
#   dev       train_dev set (tuning, training, lexicon mining)
#   report    everything else (report split, ark_authored, baseline_trained, report_only,
#             commercial: false); reported, never decides
#
# Entry keys:
#   id          entity_map.yaml dataset id (every dataset there has exactly one entry here)
#   commercial  true | false | unknown: may the set be used for a commercial product's evaluation;
#               `false` requires family report_only in entity_map.yaml
#   training    false: evaluation only (licence clause or no licence file); never in train_dev
#   internal    produced inside ARK (goldens, generators, R05); not fetched here
#   pending     recipe not written yet (reason); holdout recipes come from the holdout setup
#               through --overlay and never live in the repository
#   source      https://huggingface.co/datasets/<repo> or https://github.com/<owner>/<repo>
#   revision    pinned commit (40 hex), files: [{path, sha256}] verified on every fetch
#   format      jsonl | json (list of records) | csv | parquet (UTF-8 and plain integer columns)
#   text        record field holding the text; `language` a fixed code or `language_field`
#   labels      rules {field, equals (value or list) | at_least | below, label}; a rule without
#               field matches every row; `label` is the upstream label of entity_map.yaml. Every
#               row must match at least one rule, otherwise preparing fails (unmapped label).
#   cap         keep at most this many rows (default and upper bound: sampling.max_rows); sampled per
#               stratum (benign, classes, language) with the sampling seed, see prepare_corpora.py
#
# Checked by: python3 scripts/l1_threat/prepare_corpora.py check

schema: ark-l1-threat-datasets-v1

dedup:
  # Texts are compared after NFKC, case folding and whitespace collapsing.
  shingle_chars: 5
  permutations: 64
  bands: 16
  threshold: 0.8
  seed: ark-l1-threat-e01-v1

# Row cap of every set after deduplication: no set dominates the pool, and a set larger than the cap
# keeps the share of each stratum (benign, classes, language). Changing the seed or the cap re-freezes.
sampling:
  max_rows: 15000
  seed: ark-l1-threat-m05-v1

