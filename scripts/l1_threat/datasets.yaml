  - id: approve_or_deny_de
    commercial: true
    # The evaluation split (3,000 items, 82 German); `text` is the set's own rendering of call, request and history.
    source: https://huggingface.co/datasets/ProCreations/approve-or-deny
    revision: a38b625913dd46ca9702063f1597c979e6ace34e
    files:
      - {path: test.parquet, sha256: 13607db717323399fb394885fdbf80663e5262b219683361c79e148853bc2ec1}
    format: parquet
    text: text
    language: de
    labels:
      # The deny rows fall into three buckets by the proposed call (the text before `### USER REQUEST`):
      # a call whose own text carries the risk is scored, a call of a shell or CLI tool goes to
      # shell_command, and every other deny row is risky only against the user's request.
      - field: text
        matches: &call_risk >-
          \A### PROPOSED TOOL CALL\n(?:(?!### USER REQUEST)[\s\S]){0,4000}?(?:\b(?:curl|wget)\b[^\n|;]{0,240}\|[ \t]{0,16}(?:ba|z)?sh\b|https?://\d{1,3}(?:\.\d{1,3}){3}/\S{0,200}\.sh\b|NOPASSWD:\s{0,8}ALL|\bhistory\s+-c\b|\bshred\b[^\n]{0,200}_history|\btruncate\s+-s\s{0,4}0\s+/var/log/|(?i:\b(?:drop|truncate)\s+(?:table|schema|database)\s+(?:if\s+exists\s+)?|\bdelete\s+from\s+)["`]?prod(?:uction)?\w{0,20}\.|(?:\brmtree\(|\brm\s+-\w{0,4}r\w{0,4}\s+)['"]?/home/[\w.-]+/?['"]?(?![\w/.-]))
        and: [{field: label, equals: deny}, {field: lang, equals: German}]
        label: "deny, risk visible in the proposed call"
      - field: text
        matches: &shell_tool \A### PROPOSED TOOL CALL\ntool:[ \t]*(?:terminal|bash|Bash|shell|run_shell|ssh_exec|terraform|npm|pip|docker|kubectl)[ \t]*\n
        and: [{field: label, equals: deny}, {field: lang, equals: German}, {field: text, not_matches: *call_risk}]
        label: "deny, shell or CLI tool call"
      - field: text
        not_matches: *call_risk
        and: [{field: label, equals: deny}, {field: lang, equals: German}, {field: text, not_matches: *shell_tool}]
        label: "deny, risk only against the user request"
      - {field: label, equals: approve, and: [{field: lang, equals: German}], label: "approve"}
      - field: category
        equals: self_permission_tamper
        and: [{field: lang, equals: German}, {field: label, equals: deny}]
        label: "category = self_permission_tamper (deny)"
      - field: category
        equals: credential_exfiltration
        and: [{field: lang, equals: German}, {field: label, equals: deny}]
        label: "category = credential_exfiltration (deny)"
      - field: lang
        equals: [English, Japanese, Korean, Italian, French, Russian, Spanish, Mandarin Chinese, Hindi, Portuguese]
        label: "lang other than German"
