# Competitor benchmarks (competitors.py, `scoreboard.py competitors` → scoreboard/competitors.md): the competitors'
# own sets, scored under the protocol of their paper. Evaluation only: never in a split, the mix, training or
# calibration, and never a holdout source (competitors.py check). `dataset` reuses a registered set's recipe;
# `files` pin the fetched files by SHA-256 (`revision`: the commit, or the Zenodo record version); `format` and `text`
# as in a recipe; `positive` rules (any match: an attack row, otherwise a negative) and `rows` rules (all must hold:
# the benchmark's split) use the recipe rule operators; `protocol` is one of competitors.PROTOCOLS; `pending` /
# `dropped` name why a benchmark is not measured.
  # Real agent customisation files and tool manifests (E14b): benign counterparts for tool_poisoning,
  # agent_config_tampering and memory_poisoning; every row is hand-labelled in research/l1-threat/labels/real_agent.jsonl.
  - id: real_cursorrules
    commercial: true
    source: https://github.com/PatrickJS/awesome-cursorrules
    revision: b044f956f021b6e8877f16781bcfc466a6a120e9
