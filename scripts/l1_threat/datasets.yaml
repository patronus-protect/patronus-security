# L1 threat dataset registry (E01): how prepare_corpora.py fetches and reads every dataset of
# entity_map.yaml. Nothing here is data; rows are fetched at evaluation time only and never committed.
#
# Licence, languages, split, source family and the meaning of every upstream label stay in
# entity_map.yaml; this file only adds what fetching needs. The role of a set is derived, not stored:
#   decisive  holdout set of a deciding family (neutral, ark_blind) that may be used commercially
#   dev       train_dev set (tuning, training, lexicon mining)
#   report    everything else (report split, ark_authored, baseline_trained, report_only,
#             commercial: false); reported, never decides
#
# Entry keys:
#   id          entity_map.yaml dataset id (every dataset there has exactly one entry here)
#   commercial  true | false | unknown: may the set be used for a commercial product's evaluation;
#               `false` requires family report_only in entity_map.yaml
#   training    false: evaluation only (licence clause or no licence file); never in train_dev
#   internal    produced inside ARK (goldens, generators, R05); not fetched here
#   pending     recipe not written yet (reason); holdout recipes come from the holdout setup
#               through --overlay and never live in the repository
#   dropped     left out for good (reason: licence, quality, overlap with the holdout); never fetched
#   source      https://huggingface.co/datasets/<repo> or https://github.com/<owner>/<repo>
#   revision    pinned commit (40 hex), files: [{path, sha256}] verified on every fetch
#   format      jsonl (gzip when the file ends in .gz; `records` reads each line as a document) | json (list of records; `records` names the field holding them, '.' = one record per file, '*' expands list items or dict values) | text (one record per file: fields text and path) | csv | parquet (UTF-8, plain integer, floating-point and boolean columns) |
#               agentdojo_trace (one AgentDojo run trace per file; records: tool outputs, see prepare_corpora.py) |
#               bipia (BIPIA e-mail contexts and attack files together; records: e-mails with and without an attack)
#               | redcode (RedCode-Exec item lists and RedCode-Gen stubs; records: the requests of each Exec item, each stub)
#   text        record field holding the text; `language` a fixed code or `language_field`
#   language_map  {field value: code} for `language_field`; a row whose value is not in it is dropped (dropped.language)
#   language_cues [{language, pattern}] with a fixed `language`: the first case-insensitive regex found in the text sets
#               the row's language instead (sets without a language column)
#   labels      rules {field, equals (value or list) | contains (value or list) | excludes (value or list) | at_least |
#               below, label}; a rule without field matches every row; `contains` reads the field as a list (or a
#               comma-separated string) and needs one of the given items in it, `excludes` needs none of them; `and` [{field, equals |
#               contains | excludes | at_least | below}] adds conditions on other
#               fields that must all hold; `label` is the upstream label of entity_map.yaml. Every
#               row must match at least one rule, otherwise preparing fails (unmapped label).
#   keep        cue filters [{label, pattern, reason}]: a row carrying the upstream `label` is kept only
#               when the case-insensitive regex `pattern` finds a cue in its text; the others are dropped
#               and counted in the manifest (dropped.no_cue). For upstream labels that mark rows without
#               the attack in their text; `reason` names why.
#   dedup_against  other train_dev or report sets: a row duplicating one of their rows is dropped
#               (dropped.cross_set); for sets derived from those (translations of the same prompts)
#   cap         keep at most this many rows (default and upper bound: sampling.max_rows); sampled per
#               stratum (benign, classes, language) with the sampling seed, see prepare_corpora.py
#
# Checked by: python3 scripts/l1_threat/prepare_corpora.py check

schema: ark-l1-threat-datasets-v1

# Corpus generation: raising it re-freezes every prepared split on the next run (row caps, new sets).
# 3: Tensor Trust extraction benchmark joins the holdout registry.
# 4: cue filters (keep) in the SPML and Mosscap recipes, TextDetox-DE and AILuminate demo report-only.
# 5: holdout mapping fixes after the owner review — jbb/xstest/hatecheck label splits,
#    cyberseceval/multijail/trustairlab/gahd attack labels reported only.
# 6: CyberSecEval multilingual (German part, override cue) joins train_dev, deduplicated against the other dev sets.
# 7: llmail_inject keeps only objective-confirmed rows as gold; the jbb and xstest toxic-language
#    sub-labels and the gahd recipe leave scoring (owner holdout review 2026-11-16).
# 8: WildJailbreak (adversarial eval split) joins train_dev: native jailbreak rows and jailbreak look-alike
#    hard negatives.
# 9: llmail_inject keeps only submissions with the executed attack chain (exfil.sent) as gold;
#    the retrieval-only flag proved too weak (owner re-check 2026-11-16, 17.6% error).
# 10: AgentDojo run traces join train_dev: native injection payloads in tool outputs (instruction_injection,
#     exfiltration, unsafe_action by the injection task's goal) and clean tool outputs as benign rows.
# 11: BIPIA (attacks inside e-mails) and the German rows of approve-or-deny (agent tool calls, translated)
#     join train_dev; the latter carry the first native agent_config_tampering rows.
# 12: BIPIA's task-irrelevant text attacks leave scoring (dev gold re-review 2026-11-17: bare requests such as
#     "Explain the theory of relativity." inside an e-mail carry no injection).
# 13: toxic_language gets a scored dev source: Nemotron Safety Guard v3 (human-labelled prompts that name the toxic
#     act, EN and the machine-translated DE part); Civil Comments (test split, capped) is reported only.
# 14: harmful_content gets a scored dev source: the harmful categories of Nemotron Safety Guard v3 (prompts that ask
#     for operational help, AILuminate hazard per row); the Aegis 2.0 training split, deduplicated against it, is
#     reported only; the vanilla benign prompts of the WildGuardMix test split count as hard negatives.
# 15: the jbb_behaviors harmful label is reported only (owner holdout re-check, 10% errors).
# 16: RedCode (Exec Python scenarios whose request is the risky action, Gen malware stubs) and the harmful-code
#     requests of Agent-SafetyBench join train_dev as native unsafe_action rows.
# 17: native holdout sources for the agent classes and jailbreak (autoredclaw, jbb_artifacts, agentharm
#     recipe); json recipes may name a `records` field.
# 18: MCPTox (CC BY 4.0, public since 2026-11-15) joins the holdout; `records` paths may expand with '*'.
#     autoredclaw and agentharm are reported only after the gen-17 owner review (84% / 25.5% label errors).
# 19: native text-visible sources for the agent classes — MalSkillBench (skills), MemForm (memory,
#     with clean twins); format `text` and rule operator `matches`.
# 20: MASSIVE (en-US and the localised de-DE training utterances) joins train_dev as the benign chat pool of
#     each language; the German jailbreak prompts of XL-SafetyBench join train_dev.
# 21: SimpleSafetyTests (CC-BY-2.0, 100 English requests in five harm areas) joins train_dev: a second scored English
#     harmful_content source next to Nemotron Safety Guard v3.
# 22: the Dynamically Generated Hate Speech Dataset (CC-BY-4.0, annotator-written English, original entries of the
#     dehumanisation and threat types) joins train_dev: a second scored English toxic_language source next to Nemotron Safety Guard v3.
# 23: the German insult prompts of XSafety (Apache-2.0, translated from Chinese) join
#     train_dev: a second scored German toxic_language source next to Nemotron Safety Guard v3. CSV recipes may name
#     the columns of a file without a header row.
# 24: the German deny rows of approve-or-deny split by the proposed call: scored only where the call's own text
#     carries the risk; shell and CLI tool calls go to shell_command, the rest (risky only against the user's
#     request) is reported only. Rule operator `not_matches`.
# 25: recipes for the registered sets (E11): neuralchemy, GenTel-Bench (goal hijacking, prompt leaking), PolyGuardPrompts
#     (English and German), the SaTML CTF successful chats join train_dev; deepset prompt-injections, InjecAgent and
#     GermEval 2021 are reported only; Tensor Trust, Nemotron IPI, AI Safety Brazil, GermEval 2019, GermEval 2025,
#     GerMS-AT and HackAPrompt are dropped with their reason.
# 26: real rules files (awesome-cursorrules, CC0), Copilot instructions and agent files (awesome-copilot, MIT) and
#     BFCL live tool descriptions and memory conversations (Apache-2.0) join train_dev as hand-labelled benign
#     counterparts for the agent classes; jsonl recipes may name `records` per line.
generation: 26

dedup:
  # Texts are compared after NFKC, case folding and whitespace collapsing.
  shingle_chars: 5
  permutations: 64
  bands: 16
  threshold: 0.8
  seed: ark-l1-threat-e01-v1

# Row cap of every set after deduplication: no set dominates the pool, and a set larger than the cap
# keeps the share of each stratum (benign, classes, language). Changing the seed or the cap re-freezes.
sampling:
  max_rows: 15000
  seed: ark-l1-threat-m05-v1

