[package]
name = "patronus-security"
version = "0.1.0"
edition = "2021"
authors = ["Patronus <team@patronus.studio>"]
description = "Hybrid Rust security scanners for prompt injection, DLP, PII, and agentic tool risks."
readme = "../README.md"
license = "Apache-2.0"
repository = "https://github.com/patronus-protect/patronus-security"
homepage = "https://github.com/patronus-protect/patronus-security"
documentation = "https://docs.rs/patronus-security"
keywords = ["security", "prompt-injection", "dlp", "pii"]
categories = ["authentication", "text-processing"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
aho-corasick = "1.1"
rayon = "1.10"
dirs = "5.0"
ureq = { version = "2.10", features = ["json"] }
ort = { version = "2.0.0-rc.12", features = ["half"] }
tokenizers = "0.23.1"
half = "2.1"
blake3 = "1.5"

[features]
default = []
onnx-coreml = ["ort/coreml"]
onnx-cuda = ["ort/cuda"]
onnx-directml = ["ort/directml"]
onnx-tensorrt = ["ort/tensorrt"]
