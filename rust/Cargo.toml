[package]
name = "patronus-ark"
version = "0.1.11"
edition = "2021"
authors = ["Casdo Labs GmbH <team@patronus.studio>"]
description = "Hybrid Rust security scanners for prompt injection, DLP, PII, and agentic tool risks."
readme = "../README.md"
license = "GPL-3.0-only"
repository = "https://github.com/patronus-protect/patronus-security"
homepage = "https://github.com/patronus-protect/patronus-security"
documentation = "https://docs.rs/patronus-ark"
keywords = ["security", "prompt-injection", "dlp", "pii"]
categories = ["authentication", "text-processing"]

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
regex-syntax = "0.8"
regex-automata = { version = "0.4", default-features = false, features = ["std", "meta", "syntax", "perf", "unicode"] }
aho-corasick = "1.1"
rayon = "1.10"
dirs = "5.0"
url = "2"
ureq = { version = "2.10", features = ["json"] }
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-24", "half"] }
tokenizers = { version = "0.23.1", optional = true, default-features = false, features = ["onig"] }
sentencepiece-rust = { version = "0.1.1", optional = true }
half = "2.1"
blake3 = "1.5"
memmap2 = "0.9"
redb = "4.1"
ring = "0.17"
thiserror = "1.0"
unicode-normalization = "0.1"

[features]
# `ml`: the model layers (ONNX Runtime, tokenizers, the security pipeline).
# Without it the crate is the rule layer alone (PII and DLP patterns with
# their validators, anchors, normalization), small enough for hosts that
# cannot carry ONNX Runtime, such as the iOS local tunnel.
default = ["ml"]
ml = ["dep:ort", "dep:tokenizers", "dep:sentencepiece-rust"]
# Internal hooks for the integration test suite; never enable in production builds.
test-util = []
onnx-coreml = ["ml", "ort/coreml"]
onnx-cuda = ["ml", "ort/cuda"]
onnx-directml = ["ml", "ort/directml"]
onnx-tensorrt = ["ml", "ort/tensorrt"]

[dev-dependencies]
patronus-ark = { path = ".", features = ["test-util"] }
serde_yaml = "0.9"

# Runs the evaluator's unit tests (span offsets) with `cargo test`.
[[example]]
name = "12_l1_pii_fixture_eval"
test = true

# Internal development, benchmark, and tokenizer-parity scripts.
# These are NOT user-facing examples (those live in examples/0X_*). They are
# kept under dev/ and registered with explicit paths so they keep compiling.

[[example]]
name = "all_categories_benchmark"
path = "dev/all_categories_benchmark.rs"

[[example]]
name = "gliner_onnx_ner_benchmark"
path = "dev/gliner_onnx_ner_benchmark.rs"

[[example]]
name = "injection_gliner_memory_smoke"
path = "dev/injection_gliner_memory_smoke.rs"

[[example]]
name = "injection_pair_gliner_benchmark"
path = "dev/injection_pair_gliner_benchmark.rs"

[[example]]
name = "local_l1_l2_gliner_benchmark"
path = "dev/local_l1_l2_gliner_benchmark.rs"

[[example]]
name = "ntdb_memory_smoke"
path = "dev/ntdb_memory_smoke.rs"

[[example]]
name = "ntdb_joint_v3_cache_eval"
path = "dev/ntdb_joint_v3_cache_eval.rs"

[[example]]
name = "wolf_memory_smoke"
path = "dev/wolf_memory_smoke.rs"

[[example]]
name = "l1_calibration"
path = "dev/l1_calibration.rs"

[[example]]
name = "l1_latency_workloads"
path = "dev/l1_latency_workloads.rs"
