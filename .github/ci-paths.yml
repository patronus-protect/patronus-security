# Changes to build inputs require the full test set; selection logic is tested in changes.
shared:
  - '**/Cargo.toml'
  - 'Cargo.lock'
  - 'rust-toolchain.toml'
  - '.cargo/**'
rust:
  - '**/*.rs'
  - 'ark-core/**'
  - 'rust/**'
  - '!**/*.md'
core:
  - 'ark-core/**'
  - '!**/*.md'
# Domain-only rules do not affect the other domain. Shared detector helpers do.
core_shared:
  - 'ark-core/**'
  - '!**/*.md'
  - '!ark-core/src/detectors/pii/**'
  - '!ark-core/src/detectors/dlp/**'
  - '!ark-core/src/detectors/anchor_lexicons/pii.json'
  - '!ark-core/src/detectors/anchor_lexicons/dlp.json'
  - '!ark-core/src/detectors/injection/**'
  - '!ark-core/src/detectors/mcp/**'
  - '!ark-core/src/injection_l1.rs'
  - '!ark-core/src/threat/**'
  - '!ark-core/src/wolf.rs'
  - '!ark-core/src/onnx.rs'
  - '!ark-core/src/ml/**'
  - '!ark-core/src/assets/**'
  - '!ark-core/src/warmup.rs'
  - '!ark-core/tests/**'
  - '!ark-core/examples/**'
  - '!ark-core/benches/**'
core_features:
  - 'ark-core/**'
  - '!**/*.md'
  - '!ark-core/src/detectors/pii/**'
  - '!ark-core/src/detectors/dlp/**'
  - '!ark-core/src/detectors/anchor_lexicons/pii.json'
  - '!ark-core/src/detectors/anchor_lexicons/dlp.json'
wrapper:
  - 'rust/**'
  - '!**/*.md'
  - '!rust/tests/pii*.rs'
  - '!rust/tests/dlp*.rs'
  - '!rust/examples/13_l1_golden_eval.rs'
l1_shared:
  - 'rust/src/**'
  - '!rust/src/assets/**'
  - '!rust/src/ml/**'
  - '!rust/src/cache/**'
  - '!rust/src/gliner_onnx_engine.rs'
  - '!rust/src/dynamic_pii.rs'
  - '!rust/src/detectors/shell/**'
  - '!rust/src/detectors/threat/**'
  - '!rust/src/golden_recipes.rs'
pii:
  - 'ark-core/src/detectors/pii/**'
  - 'ark-core/src/detectors/anchor_lexicons/pii.json'
  - 'rust/tests/pii*.rs'
  - 'rust/examples/12_l1_pii_fixture_eval.rs'
  - 'python/patronus_ark/benchmark_data/pii_l1.jsonl'
  - 'python/patronus_ark/pii_synth/**'
  - 'research/l1-pii/entity_map.yaml'
dlp:
  - 'ark-core/src/detectors/dlp/**'
  - 'ark-core/src/detectors/anchor_lexicons/dlp.json'
  - 'rust/tests/dlp*.rs'
  - 'rust/tests/fixtures/dlp*'
  # DLP imports these PII context/scoring types.
  - 'ark-core/src/detectors/pii/context.rs'
  - 'ark-core/src/detectors/pii/score.rs'
  - 'rust/src/golden_recipes.rs'
  - 'python/patronus_ark/benchmark_data/dlp_l1.jsonl'
  - 'python/patronus_ark/dlp_synth/**'
  - 'research/dlp/entity_map.yaml'
golden:
  - 'rust/examples/13_l1_golden_eval.rs'
engine:
  - 'ark-core/src/**'
  - 'ark-core/build.rs'
  - 'rust/src/**'
api:
  - 'ark-api/**'
  - '!**/*.md'
coordinator:
  - 'ark-coordinator/**'
  - '!**/*.md'
protocol:
  - 'ark-distributed-protocol/**'
  - '!**/*.md'
bindings:
  - 'python/src/**'
  - 'ark-core/python/**'
  - '!**/*.md'
python:
  - 'python/**'
  - 'scripts/**'
  - '!scripts/ci_*.py'
  - '!scripts/tests/test_ci_*.py'
  - 'research/**'
  - 'requirements-test.txt'
  - '.python-version'
  - '!**/*.md'
throughput:
  - 'ark-core/src/**'
  - 'rust/src/**'
  - 'python/src/**'
  - 'scripts/ark_api_throughput_benchmark.py'
licenses:
  - '**/deny.toml'
  - 'LICENSE*'
  - 'NOTICE'
