name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test -p patronus-ark
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install maturin
      - run: .venv/bin/python -m maturin develop --manifest-path python/Cargo.toml
      - run: .venv/bin/python -m unittest discover -s python/tests
