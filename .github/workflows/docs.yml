name: docs

# Build and deploy the MkDocs Material site to GitHub Pages.
# Deployment currently runs from the docs branch (docs are not merged to main yet);
# switch the branch filters back to main once the documentation lands there.

on:
  push:
    branches: [docs/mkdocs-documentation]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MkDocs Material
        run: pip install "mkdocs-material>=9.5"
      - name: Build site (strict)
        run: mkdocs build --strict
      - name: Upload artifact
        if: github.ref == 'refs/heads/docs/mkdocs-documentation'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/docs/mkdocs-documentation'
    needs: build
    # GitHub Pages is unavailable while this repository is private (free plan).
    # Non-blocking until the repo goes public and Pages is enabled — then remove this line.
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
