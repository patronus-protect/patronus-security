[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "patronus_security"
version = "0.1.0"
description = "Python bindings for Patronus Security's hybrid Rust security scanners."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["security", "prompt-injection", "dlp", "pii"]
license = { text = "Apache-2.0" }
authors = [
    { name = "Patronus", email = "team@patronus.studio" },
]
maintainers = [
    { name = "Patronus", email = "team@patronus.studio" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/patronus-protect/patronus-security"
Repository = "https://github.com/patronus-protect/patronus-security"
Issues = "https://github.com/patronus-protect/patronus-security/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "patronus_security._patronus_security"
