[package]
name = "patronus-ark-core-python"
version = "0.1.14"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gil-refs"))'] }

[lib]
name = "_patronus_ark_core"
crate-type = ["cdylib"]

[dependencies]
patronus-ark-core = { path = "..", version = "0.1.14" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
serde = "1"
serde_json = "1"

[features]
default = ["download"]
wolf = ["patronus-ark-core/wolf"]
download = ["wolf", "patronus-ark-core/download"]
onnx-coreml = ["wolf", "patronus-ark-core/onnx-coreml"]
onnx-cuda = ["wolf", "patronus-ark-core/onnx-cuda"]
onnx-directml = ["wolf", "patronus-ark-core/onnx-directml"]
onnx-tensorrt = ["wolf", "patronus-ark-core/onnx-tensorrt"]
