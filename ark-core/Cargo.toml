[package]
name = "patronus-ark-core"
version = "0.1.13"
edition = "2021"
build = "build.rs"
license = "MIT OR Apache-2.0"
description = "Synchronous native security scanning with optional local Wolf inference"
readme = "README.md"
repository = "https://github.com/patronus-protect/patronus-security"

[features]
default = []
test-util = []
wolf = ["dep:ort", "dep:half", "dep:blake3", "dep:fs2"]
download = ["wolf", "dep:ureq", "dep:home"]
onnx-coreml = ["wolf", "ort/coreml"]
onnx-cuda = ["wolf", "ort/cuda"]
onnx-directml = ["wolf", "ort/directml"]
onnx-tensorrt = ["wolf", "ort/tensorrt"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.10"
regex-syntax = "0.8"
phonenumber = "0.3.10"
regex-automata = { version = "0.4", default-features = false, features = ["std", "meta", "syntax", "perf", "unicode"] }
aho-corasick = "1.1"
rayon = "1.10"
url = "2"
unicode-normalization = "0.1"
log = "0.4"
ring = "0.17"
thiserror = "1"
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "lax-feature-matching", "tls-rustls", "copy-dylibs", "api-24", "half"] }
half = { version = "2.1", optional = true }
blake3 = { version = "1.5", optional = true }
ureq = { version = "2.12", optional = true }
home = { version = "0.5.12", optional = true }
fs2 = { version = "0.4", optional = true }

[dev-dependencies]
serde_yaml = "0.9"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }

[[example]]
name = "wolf_benchmark"
required-features = ["wolf"]

[[example]]
name = "prepare_wolf_bundle"
required-features = ["wolf"]
